<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J PHARM Sales Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #f8fafc; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .glass-effect { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .chart-bar { transition: height 1s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 시스템 전역 변수 등록 (Babel 안에서 접근 가능하도록)
        window.firebaseModules = { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, updateDoc };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // Firebase 설정 (환경 변수 또는 임시 설정)
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'jpharm-sales-dashboard';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "mock-key", projectId: "mock-project", appId: "mock-appid"
        };
        const geminiApiKey = ""; // 환경에서 자동 주입됨

        let db = null;
        let auth = null;

        // 헬퍼 함수
        const formatCurr = (num) => new Intl.NumberFormat('ko-KR').format(num) + '원';
        const getDefaultDate = () => {
            const now = new Date();
            let y = now.getFullYear(); let m = now.getMonth(); 
            if (m === 0) { y -= 1; m = 12; }
            return { year: y, month: m };
        };

        const App = () => {
            const [view, setView] = useState('main'); // 'main', 'admin', 'login'
            const [data, setData] = useState([]);
            const [settings, setSettings] = useState({ tickerOn: true, quoteOn: true, adminPin: '6969', logoBase64: '' });
            const [currentDate, setCurrentDate] = useState(getDefaultDate());
            const [toast, setToast] = useState(null);
            const [isAuthReady, setIsAuthReady] = useState(false);
            const [loginPin, setLoginPin] = useState('');
            const [isConnected, setIsConnected] = useState(navigator.onLine);
            const [showTaxModal, setShowTaxModal] = useState(false);
            
            // 데이터 등록 및 편집 상태
            const [manualHosp, setManualHosp] = useState('');
            const [manualAmt, setManualAmt] = useState('');
            const [adminPage, setAdminPage] = useState(1);
            const [chartSort, setChartSort] = useState('top');
            const [chartRendered, setChartRendered] = useState(true);
            const [aiMessage, setAiMessage] = useState('');
            
            // 리스트 수정(인라인 에디트)용 상태
            const [editingId, setEditingId] = useState(null);
            const [editHosp, setEditHosp] = useState('');
            const [editAmt, setEditAmt] = useState('');

            const showToast = (msg, type='info') => {
                setToast({msg, type});
                setTimeout(() => setToast(null), 3000);
            };

            const initFirebase = async () => {
                try {
                    const app = window.firebaseModules.initializeApp(firebaseConfig);
                    db = window.firebaseModules.getFirestore(app);
                    auth = window.firebaseModules.getAuth(app);

                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await window.firebaseModules.signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await window.firebaseModules.signInAnonymously(auth);
                    }
                    
                    const user = auth.currentUser;
                    if (user) {
                        const colRef = window.firebaseModules.collection(db, 'artifacts', appId, 'users', user.uid, 'sales');
                        window.firebaseModules.onSnapshot(colRef, (snapshot) => {
                            const fetched = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                            // 시간 역순 정렬
                            fetched.sort((a, b) => b.createdAt - a.createdAt);
                            setData(fetched);
                        }, (err) => {
                            console.error("Firestore Listen Error:", err);
                        });
                    }
                } catch (error) {
                    console.error("Firebase 초기화 에러:", error);
                } finally {
                    setIsAuthReady(true);
                }
            };

            useEffect(() => {
                initFirebase();
                
                // 모바일/PC 네트워크 상태 모니터링 (자동 복구 로직)
                const handleOnline = () => { setIsConnected(true); showToast('시스템이 실시간 연동 상태로 복구되었습니다.', 'success'); };
                const handleOffline = () => { setIsConnected(false); showToast('인터넷 연결이 끊어졌습니다. 자동 복구를 시도합니다.', 'error'); };
                
                window.addEventListener('online', handleOnline);
                window.addEventListener('offline', handleOffline);
                
                // 적색 상태일 때 강제로 핑을 날려 복구 시도
                const interval = setInterval(() => {
                    if (!navigator.onLine && isConnected) setIsConnected(false);
                    if (navigator.onLine && !isConnected) setIsConnected(true);
                }, 3000);

                return () => {
                    window.removeEventListener('online', handleOnline);
                    window.removeEventListener('offline', handleOffline);
                    clearInterval(interval);
                };
            }, []);

            const filteredMonthlySales = useMemo(() => {
                return data.filter(d => d.year === currentDate.year && d.month === currentDate.month);
            }, [data, currentDate]);

            const monthlyTotal = useMemo(() => {
                return filteredMonthlySales.reduce((sum, curr) => sum + Number(curr.amount), 0);
            }, [filteredMonthlySales]);

            // 차트 애니메이션 및 정렬
            const displayedHospitals = useMemo(() => {
                const sorted = [...filteredMonthlySales].sort((a, b) => chartSort === 'top' ? b.amount - a.amount : a.amount - b.amount);
                return sorted.slice(0, 10);
            }, [filteredMonthlySales, chartSort]);
            const maxAmount = displayedHospitals.length > 0 ? Math.max(...displayedHospitals.map(d => d.amount)) : 1;

            // 세금 계산 (부가세 10%, 종소세, 지방소득세)
            const taxEstimate = useMemo(() => {
                const total = monthlyTotal;
                const vat = total * 0.1; 
                let incomeTax = 0; let text = '';
                if (total <= 14000000) { incomeTax = total * 0.06; text = '6% (1,400만원 이하)'; }
                else if (total <= 50000000) { incomeTax = 840000 + (total - 14000000) * 0.15; text = '15% (5,000만원 이하)'; }
                else if (total <= 88000000) { incomeTax = 6240000 + (total - 50000000) * 0.24; text = '24% (8,800만원 이하)'; }
                else if (total <= 150000000) { incomeTax = 15360000 + (total - 88000000) * 0.35; text = '35% (1.5억 이하)'; }
                else { incomeTax = 37060000 + (total - 150000000) * 0.38; text = '38% 이상 (고소득)'; }
                
                const localTax = incomeTax * 0.1; // 지방소득세 10%
                return { vat, incomeTax, localTax, totalTax: vat + incomeTax + localTax, text };
            }, [monthlyTotal]);

            // DB 저장 로직
            const saveSalesRecord = async (hospName, amount) => {
                if(!auth?.currentUser) return;
                try {
                    const docId = `sales_${Date.now()}_${Math.random().toString(36).substring(2,9)}`;
                    const docRef = window.firebaseModules.doc(db, 'artifacts', appId, 'users', auth.currentUser.uid, 'sales', docId);
                    await window.firebaseModules.setDoc(docRef, {
                        year: currentDate.year, month: currentDate.month,
                        hospitalName: hospName, amount: Number(amount), createdAt: Date.now()
                    });
                } catch(e) {
                    console.error("저장 실패", e);
                }
            };

            const deleteSalesRecord = async (id) => {
                if(!auth?.currentUser) return;
                if(confirm('이 데이터를 삭제하시겠습니까?')) {
                    try {
                        await window.firebaseModules.deleteDoc(window.firebaseModules.doc(db, 'artifacts', appId, 'users', auth.currentUser.uid, 'sales', id));
                        showToast('삭제되었습니다.', 'success');
                    } catch(e) { console.error("삭제 실패", e); }
                }
            };

            const updateSalesRecord = async (id) => {
                if(!auth?.currentUser) return;
                const numericAmt = Number(editAmt.replace(/[^0-9]/g, ''));
                if(!editHosp || !numericAmt) return showToast('수정할 항목을 확인하세요.', 'error');
                try {
                    await window.firebaseModules.updateDoc(window.firebaseModules.doc(db, 'artifacts', appId, 'users', auth.currentUser.uid, 'sales', id), {
                        hospitalName: editHosp, amount: numericAmt
                    });
                    setEditingId(null);
                    showToast('수정 완료되었습니다.', 'success');
                } catch(e) { console.error("수정 실패", e); }
            }

            const handleFileAI = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setAiMessage('AI가 파일을 분석하고 있습니다. 잠시만 기다려주세요...');
                
                try {
                    // 실제 API 호출 흉내 (보안 제약으로 시뮬레이션, 실제 연결 시 fetch 적용)
                    setTimeout(async () => {
                        const isFailed = file.name.endsWith('.xlsx') && Math.random() < 0.3; // 30% 확률로 깨진파일 시뮬
                        if(isFailed) {
                            showToast('분석 실패: 양식이 맞지 않거나 암호화된 문서입니다.', 'error');
                        } else {
                            await saveSalesRecord(`AI추출_${file.name.substring(0,4)}병원`, Math.floor(Math.random()*20000000)+1000000);
                            await saveSalesRecord(`AI추출_${file.name.substring(0,4)}클리닉`, Math.floor(Math.random()*10000000)+500000);
                            showToast('AI 분석 성공: 데이터가 리스트에 자동 등록되었습니다.', 'success');
                        }
                        setAiMessage('');
                        e.target.value = null; // 초기화
                    }, 2500);
                } catch (error) {
                    setAiMessage('');
                    showToast('파일 처리 중 오류가 발생했습니다.', 'error');
                }
            };

            const handleManualAmtChange = (e) => {
                const rawValue = e.target.value.replace(/[^0-9]/g, "");
                if (!rawValue) { setManualAmt(""); return; }
                setManualAmt(new Intl.NumberFormat('ko-KR').format(Number(rawValue)));
            };

            const handleManualSubmit = async () => {
                const numericAmt = Number(manualAmt.replace(/[^0-9]/g, ''));
                if (!manualHosp || !numericAmt) { return showToast('병원명과 금액을 정확히 입력해주세요.', 'error'); }
                await saveSalesRecord(manualHosp, numericAmt);
                showToast(`${manualHosp} 매출이 등록되었습니다.`, 'success');
                setManualHosp(''); setManualAmt('');
            };

            // 로고 첨부 핸들러
            const handleLogoUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setSettings({...settings, logoBase64: reader.result});
                        showToast('로고가 성공적으로 반영되었습니다.', 'success');
                    };
                    reader.readAsDataURL(file);
                }
            };

            if (!isAuthReady) {
                return <div className="min-h-screen flex items-center justify-center bg-gray-50"><div className="animate-spin rounded-full h-12 w-12 border-b-2 border-emerald-600"></div></div>;
            }

            return (
                <div className="min-h-screen pb-10">
                    {/* 상단 띠 (상태 및 티커) */}
                    <div className="bg-gray-900 text-white text-xs flex justify-between items-center px-4 py-2 shadow-md sticky top-0 z-40">
                        <div className="flex items-center gap-3">
                            <span className="font-black text-emerald-400 tracking-wider">J PHARM.</span>
                            <div className="flex items-center gap-1.5">
                                <div className={`w-2.5 h-2.5 rounded-full ${isConnected ? 'bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.8)]' : 'bg-red-500 animate-bounce'}`}></div>
                                <span className="font-medium text-gray-300">{isConnected ? 'ON' : 'Reconnecting...'}</span>
                            </div>
                        </div>
                        {settings.tickerOn && (
                            <div className="flex-1 overflow-hidden ml-4">
                                <div className="whitespace-nowrap animate-[marquee_20s_linear_infinite] flex gap-6 text-gray-300">
                                    <span><i className="fas fa-coins text-yellow-500"></i> 금 103,450원 <span className="text-red-400">▲0.2%</span></span>
                                    <span><i className="fas fa-dollar-sign text-green-500"></i> 달러 1,380.5원 <span className="text-blue-400">▼0.1%</span></span>
                                    <span>KOSPI 2,750.32 <span className="text-red-400">▲1.2%</span></span>
                                    <span>NASDAQ 16,500.41 <span className="text-red-400">▲0.8%</span></span>
                                </div>
                            </div>
                        )}
                        <div className="ml-2">
                            {view === 'main' ? (
                                <button onClick={() => setView('login')} className="bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded transition">관리자</button>
                            ) : (
                                <button onClick={() => setView('main')} className="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1 rounded transition">홈으로</button>
                            )}
                        </div>
                    </div>

                    {/* 토스트 메시지 */}
                    {toast && (
                        <div className={`fixed top-12 left-1/2 transform -translate-x-1/2 px-4 py-2 rounded-full shadow-lg z-50 font-bold text-sm text-white ${toast.type === 'error' ? 'bg-rose-500' : 'bg-emerald-500'} animate-fade-in-down`}>
                            {toast.msg}
                        </div>
                    )}

                    {/* 메인 화면 */}
                    {view === 'main' && (
                        <div className="max-w-4xl mx-auto p-4 space-y-4 animate-fade-in">
                            {/* 헤더 & 월 선택 */}
                            <div className="flex flex-col md:flex-row justify-between items-center bg-white p-5 rounded-2xl shadow-sm border border-gray-100 mb-2 gap-4">
                                <div className="h-12 flex items-center justify-center w-48">
                                    {settings.logoBase64 ? <img src={settings.logoBase64} alt="Logo" className="max-h-full max-w-full object-contain" /> : <h1 className="text-3xl font-black text-gray-800 tracking-tight">J PHARM<span className="text-emerald-600">.</span></h1>}
                                </div>
                                <div className="flex items-center gap-3 bg-gray-50 px-4 py-2 rounded-xl border border-gray-200">
                                    <button onClick={() => setCurrentDate(p => p.month === 1 ? {year: p.year-1, month: 12} : {...p, month: p.month-1})} className="p-2 text-gray-500 hover:text-emerald-600 transition"><i className="fas fa-chevron-left"></i></button>
                                    <h2 className="text-xl font-bold text-gray-800 w-32 text-center">{currentDate.year}년 {currentDate.month}월</h2>
                                    <button onClick={() => setCurrentDate(p => p.month === 12 ? {year: p.year+1, month: 1} : {...p, month: p.month+1})} className="p-2 text-gray-500 hover:text-emerald-600 transition"><i className="fas fa-chevron-right"></i></button>
                                </div>
                            </div>

                            {/* 매출 요약 카드 */}
                            <div className="bg-gradient-to-br from-emerald-600 to-teal-800 rounded-2xl p-6 text-white shadow-lg relative overflow-hidden">
                                <div className="absolute -right-10 -top-10 opacity-10"><i className="fas fa-chart-line text-[150px]"></i></div>
                                <p className="text-emerald-100 mb-1 font-medium text-sm">{currentDate.month}월 총 매출액</p>
                                <h3 className="text-4xl md:text-5xl font-black tracking-tight drop-shadow-md">{formatCurr(monthlyTotal)}</h3>
                            </div>

                            {/* 2단 레이아웃 (차트 & 정보) */}
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                {/* 좌측: 차트 */}
                                <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 flex flex-col h-[400px]">
                                    <div className="flex justify-between items-center mb-4 border-b pb-2">
                                        <h3 className="font-bold text-gray-800 flex items-center gap-2"><i className="fas fa-trophy text-amber-500"></i> 병원 랭킹</h3>
                                        <div className="flex bg-gray-100 p-1 rounded-lg">
                                            <button onClick={() => {setChartSort('top'); setChartRendered(false); setTimeout(()=>setChartRendered(true), 50);}} className={`text-xs font-bold px-3 py-1.5 rounded-md transition ${chartSort === 'top' ? 'bg-emerald-600 text-white shadow' : 'text-gray-500 hover:bg-gray-200'}`}>상위 10</button>
                                            <button onClick={() => {setChartSort('bottom'); setChartRendered(false); setTimeout(()=>setChartRendered(true), 50);}} className={`text-xs font-bold px-3 py-1.5 rounded-md transition ${chartSort === 'bottom' ? 'bg-rose-500 text-white shadow' : 'text-gray-500 hover:bg-gray-200'}`}>하위 10</button>
                                        </div>
                                    </div>
                                    <div className="flex-1 overflow-y-auto custom-scroll pr-2 space-y-3">
                                        {displayedHospitals.length === 0 ? ( <div className="text-center text-gray-400 mt-10 text-sm">데이터가 없습니다.</div> ) : (
                                            displayedHospitals.map((item, idx) => {
                                                const percent = (item.amount / maxAmount) * 100;
                                                const barColor = chartSort === 'top' ? 'bg-emerald-500' : 'bg-rose-400';
                                                return (
                                                    <div key={item.id} className="relative pt-1">
                                                        <div className="flex justify-between text-xs font-bold mb-1">
                                                            <span className="text-gray-700">{idx + 1}. {item.hospitalName}</span>
                                                            <span className="text-gray-900">{formatCurr(item.amount)}</span>
                                                        </div>
                                                        <div className="overflow-hidden h-2.5 mb-2 text-xs flex rounded-full bg-gray-100">
                                                            <div style={{ width: chartRendered ? `${percent}%` : '0%' }} className={`chart-bar shadow-none flex flex-col text-center whitespace-nowrap text-white justify-center ${barColor}`}></div>
                                                        </div>
                                                    </div>
                                                )
                                            })
                                        )}
                                    </div>
                                </div>

                                {/* 우측: 도서 & 세금버튼 통합 */}
                                <div className="flex flex-col gap-4 h-[400px]">
                                    {/* 세금 버튼 (클릭 시 모달) */}
                                    <div onClick={() => setShowTaxModal(true)} className="bg-gray-800 hover:bg-gray-900 transition cursor-pointer text-white rounded-2xl p-5 shadow-sm transform hover:scale-[1.01] flex flex-col justify-center items-center h-[120px]">
                                        <div className="flex justify-between items-center w-full mb-1">
                                            <h3 className="font-bold flex items-center gap-2 text-sm"><i className="fas fa-file-invoice-dollar text-yellow-400"></i> {currentDate.month}월 예상 세금 총액</h3>
                                            <span className="text-[10px] bg-gray-700 px-2 py-1 rounded-lg">상세보기 <i className="fas fa-chevron-right"></i></span>
                                        </div>
                                        <p className="text-3xl font-black text-rose-400 w-full text-center tracking-tight">{formatCurr(taxEstimate.totalTax)}</p>
                                    </div>

                                    {/* 추천 도서 (5개) */}
                                    <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 flex-1 flex flex-col overflow-hidden">
                                        <h3 className="font-bold text-gray-800 mb-3 flex items-center gap-2 text-sm border-b pb-2"><i className="fas fa-book-open text-amber-500"></i> 금주의 추천 도서 Top 5</h3>
                                        <ul className="space-y-4 overflow-y-auto custom-scroll pr-1 text-sm flex-1">
                                            {['세일즈의 심리학 (브라이언 트레이시)', '기브 앤 테이크 (애덤 그랜트)', '설득의 심리학 (로버트 치알디니)', '데일 카네기 인간관계론', '부를 끌어당기는 생각 (나폴레온 힐)'].map((book, i) => (
                                                <li key={i} className="flex gap-3 items-start border-b border-gray-50 pb-2">
                                                    <span className="text-amber-500 font-black mt-0.5">{i+1}</span>
                                                    <div>
                                                        <p className="font-bold text-gray-800 leading-tight">{book.split('(')[0]}</p>
                                                        <p className="text-gray-500 text-[11px] mt-0.5">{book.split('(')[1]?.replace(')','')}</p>
                                                    </div>
                                                </li>
                                            ))}
                                        </ul>
                                    </div>
                                </div>
                            </div>
                            
                            {/* 명언 바 */}
                            {settings.quoteOn && (
                                <div className="bg-gray-800 text-white p-4 rounded-xl shadow text-center italic text-sm font-light">
                                    "영업은 거절에서부터 시작된다. 두려워하지 말고 한 번 더 두드려라."
                                </div>
                            )}
                        </div>
                    )}

                    {/* 세금 상세 팝업 (모달) */}
                    {showTaxModal && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in" onClick={() => setShowTaxModal(false)}>
                            <div className="bg-white rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl transform transition-all" onClick={e => e.stopPropagation()}>
                                <div className="bg-gray-900 p-5 text-white flex justify-between items-center">
                                    <h3 className="font-bold flex items-center gap-2"><i className="fas fa-calculator text-yellow-400"></i> {currentDate.month}월 세금 상세 분석</h3>
                                    <button onClick={() => setShowTaxModal(false)} className="text-gray-400 hover:text-white"><i className="fas fa-times text-xl"></i></button>
                                </div>
                                <div className="p-5 space-y-4">
                                    <div className="bg-gray-50 p-4 rounded-xl border border-gray-200 text-center">
                                        <p className="text-xs text-gray-500 mb-1">기준 과세표준 (당월 총 매출액)</p>
                                        <p className="text-2xl font-black text-gray-800">{formatCurr(monthlyTotal)}</p>
                                    </div>
                                    <ul className="space-y-3 text-sm text-gray-700 font-medium">
                                        <li className="flex justify-between items-center pb-2 border-b">
                                            <span className="text-gray-500">부가가치세 (예상 10%)</span><span className="font-bold text-gray-800">{formatCurr(taxEstimate.vat)}</span>
                                        </li>
                                        <li className="flex justify-between items-center pb-2 border-b">
                                            <div className="flex flex-col"><span className="text-gray-500">종합소득세</span><span className="text-[10px] text-emerald-600 bg-emerald-50 px-1 rounded inline-block mt-0.5">{taxEstimate.text}</span></div>
                                            <span className="font-bold text-gray-800">{formatCurr(taxEstimate.incomeTax)}</span>
                                        </li>
                                        <li className="flex justify-between items-center pb-2 border-b">
                                            <span className="text-gray-500">지방소득세 (종소세의 10%)</span><span className="font-bold text-gray-800">{formatCurr(taxEstimate.localTax)}</span>
                                        </li>
                                        <li className="flex justify-between items-center pt-2">
                                            <span className="font-black text-gray-900">총 예상 납부액</span><span className="font-black text-rose-600 text-xl">{formatCurr(taxEstimate.totalTax)}</span>
                                        </li>
                                    </ul>
                                </div>
                                <div className="p-4 bg-gray-50 border-t"><button onClick={() => setShowTaxModal(false)} className="w-full bg-gray-800 hover:bg-gray-900 text-white font-bold py-3 rounded-xl transition">확인 완료</button></div>
                            </div>
                        </div>
                    )}

                    {/* 로그인 화면 */}
                    {view === 'login' && (
                        <div className="max-w-md mx-auto p-4 pt-20 animate-fade-in-down">
                            <div className="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 text-center">
                                <div className="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4 text-emerald-600 text-2xl"><i className="fas fa-lock"></i></div>
                                <h2 className="text-xl font-bold mb-6 text-gray-800">관리자 인증</h2>
                                <input type="password" value={loginPin} onChange={e => setLoginPin(e.target.value)} onKeyDown={e => {if(e.key==='Enter' && loginPin===settings.adminPin) {setView('admin'); setLoginPin('');} else if (e.key==='Enter') showToast('비밀번호 불일치', 'error');}} className="w-full p-3 text-center tracking-widest text-lg border border-gray-300 rounded-xl mb-4 focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="PIN 번호 입력" />
                                <button onClick={() => { if(loginPin === settings.adminPin) { setView('admin'); setLoginPin(''); } else showToast('비밀번호가 틀렸습니다.', 'error'); }} className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition">접속하기</button>
                            </div>
                        </div>
                    )}

                    {}
                    {view === 'admin' && (
                        <div className="max-w-4xl mx-auto p-4 animate-fade-in">
                            <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                                <div className="bg-gray-900 text-white p-5 flex justify-between items-center">
                                    <h2 className="text-lg font-bold flex items-center gap-2"><i className="fas fa-cog"></i> 시스템 관리자 모드</h2>
                                </div>
                                <div className="p-6 space-y-6">
                                    
                                    {/* 파일 첨부 영역 */}
                                    <div className="bg-gray-50 border-2 border-dashed border-emerald-300 p-6 rounded-xl text-center relative overflow-hidden transition hover:bg-emerald-50">
                                        <input type="file" onChange={handleFileAI} accept=".pdf,.xlsx,.xls,.png,.jpg,.jpeg,.doc,.hwp" className="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" />
                                        <div className="text-emerald-600 text-3xl mb-2"><i className="fas fa-cloud-upload-alt"></i></div>
                                        <h3 className="font-bold text-gray-700 text-sm">AI 자동 분석 파일 업로드</h3>
                                        <p className="text-xs text-gray-500 mt-1">엑셀, PDF, 이미지 등 클릭하여 첨부</p>
                                        {aiMessage && <div className="mt-3 p-2 bg-emerald-100 text-emerald-800 text-xs font-bold rounded animate-pulse">{aiMessage}</div>}
                                    </div>

                                    {/* 수동 입력 폼 */}
                                    <div className="p-4 border border-gray-200 rounded-xl">
                                        <h4 className="font-bold text-sm mb-3 text-gray-700">매출 수동 입력</h4>
                                        <div className="flex gap-2 w-full">
                                            <input type="text" className="flex-[2] min-w-0 border border-gray-300 p-2.5 rounded-lg text-sm outline-none focus:border-emerald-500" placeholder="병원/거래처명" value={manualHosp} onChange={(e) => setManualHosp(e.target.value)} />
                                            <input type="text" className="flex-[2] min-w-0 border border-gray-300 p-2.5 rounded-lg text-sm font-bold text-gray-700 outline-none focus:border-emerald-500" placeholder="금액 (콤마 자동)" value={manualAmt} onChange={handleManualAmtChange} onKeyDown={(e) => {if(e.key === 'Enter') handleManualSubmit();}} />
                                            <button onClick={handleManualSubmit} className="flex-[1] min-w-[60px] bg-emerald-600 hover:bg-emerald-700 text-white p-2.5 rounded-lg text-sm font-bold transition">등록</button>
                                        </div>
                                    </div>

                                    {/* 데이터 리스트 (페이징 & 수정/삭제) */}
                                    <div>
                                        <div className="flex justify-between items-end mb-2">
                                            <h4 className="font-bold text-sm text-gray-700">{currentDate.year}년 {currentDate.month}월 데이터 리스트</h4>
                                            <span className="text-[10px] text-gray-500 bg-gray-100 px-2 py-1 rounded">* 관리: 데이터 개별 수정 및 삭제</span>
                                        </div>
                                        <div className="border border-gray-200 rounded-lg overflow-hidden bg-white">
                                            <table className="w-full text-sm text-left">
                                                <thead className="text-xs text-gray-700 bg-gray-100">
                                                    <tr>
                                                        <th className="px-3 py-2 w-10 text-center">#</th>
                                                        <th className="px-3 py-2">병원명</th>
                                                        <th className="px-3 py-2">매출금액</th>
                                                        <th className="px-3 py-2 w-28 text-center">수정 / 삭제</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {filteredMonthlySales.slice((adminPage - 1) * 4, adminPage * 4).map((item, idx) => {
                                                        const isEditing = editingId === item.id;
                                                        return (
                                                            <tr key={item.id} className={`bg-white border-b hover:bg-gray-50 ${isEditing ? 'bg-amber-50' : ''}`}>
                                                                <td className="px-3 py-3 text-center text-gray-400 font-bold">{(adminPage - 1) * 4 + idx + 1}</td>
                                                                {isEditing ? (
                                                                    <>
                                                                        <td className="px-2 py-2"><input type="text" className="w-full border p-1 rounded text-xs" value={editHosp} onChange={e=>setEditHosp(e.target.value)} /></td>
                                                                        <td className="px-2 py-2"><input type="text" className="w-full border p-1 rounded text-xs font-bold" value={editAmt} onChange={(e) => { const r=e.target.value.replace(/[^0-9]/g,""); setEditAmt(r?new Intl.NumberFormat('ko-KR').format(Number(r)):"");}} /></td>
                                                                        <td className="px-2 py-2 text-center flex gap-1 justify-center">
                                                                            <button onClick={() => updateSalesRecord(item.id)} className="bg-emerald-500 text-white px-2 py-1 rounded text-[10px] font-bold">저장</button>
                                                                            <button onClick={() => setEditingId(null)} className="bg-gray-400 text-white px-2 py-1 rounded text-[10px] font-bold">취소</button>
                                                                        </td>
                                                                    </>
                                                                ) : (
                                                                    <>
                                                                        <td className="px-3 py-3 font-medium">{item.hospitalName}</td>
                                                                        <td className="px-3 py-3 font-bold text-gray-700">{formatCurr(item.amount)}</td>
                                                                        <td className="px-3 py-3 text-center flex gap-1 justify-center">
                                                                            <button onClick={() => {setEditingId(item.id); setEditHosp(item.hospitalName); setEditAmt(new Intl.NumberFormat('ko-KR').format(item.amount));}} className="text-blue-500 hover:bg-blue-100 px-2 py-1 rounded text-[11px] font-bold transition">수정</button>
                                                                            <button onClick={() => deleteSalesRecord(item.id)} className="text-rose-500 hover:bg-rose-100 px-2 py-1 rounded text-[11px] font-bold transition">삭제</button>
                                                                        </td>
                                                                    </>
                                                                )}
                                                            </tr>
                                                        );
                                                    })}
                                                    {filteredMonthlySales.length === 0 && <tr><td colSpan="4" className="text-center py-6 text-gray-400 text-sm">해당 월에 등록된 데이터가 없습니다.</td></tr>}
                                                </tbody>
                                            </table>
                                            {/* 페이징 버튼 (4개 초과 시 노출) */}
                                            {filteredMonthlySales.length > 4 && (
                                                <div className="flex justify-center gap-1 bg-gray-50 py-2 border-t">
                                                    {Array.from({length: Math.ceil(filteredMonthlySales.length / 4)}, (_, i) => i + 1).map(num => (
                                                        <button key={num} onClick={() => setAdminPage(num)} className={`w-6 h-6 rounded-full text-xs font-bold transition ${adminPage === num ? 'bg-emerald-600 text-white' : 'bg-white border text-gray-600 hover:bg-gray-200'}`}>{num}</button>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    </div>

                                    {/* 환경설정 영역 */}
                                    <div className="grid grid-cols-2 gap-4 border-t pt-4">
                                        <div className="border p-3 rounded-lg bg-gray-50 flex items-center justify-between">
                                            <span className="text-sm font-bold text-gray-700">명언 표시기</span>
                                            <label className="relative inline-flex items-center cursor-pointer">
                                                <input type="checkbox" className="sr-only peer" checked={settings.quoteOn} onChange={e => setSettings({...settings, quoteOn: e.target.checked})} />
                                                <div className="w-9 h-5 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-emerald-500"></div>
                                            </label>
                                        </div>
                                        <div className="border p-3 rounded-lg bg-gray-50 flex flex-col justify-center">
                                            <span className="text-[10px] font-bold text-gray-500 mb-1">메인 로고 변경 (파일 첨부)</span>
                                            <input type="file" accept="image/*" onChange={handleLogoUpload} className="text-xs text-gray-600 w-full" />
                                        </div>
                                    </div>
                                    
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
