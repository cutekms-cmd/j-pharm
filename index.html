<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J PHARM Sales Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/lunar-javascript/lunar.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; overflow-x: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes marquee { 
            0% { transform: translateX(100%); } 
            100% { transform: translateX(-100%); } 
        }
        .animate-marquee { display: inline-block; animation: marquee 20s linear infinite; }
        .chart-bar { transition: width 1s cubic-bezier(0.4, 0, 0.2, 1); }
        .polyline-animate { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: dash 2s ease-out forwards; }
        @keyframes dash { to { stroke-dashoffset: 0; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden text-gray-800">
    <div id="root" class="h-full w-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const supabaseUrl = 'https://gyqaartzrlsqvbvvyhgb.supabase.co';
        const supabaseKey = 'sb_publishable_MYC70x3Kmmyn3hU8kGgTDw_-uCsYIuc';
        const supabase = window.supabase ? window.supabase.createClient(supabaseUrl, supabaseKey) : null;

        const getDefaultDate = () => {
            const today = new Date();
            let year = today.getFullYear();
            let month = today.getMonth();
            if (month === 0) { year -= 1; month = 12; }
            return { year, month };
        };

        const formatCurr = (num) => new Intl.NumberFormat('ko-KR').format(Math.ceil(Number(num))) + '원';
        
        const formatDateWithDay = (date) => {
            const days = ['일', '월', '화', '수', '목', '금', '토'];
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            const day = days[date.getDay()];
            return `${y}.${m}.${d}(${day})`;
        };

        const App = () => {
            const [view, setView] = useState('main'); 
            const [salesData, setSalesData] = useState([
                { id: 1, year: 2026, month: 6, hospitalName: '서울대병원', amount: 15000000, commission: 1500000 },
                { id: 2, year: 2026, month: 6, hospitalName: '아산병원', amount: 12500000, commission: 1200000 },
                { id: 3, year: 2026, month: 6, hospitalName: '세브란스', amount: 9800000, commission: 980000 },
                { id: 4, year: 2026, month: 6, hospitalName: '삼성의료원', amount: 8500000, commission: 850000 },
                { id: 5, year: 2026, month: 6, hospitalName: '성모병원', amount: 7200000, commission: 720000 },
                { id: 6, year: 2026, month: 5, hospitalName: '서울대병원', amount: 14000000, commission: 1400000 },
                { id: 7, year: 2026, month: 4, hospitalName: '서울대병원', amount: 11000000, commission: 1100000 }
            ]);
            
            const [settings, setSettings] = useState({ 
                tickerOn: true, quoteOn: true, adminPin: '6969', logoBase64: '', 
                monthlyTargets: { '2026-6': 50000000, '2026-5': 50000000, '2026-4': 40000000 } 
            });
            const [currentDate, setCurrentDate] = useState(getDefaultDate());
            const [toast, setToast] = useState(null);
            const [loginPin, setLoginPin] = useState("");
            const [isConnected, setIsConnected] = useState(navigator.onLine);
            const [isRecovering, setIsRecovering] = useState(false);
            const [newAdminPin, setNewAdminPin] = useState('');
            
            const [manualHosp, setManualHosp] = useState('');
            const [manualAmt, setManualAmt] = useState('');
            const [manualComm, setManualComm] = useState('');
            const [commType, setCommType] = useState('fixed');
            const [adminPage, setAdminPage] = useState(1);
            const [adminDate, setAdminDate] = useState(getDefaultDate());
            
            const [showTaxModal, setShowTaxModal] = useState(false);
            const [chartSort, setChartSort] = useState('current'); 
            const [chartRendered, setChartRendered] = useState(false);
            const [selectedHospDetail, setSelectedHospDetail] = useState(null);

            const [hospitalMaster, setHospitalMaster] = useState(['서울대병원', '아산병원', '세브란스', '삼성의료원', '성모병원']);
            const [doctorProfiles, setDoctorProfiles] = useState([
                { id: 1, hospitalName: '서울대병원', doctorName: '김의사', birthDate: '1975-08-25', isLunar: false, likes: '골프, 와인', family: '배우자, 1남' },
                { id: 2, hospitalName: '아산병원', doctorName: '이원장', birthDate: '1982-08-28', isLunar: true, likes: '테니스, 독서', family: '배우자' }
            ]);
            const [newDoc, setNewDoc] = useState({ hospitalName: '', doctorName: '', birthDate: '', isLunar: false, likes: '', family: '' });
            const [docPage, setDocPage] = useState(1);
            const [editDocId, setEditDocId] = useState(null);
            const [editDocData, setEditDocData] = useState({ doctorName: '', birthDate: '', isLunar: false, likes: '', family: '' });
            
            const [aiGiftMessage, setAiGiftMessage] = useState({});
            const [isAiLoading, setIsAiLoading] = useState(false);
            const [bdayPage, setBdayPage] = useState(1);
            const [taxCostOption, setTaxCostOption] = useState(0); 
            
            const [bookModal, setBookModal] = useState(null);
            const [isMobile, setIsMobile] = useState(window.innerWidth < 768);
            const [weatherData, setWeatherData] = useState(null);
            const [selectedDocDetail, setSelectedDocDetail] = useState(null);

            useEffect(() => {
                const handleResize = () => setIsMobile(window.innerWidth < 768);
                window.addEventListener('resize', handleResize);

                const fetchRealtimeData = async () => {
                    if (!supabase) return;
                    try {
                        const { data, error } = await supabase.from('sales_data').select('*');
                        if (!error && data) setSalesData(data);
                    } catch(e) {}
                };
                fetchRealtimeData();

                const fetchWeather = async () => {
                    try {
                        const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=37.3422,37.1408&longitude=127.9202,128.2144&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=Asia%2FSeoul&forecast_days=2');
                        const data = await res.json();
                        if (Array.isArray(data) && data.length >= 2) {
                            setWeatherData({ wonju: data[0].daily, jecheon: data[1].daily });
                        }
                    } catch(e) { console.error("Weather fetch failed", e); }
                };
                fetchWeather();

                const syncInterval = setInterval(() => { if (navigator.onLine) fetchRealtimeData(); }, 5000);

                const handleOnline = () => { setIsConnected(true); setIsRecovering(false); showToast('실시간 네트워크 연결 복구됨', 'success'); fetchRealtimeData(); };
                const handleOffline = () => { setIsConnected(false); showToast('네트워크 끊김. 자동 복구 대기 중...', 'error'); };
                
                window.addEventListener('online', handleOnline);
                window.addEventListener('offline', handleOffline);
                
                setTimeout(() => setChartRendered(true), 300);

                return () => {
                    clearInterval(syncInterval);
                    window.removeEventListener('resize', handleResize);
                    window.removeEventListener('online', handleOnline); window.removeEventListener('offline', handleOffline);
                };
            }, []);

            const showToast = (msg, type='info') => {
                setToast({msg, type});
                setTimeout(() => setToast(null), 3000);
            };

            const filteredData = useMemo(() => salesData.filter(d => d.year === currentDate.year && d.month === currentDate.month), [salesData, currentDate]);
            const ytdData = useMemo(() => salesData.filter(d => d.year === currentDate.year && d.month <= currentDate.month), [salesData, currentDate]);

            const monthlyTotal = useMemo(() => filteredData.reduce((sum, curr) => sum + Number(curr.amount || 0), 0), [filteredData]);
            const monthlyCommTotal = useMemo(() => filteredData.reduce((sum, curr) => sum + Number(curr.commission || 0), 0), [filteredData]);
            const monthlyNetIncome = monthlyTotal - monthlyCommTotal;
            
            const currentMonthTarget = useMemo(() => settings.monthlyTargets[`${currentDate.year}-${currentDate.month}`] || 50000000, [settings.monthlyTargets, currentDate]);
            const monthlyAchieve = currentMonthTarget > 0 ? Math.min(100, Math.round((monthlyNetIncome / currentMonthTarget) * 100)) : 0;

            const ytdTotal = useMemo(() => ytdData.reduce((sum, curr) => sum + Number(curr.amount || 0), 0), [ytdData]);
            const ytdCommTotal = useMemo(() => ytdData.reduce((sum, curr) => sum + Number(curr.commission || 0), 0), [ytdData]);
            const ytdNetIncome = ytdTotal - ytdCommTotal;
            
            const currentYearTarget = useMemo(() => {
                let total = 0;
                for(let i=1; i<=12; i++) {
                    total += (settings.monthlyTargets[`${currentDate.year}-${i}`] || 50000000);
                }
                return total;
            }, [settings.monthlyTargets, currentDate.year]);
            const yearlyAchieve = currentYearTarget > 0 ? Math.min(100, Math.round((ytdNetIncome / currentYearTarget) * 100)) : 0;

            const taxEstimate = useMemo(() => {
                const cost = Number(taxCostOption) || 0; 
                const isFirstHalf = currentDate.month <= 6;
                const vatSales = salesData.filter(d => d.year === currentDate.year && (isFirstHalf ? d.month <= 6 : d.month > 6)).reduce((sum, curr) => sum + Number(curr.amount || 0), 0);
                const incSales = salesData.filter(d => d.year === currentDate.year).reduce((sum, curr) => sum + Number(curr.amount || 0), 0);
                
                const vat = Math.max(0, Math.ceil(vatSales * 0.1) - Math.ceil(cost * 0.1)); 
                const netRevenue = Math.max(0, incSales - cost);
                let incTax = 0;
                
                if (netRevenue <= 14000000) { incTax = netRevenue * 0.06; }
                else if (netRevenue <= 50000000) { incTax = 840000 + (netRevenue - 14000000) * 0.15; }
                else if (netRevenue <= 88000000) { incTax = 6240000 + (netRevenue - 50000000) * 0.24; }
                else if (netRevenue <= 150000000) { incTax = 15360000 + (netRevenue - 88000000) * 0.35; }
                else { incTax = 37060000 + (netRevenue - 150000000) * 0.38; }
                
                const localTax = Math.ceil(incTax * 0.1); 
                
                const today = new Date();
                const y = today.getFullYear();
                let vatD1 = new Date(y, 0, 25);
                let vatD2 = new Date(y, 6, 25);
                if(today > vatD2) vatD1 = new Date(y+1, 0, 25);
                const nextVatDate = (today <= vatD1 || today > vatD2) ? vatD1 : vatD2;
                const vatPeriod = nextVatDate.getMonth() === 0 ? "2기(7~12월)" : "1기(1~6월)";
                
                let incDate = new Date(y, 4, 31);
                if(today > incDate) incDate = new Date(y+1, 4, 31);

                const diffVat = Math.ceil((nextVatDate - today)/(1000*60*60*24));
                const diffInc = Math.ceil((incDate - today)/(1000*60*60*24));
                const totalTax = vat + incTax + localTax;
                
                const msgs = totalTax > 15000000 ? ["세금 폭탄 경보! 💣 매출이 엄청나시네요. 미리 절세 플랜을 준비하세요!", "국세청 VVIP 등극! 🎉 많이 버신 만큼 세금도 듬뿍 납부할 준비 되셨나요?", "워렌 버핏도 놀랄 납세액! 💸 국가 발전에 이바지하는 당신, 파이팅!"] : ["성실 납세의 아이콘! 이번 달도 고생 많으셨습니다. 😊", "차곡차곡 쌓이는 매출만큼 세금도 꼬박꼬박! 훌륭합니다. 👍", "안정적인 운영! 국세청이 사랑하는 성실 사업자입니다."];
                const comment = msgs[Math.floor(Math.random() * msgs.length)];
                
                return { vat, incTax, localTax, totalTax, comment, nextVatDateStr: formatDateWithDay(nextVatDate), vatPeriod, diffVat, incDateStr: formatDateWithDay(incDate), diffInc, vatSales, incSales };
            }, [salesData, currentDate, taxCostOption]);

            const hospitalStats = useMemo(() => {
                const stats = {};
                salesData.forEach(d => {
                    if (d.year === currentDate.year && d.month <= currentDate.month) {
                        if (!stats[d.hospitalName]) {
                            stats[d.hospitalName] = { id: d.hospitalName, hospitalName: d.hospitalName, current: 0, accumulated: 0 };
                        }
                        const net = Number(d.amount || 0) - Number(d.commission || 0);
                        if (d.month === currentDate.month) {
                            stats[d.hospitalName].current += net;
                        }
                        stats[d.hospitalName].accumulated += net;
                    }
                });
                return Object.values(stats);
            }, [salesData, currentDate]);

            const displayedHospitals = useMemo(() => {
                return [...hospitalStats].filter(h => h[chartSort] > 0).sort((a, b) => b[chartSort] - a[chartSort]);
            }, [hospitalStats, chartSort]);
            const maxAmount = displayedHospitals.length > 0 ? Math.max(...displayedHospitals.map(d => d[chartSort])) : 1;

            const selectedHospTrendData = useMemo(() => {
                if(!selectedHospDetail) return [];
                const result = [];
                let cumNet = 0;
                for(let m = 1; m <= 12; m++) {
                    const monthData = salesData.filter(d => d.year === currentDate.year && d.month === m && (selectedHospDetail === '전체 병원 합계' || d.hospitalName === selectedHospDetail));
                    const amt = monthData.reduce((sum, d) => sum + Number(d.amount || 0), 0);
                    const comm = monthData.reduce((sum, d) => sum + Number(d.commission || 0), 0);
                    const net = amt - comm;
                    cumNet += net;
                    result.push({ month: m, amount: amt, commission: comm, net: net, cumNet: cumNet });
                }
                return result;
            }, [salesData, currentDate.year, selectedHospDetail]);

            const upcomingBirthdays = useMemo(() => {
                const today = new Date();
                const todayNormalized = new Date(today.getFullYear(), today.getMonth(), today.getDate());
                const currentYear = todayNormalized.getFullYear();
                
                const sorted = doctorProfiles.filter(p => p.birthDate).map(p => {
                    const parts = p.birthDate.split('-');
                    if(parts.length !== 3) return { ...p, dday: 999, calcSolarDate: '' };
                    const m = Number(parts[1]), d = Number(parts[2]);
                    
                    let bday;
                    if (p.isLunar && window.Lunar) {
                        try {
                            // 음력 날짜를 양력으로 변환
                            let lunarDate = window.Lunar.fromYmd(currentYear, m, d);
                            let solarDate = lunarDate.getSolar();
                            bday = new Date(solarDate.getYear(), solarDate.getMonth() - 1, solarDate.getDay());
                            
                            // 만약 올해 양력으로 변환된 생일이 이미 지났다면 내년 음력 생일로 재계산
                            if (bday.getTime() < todayNormalized.getTime()) {
                                lunarDate = window.Lunar.fromYmd(currentYear + 1, m, d);
                                solarDate = lunarDate.getSolar();
                                bday = new Date(solarDate.getYear(), solarDate.getMonth() - 1, solarDate.getDay());
                            }
                        } catch(e) {
                            // Fallback
                            bday = new Date(currentYear, m - 1, d);
                            if (bday.getTime() < todayNormalized.getTime()) bday.setFullYear(currentYear + 1);
                        }
                    } else {
                        // 양력 생일 처리 (이미 지났으면 내년으로)
                        bday = new Date(currentYear, m - 1, d);
                        if (bday.getTime() < todayNormalized.getTime()) {
                            bday.setFullYear(currentYear + 1);
                        }
                    }
                    
                    const dday = Math.ceil((bday.getTime() - todayNormalized.getTime()) / (1000 * 60 * 60 * 24));
                    return { ...p, dday, calcSolarDate: `${String(bday.getMonth()+1).padStart(2,'0')}/${String(bday.getDate()).padStart(2,'0')}` };
                }).sort((a,b) => a.dday - b.dday);
                return sorted;
            }, [doctorProfiles]);

            const dailyQuote = useMemo(() => {
                const quotes = ["현재야, 오늘도 주아와 경옥 제수씨를 위해 달리는 너의 열정을 응원한다! 최고의 영업맨 박현재 화이팅!", "영업은 거절에서부터 시작된다. 주아 아빠의 저력을 보여주자, 박현재!", "경옥씨와 주아의 환한 미소를 떠올리며 오늘 하루도 힘차게 시작해! 넌 할 수 있어.", "성공한 세일즈맨 박현재! 오늘도 고객의 마음을 완벽하게 훔치는 멋진 하루가 되길!", "지칠 땐 사랑하는 아내 경옥씨와 눈에 넣어도 아프지 않을 딸 주아를 생각해. 오늘 흘린 땀방울이 가족의 든든한 행복이 될 거야.", "영업의 달인 박현재, 오늘의 목표도 거뜬히 달성할 거라 믿어 의심치 않아. 자신감을 가져!", "가족이라는 든든한 둥지가 있기에 박현재는 오늘도 높이 날아오른다. 멋진 아빠, 든든한 남편 화이팅!"];
                const now = new Date();
                const daysSinceEpoch = Math.floor((now.getTime() + (9 * 60 * 60 * 1000)) / (1000 * 60 * 60 * 24));
                return quotes[daysSinceEpoch % quotes.length];
            }, []);

            const weeklyBooks = useMemo(() => {
                const books = [
                    { title: '세일즈의 심리학', author: '브라이언 트레이시', summary: '고객의 마음을 여는 강력한 세일즈 기법과 심리학적 접근법.', price: 16000, discount: 14400, link: '교보문고, YES24 구매 가능' },
                    { title: '기브 앤 테이크', author: '애덤 그랜트', summary: '타인을 돕는 이타적인 사람이 결국 성공 사다리의 맨 꼭대기에 오른다.', price: 18000, discount: 16200, link: '교보문고, 알라딘 구매 가능' },
                    { title: '설득의 심리학', author: '로버트 치알디니', summary: '사람의 마음을 사로잡고 설득하는 6가지 불변의 법칙.', price: 22000, discount: 19800, link: '인터넷 서점 최저가 구매 가능' },
                    { title: '데일 카네기 인간관계론', author: '데일 카네기', summary: '사람의 마음을 얻고 원만한 관계를 맺는 최고의 고전.', price: 11500, discount: 10350, link: 'YES24, 밀리의 서재 등' },
                    { title: '부를 끌어당기는 생각', author: '나폴레온 힐', summary: '성공한 사람들의 13가지 원칙을 통해 부와 성공을 성취하는 마인드셋.', price: 15000, discount: 13500, link: '쿠팡 로켓배송 가능' },
                    { title: '더 골 (The Goal)', author: '엘리 골드랫', summary: '제약 이론을 통해 기업의 목표 달성을 돕는 비즈니스 소설.', price: 20000, discount: 18000, link: '교보문고 구매 가능' },
                    { title: '초격차', author: '권오현', summary: '삼성전자 신화의 주역이 밝히는 대체 불가능한 조직의 조건.', price: 17000, discount: 15300, link: 'YES24 구매 가능' },
                    { title: '아주 작은 습관의 힘', author: '제임스 클리어', summary: '최고의 변화는 어떻게 만들어지는가. 작은 습관의 복리 효과.', price: 16000, discount: 14400, link: '알라딘 구매 가능' }
                ];
                const now = new Date();
                const weeksSinceEpoch = Math.floor((now.getTime() - now.getDay() * 86400000) / (1000 * 60 * 60 * 24 * 7));
                const startIdx = (weeksSinceEpoch * 5) % books.length;
                const selected = [];
                for (let i = 0; i < 5; i++) {
                    selected.push(books[(startIdx + i) % books.length]);
                }
                return selected;
            }, []);

            const generateAiRecommendation = async (profile) => {
                setIsAiLoading(true);
                try {
                    const prompt = `당신은 제약회사 최고 에이스 영업사원입니다. 담당 원장님(이름: ${profile.doctorName}, 관심사: ${profile.likes})의 생일이 다가옵니다. 원장님의 관심사를 반영하여 센스 있고 유쾌한 생일 선물 1가지와 건넬 축하 멘트를 짧게(2문장 이내) 추천해주세요.`;
                    const payload = { contents: [{ parts: [{ text: prompt }] }] };
                    const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=', {
                        method: 'POST',

                                                                    <React.Fragment><td className="px-3 py-2 font-bold text-gray-800 sticky left-0 bg-white shadow-[1px_0_0_#eee] z-10">{p.hospitalName} <span className="text-gray-500 ml-1 font-normal whitespace-nowrap">{p.doctorName}</span></td><td className="px-3 py-2 text-gray-600 whitespace-nowrap">{p.birthDate} <span className={`text-[10px] font-bold px-1 rounded ml-1 ${p.isLunar ? 'bg-amber-100 text-amber-700' : 'bg-blue-100 text-blue-700'}`}>({p.isLunar ? '음' : '양'})</span></td><td className="px-3 py-2 text-gray-500 truncate max-w-[80px]">{p.likes}</td><td className="px-3 py-2 text-gray-500 truncate max-w-[80px]">{p.family || '-'}</td><td className="px-3 py-2 text-center whitespace-nowrap"><button onClick={() => { setEditDocId(p.id); setEditDocData({ doctorName: p.doctorName, birthDate: p.birthDate, isLunar: p.isLunar || false, likes: p.likes, family: p.family || '' }); }} className="text-blue-500 bg-blue-50 hover:bg-blue-100 px-2 py-1 rounded text-[10px] font-bold mr-1 transition">수정</button><button onClick={() => { setDoctorProfiles(prev => prev.filter(d => d.id !== p.id)); showToast('삭제됨', 'success'); }} className="text-rose-500 bg-rose-50 hover:bg-rose-100 px-2 py-1 rounded text-[10px] font-bold transition">삭제</button></td></React.Fragment>
                                                                )}
                                                            </tr>
                                                        );
                                                    });
                                                })()}
                                            </tbody>
                                        </table>
                                        {(() => {
                                            const maxP = Math.ceil(doctorProfiles.length / (isMobile ? 3 : 5)) || 1;
                                            const sP = Math.min(docPage, maxP);
                                            return <div className="flex justify-center gap-2 p-2 bg-gray-50 border-t mt-auto sticky left-0 z-10"><button onClick={()=>setDocPage(Math.max(1, sP-1))} className="px-2 py-0.5 bg-white border rounded text-xs hover:bg-gray-100"><i className="fas fa-chevron-left"></i></button><span className="text-xs font-bold pt-0.5 px-2">{sP} / {maxP}</span><button onClick={()=>setDocPage(Math.min(maxP, sP+1))} className="px-2 py-0.5 bg-white border rounded text-xs hover:bg-gray-100"><i className="fas fa-chevron-right"></i></button></div>
                                        })()}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {selectedHospDetail && (
                        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 p-3 md:p-4" onClick={() => setSelectedHospDetail(null)}>
                            <div className="bg-white rounded-3xl p-4 md:p-6 w-full max-w-4xl shadow-2xl relative flex flex-col max-h-[96vh] animate-[fadeIn_0.2s_ease-out]" onClick={e => e.stopPropagation()}>
                                <button onClick={() => setSelectedHospDetail(null)} className="absolute top-4 right-4 text-gray-400 hover:text-gray-800 z-10 bg-gray-100 hover:bg-gray-200 transition rounded-full w-8 h-8 flex items-center justify-center"><i className="fas fa-times text-lg"></i></button>
                                
                                <div className="mb-3 pr-8 border-b border-gray-100 pb-2 shrink-0">
                                    <h3 className="font-black text-xl md:text-2xl mb-1 text-gray-800 flex items-center gap-2 whitespace-nowrap">
                                        <i className="fas fa-building text-indigo-500"></i> {currentDate.year}년 {selectedHospDetail} 실적 요약
                                    </h3>
                                    <p className="text-[11px] md:text-[12px] text-gray-500 font-medium">1월 ~ 12월 월별 순수익(매출-수수료) 추이 및 상세 데이터</p>
                                </div>
                                
                                <div className="flex-1 overflow-hidden flex flex-col gap-2">
                                    {(() => {
                                        if (selectedHospTrendData.length === 0) return <div className="text-center py-10 text-gray-400">데이터가 없습니다.</div>;
                                        const currentData = selectedHospTrendData[currentDate.month - 1] || selectedHospTrendData[0];
                                        
                                        return (
                                            <React.Fragment>
                                                <div className="flex flex-col sm:flex-row gap-3 md:gap-4 shrink-0">
                                                    <div className="flex-1 bg-gradient-to-br from-emerald-50 to-teal-50 rounded-2xl p-4 border border-emerald-100 shadow-sm relative overflow-hidden">
                                                        <i className="fas fa-coins absolute -right-2 -bottom-2 text-6xl text-emerald-500 opacity-10"></i>
                                                        <p className="text-xs md:text-sm text-emerald-800 font-bold mb-1.5">{currentDate.month}월 당월 순수익</p>
                                                        <p className="text-2xl md:text-3xl font-black text-emerald-700">{formatCurr(currentData.net)}</p>
                                                        <div className="mt-2 inline-block bg-white/60 px-3 py-1 rounded-lg text-[10px] md:text-xs text-emerald-700 font-bold border border-emerald-200/50 whitespace-nowrap">
                                                            매출 {formatCurr(currentData.amount)} / 수수료 {formatCurr(currentData.commission)}
                                                        </div>
                                                    </div>
                                                    <div className="flex-1 bg-gradient-to-br from-blue-50 to-indigo-50 rounded-2xl p-4 border border-blue-100 shadow-sm relative overflow-hidden">
                                                        <i className="fas fa-chart-line absolute -right-2 -bottom-2 text-6xl text-blue-500 opacity-10"></i>
                                                        <p className="text-xs md:text-sm text-blue-800 font-bold mb-1.5">1~{currentDate.month}월 누적 순수익</p>
                                                        <p className="text-2xl md:text-3xl font-black text-blue-700">{formatCurr(currentData.cumNet)}</p>
                                                        <div className="mt-2 inline-block bg-white/60 px-3 py-1 rounded-lg text-[10px] md:text-xs text-blue-700 font-bold border border-blue-200/50 whitespace-nowrap">
                                                            지속 성장 추이 확인
                                                        </div>
                                                    </div>
                                                </div>

                                                <div className="h-56 md:h-72 w-full relative bg-white rounded-2xl p-2 md:p-4 border border-gray-100 shadow-sm shrink-0 flex items-center mt-2">
                                                    <div className="absolute top-3 right-4 text-[11px] md:text-xs text-gray-500 font-bold z-10">(단위: 원)</div>
                                                    <div className="absolute top-3 left-4 text-[10px] md:text-xs text-gray-600 font-bold z-10 flex items-center gap-4 bg-white/95 px-3 py-1.5 rounded-lg border border-gray-100 shadow-sm">
                                                        <span className="flex items-center gap-2"><span className="w-3 h-3 bg-emerald-400 rounded-sm block shadow-sm"></span> 당월 순수익 (막대)</span>
                                                        <span className="flex items-center gap-2"><span className="w-4 h-1.5 bg-blue-500 rounded block shadow-sm"></span> 누적 순수익 (꺾은선)</span>
                                                    </div>
                                                    <svg className="w-full h-full pt-4" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMid meet">
                                                        {[100, 200, 300].map(y => (
                                                            <line key={y} x1="60" y1={y} x2="1140" y2={y} stroke="#f1f5f9" strokeWidth="2" strokeDasharray="10,10" />
                                                        ))}
                                                        {(() => {
                                                            const maxNet = Math.max(...selectedHospTrendData.map(d => d.net)) || 1;
                                                            return selectedHospTrendData.map((d, i) => {
                                                                const x = 90 + (i / 11) * 1020;
                                                                const barH = Math.max((d.net / maxNet) * 220, 0); 
                                                                const barY = 320 - barH;
                                                                return (
                                                                    <g key={`bar-${i}`}>
                                                                        {barH > 0 && <rect x={x - 30} y={barY} width="60" height={barH} fill="#6ee7b7" rx="8" className="opacity-80 hover:opacity-100 transition-opacity" style={{transition: 'all 0.5s ease'}}/>}
                                                                        <text x={x} y={365} fontSize="26" fill="#64748b" fontFamily="Inter" textAnchor="middle" fontWeight="bold">{d.month}월</text>
                                                                    </g>
                                                                );
                                                            });
                                                        })()}
                                                        {(() => {
                                                            const maxCum = Math.max(...selectedHospTrendData.map(d => d.cumNet)) || 1;
                                                            const pts = selectedHospTrendData.map((d, i) => {
                                                                const x = 90 + (i / 11) * 1020;
                                                                const y = 320 - Math.max((d.cumNet / maxCum) * 260, 0);
                                                                return `${x},${y}`;
                                                            }).join(' ');
                                                            
                                                            return (
                                                                <React.Fragment>
                                                                    <polyline points={pts} fill="none" stroke="#3b82f6" strokeWidth="6" strokeLinecap="round" strokeLinejoin="round" className="drop-shadow-lg" style={{strokeDasharray: 3000, strokeDashoffset: 0, animation: 'dash 1.5s ease-out forwards'}} />
                                                                    {selectedHospTrendData.map((d, i) => {
                                                                        const x = 90 + (i / 11) * 1020;
                                                                        const y = 320 - Math.max((d.cumNet / maxCum) * 260, 0);
                                                                        return (
                                                                            <g key={`dot-${i}`}>
                                                                                <circle cx={x} cy={y} r="9" fill="#fff" stroke="#2563eb" strokeWidth="4" className="drop-shadow-md"/>
                                                                                {d.cumNet > 0 && (
                                                                                    <text x={x} y={y - 25} fontSize="18" fill="#1e3a8a" fontFamily="Inter" textAnchor="middle" fontWeight="900">
                                                                                        {new Intl.NumberFormat('ko-KR').format(Math.round(d.cumNet / 10000))}만
                                                                                    </text>
                                                                                )}
                                                                            </g>
                                                                        );
                                                                    })}
                                                                </React.Fragment>
                                                            );
                                                        })()}
                                                    </svg>
                                                </div>

                                                <div className="border border-gray-100 rounded-xl overflow-x-auto shadow-sm bg-white shrink-0 relative no-scrollbar mt-2">
                                                    <table className="w-full text-[10px] md:text-[11px] text-right whitespace-nowrap min-w-[450px]">
                                                        <thead className="bg-gray-50/90 text-gray-500 font-bold border-b border-gray-100 text-center">
                                                            <tr><th className="px-2 py-1.5 sticky left-0 bg-gray-50/90 shadow-[1px_0_0_#eee] z-10 w-12">분석 월</th><th className="px-2 py-1.5 text-right">매출액</th><th className="px-2 py-1.5 text-rose-400 text-right">수수료(-)</th><th className="px-2 py-1.5 text-emerald-600 text-right">당월 순수익</th><th className="px-2 py-1.5 text-blue-600 text-right bg-blue-50/30">누적 순수익</th></tr>
                                                        </thead>
                                                        <tbody className="divide-y divide-gray-50">
                                                            {selectedHospTrendData.map(d => (
                                                                <tr key={d.month} className="hover:bg-gray-50/50 transition bg-white">
                                                                    <td className="px-2 py-1 text-center font-bold text-gray-600 bg-gray-50/90 sticky left-0 shadow-[1px_0_0_#eee] z-0">{d.month}월</td>
                                                                    <td className="px-2 py-1 text-gray-700 font-medium whitespace-nowrap">{formatCurr(d.amount)}</td>
                                                                    <td className="px-2 py-1 text-rose-500/90 font-bold whitespace-nowrap">{formatCurr(d.commission)}</td>
                                                                    <td className="px-2 py-1 font-black text-emerald-500 whitespace-nowrap">{formatCurr(d.net)}</td>
                                                                    <td className="px-2 py-1 font-black text-blue-600 bg-blue-50/10 whitespace-nowrap">{formatCurr(d.cumNet)}</td>
                                                                </tr>
                                                            ))}
                                                        </tbody>
                                                    </table>
                                                </div>
                                            </React.Fragment>
                                        );
                                    })()}
                                </div>
                            </div>
                        </div>
                    )}

                    {showTaxModal && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-3xl p-6 w-full max-w-md shadow-2xl relative">
                                <button onClick={() => setShowTaxModal(false)} className="absolute top-4 right-4 text-gray-400 hover:text-gray-800"><i className="fas fa-times text-xl"></i></button>
                                <h3 className="font-black text-xl mb-1 text-gray-800"><i className="fas fa-file-invoice-dollar text-emerald-500 mr-2"></i>세금납부 상세 시뮬레이션</h3>
                                <p className="text-[11px] text-gray-500 mb-4 pb-3 border-b border-gray-100">개인사업자 세법 기준(부가세 반기, 종소세 연간) 과세기간에 맞춰 해당 기간 누적매출을 자동 끌어옵니다.</p>
                                <div className="mb-4">
                                    <label className="text-[11px] font-bold text-gray-500 block mb-2"><i className="fas fa-calculator mr-1"></i> 누적 비용 직접 입력 (세금 공제용 과세표준 산출)</label>
                                    <input type="text" value={taxCostOption === 0 ? '' : new Intl.NumberFormat('ko-KR').format(taxCostOption)} onChange={(e) => { const raw = e.target.value.replace(/[^0-9]/g, ""); setTaxCostOption(Number(raw)); }} placeholder="비용을 직접 입력하세요 (예: 69,696,969)" className="w-full bg-gray-50 border border-gray-300 text-gray-800 text-sm font-bold rounded-lg focus:ring-emerald-500 outline-none p-2.5" />
                                </div>
                                <div className="space-y-3 mb-5">
                                    <div className="bg-emerald-50 rounded-xl p-3 border border-emerald-100 relative"><div className="absolute -top-2 right-3 bg-emerald-500 text-white text-[10px] font-black px-2 py-0.5 rounded-full shadow-sm">D-{taxEstimate.diffVat}</div><div className="flex justify-between items-end mb-1"><span className="font-bold text-sm text-emerald-900">1. 부가가치세 <span className="text-[10px] font-normal text-emerald-700 block mt-0.5">{taxEstimate.vatPeriod} 매출: <span className="font-bold">{formatCurr(taxEstimate.vatSales)}</span></span></span><span className="font-black text-lg text-emerald-800">{formatCurr(taxEstimate.vat)}</span></div><div className="text-[10px] text-emerald-600 font-bold bg-white px-2 py-1 rounded mt-1 text-right w-full">예정 납부일: {taxEstimate.nextVatDateStr}</div></div>
                                    <div className="bg-amber-50 rounded-xl p-3 border border-amber-100 relative"><div className="absolute -top-2 right-3 bg-amber-500 text-white text-[10px] font-black px-2 py-0.5 rounded-full shadow-sm">D-{taxEstimate.diffInc}</div><div className="flex justify-between items-end mb-1"><span className="font-bold text-sm text-amber-900">2. 종합소득세 <span className="text-[10px] font-normal text-amber-700 block mt-0.5">{currentDate.year}년 연간 매출: <span className="font-bold">{formatCurr(taxEstimate.incSales)}</span></span></span><span className="font-black text-lg text-amber-800">{formatCurr(taxEstimate.incTax)}</span></div><div className="text-[10px] text-amber-600 font-bold bg-white px-2 py-1 rounded mt-1 text-right w-full">정기 신고일: {taxEstimate.incDateStr}</div></div>
                                    <div className="bg-blue-50 rounded-xl p-3 border border-blue-100 relative"><div className="absolute -top-2 right-3 bg-blue-500 text-white text-[10px] font-black px-2 py-0.5 rounded-full shadow-sm">D-{taxEstimate.diffInc}</div><div className="flex justify-between items-center"><span className="font-bold text-sm text-blue-900">3. 지방소득세 <span className="text-[10px] font-normal text-blue-700 ml-1">(종소세의 10%)</span></span><span className="font-black text-base text-blue-800">{formatCurr(taxEstimate.localTax)}</span></div></div>
                                    <div className="flex justify-between items-center bg-gray-900 p-4 rounded-xl shadow-inner mt-2"><span className="font-bold text-gray-300">합계 예상 세액</span><span className="font-black text-white text-xl">{formatCurr(taxEstimate.totalTax)}</span></div>
                                </div>
                                <div className="bg-gray-100 p-3 rounded-lg border border-gray-200 flex gap-2 items-start"><i className="fas fa-info-circle text-gray-500 mt-0.5"></i><p className="text-xs font-bold text-gray-600 leading-tight">{taxEstimate.comment}</p></div>
                            </div>
                        </div>
                    )}
                    
                    {bookModal && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4" onClick={() => setBookModal(null)}>
                            <div className="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl relative" onClick={e => e.stopPropagation()}><button onClick={() => setBookModal(null)} className="absolute top-4 right-4 text-gray-400 hover:text-gray-800"><i className="fas fa-times text-xl"></i></button><div className="bg-amber-50 w-12 h-12 rounded-full flex items-center justify-center text-amber-500 mb-4"><i className="fas fa-book text-2xl"></i></div><h3 className="font-black text-xl mb-1 text-gray-800">{bookModal.title}</h3><p className="text-sm font-bold text-amber-600 mb-4 pb-3 border-b border-gray-100">{bookModal.author}</p><p className="text-gray-600 text-sm leading-relaxed whitespace-pre-wrap mb-5">{bookModal.summary}</p><div className="bg-gray-50 p-3 rounded-xl border border-gray-200"><div className="flex justify-between text-xs mb-1 text-gray-500"><span className="line-through">정가: {new Intl.NumberFormat('ko-KR').format(bookModal.price)}원</span></div><div className="flex justify-between items-center"><span className="font-bold text-sm text-gray-800">인터넷 할인가</span><span className="font-black text-rose-600 text-lg">{new Intl.NumberFormat('ko-KR').format(bookModal.discount)}원</span></div><div className="mt-2 text-center text-[10px] font-bold text-blue-600 bg-blue-50 py-1.5 rounded-lg border border-blue-100"><i className="fas fa-external-link-alt mr-1"></i> {bookModal.link}</div></div></div>
                        </div>
                    )}

                    {selectedDocDetail && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4" onClick={() => setSelectedDocDetail(null)}>
                            <div className="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl relative animate-[fadeIn_0.2s_ease-out]" onClick={e => e.stopPropagation()}>
                                <button onClick={() => setSelectedDocDetail(null)} className="absolute top-4 right-4 text-gray-400 hover:text-gray-800 w-8 h-8 flex items-center justify-center bg-gray-100 rounded-full transition hover:bg-gray-200"><i className="fas fa-times"></i></button>
                                
                                <div className="flex items-center gap-3 mb-4 border-b border-gray-100 pb-4">
                                    <div className="w-12 h-12 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center text-xl shrink-0"><i className="fas fa-user-md"></i></div>
                                    <div>
                                        <h3 className="font-black text-xl text-gray-800 flex items-center gap-1">{selectedDocDetail.doctorName} <span className="text-sm font-bold text-indigo-500">원장님</span></h3>
                                        <p className="text-xs font-bold text-gray-500 mt-0.5">{selectedDocDetail.hospitalName}</p>
                                    </div>
                                </div>
                                
                                <div className="space-y-3">
                                    <div className="bg-gray-50 p-3 rounded-xl border border-gray-100 flex items-center justify-between">
                                        <span className="text-xs font-bold text-gray-500"><i className="fas fa-birthday-cake text-pink-400 mr-1.5"></i>생년월일</span>
                                        <span className="text-sm font-black text-gray-800">{selectedDocDetail.birthDate} <span className={`text-[10px] px-1.5 py-0.5 rounded ml-1 ${selectedDocDetail.isLunar ? 'bg-amber-100 text-amber-700' : 'bg-blue-100 text-blue-700'}`}>{selectedDocDetail.isLunar ? '음력' : '양력'}</span></span>
                                    </div>
                                    <div className="bg-gray-50 p-3 rounded-xl border border-gray-100 flex items-center justify-between">
                                        <span className="text-xs font-bold text-gray-500"><i className="fas fa-heart text-rose-400 mr-1.5"></i>관심사</span>
                                        <span className="text-sm font-bold text-gray-700">{selectedDocDetail.likes || '-'}</span>
                                    </div>
                                    <div className="bg-gray-50 p-3 rounded-xl border border-gray-100 flex items-center justify-between">
                                        <span className="text-xs font-bold text-gray-500"><i className="fas fa-users text-emerald-500 mr-1.5"></i>가족사항</span>
                                        <span className="text-sm font-bold text-gray-700">{selectedDocDetail.family || '미입력'}</span>
                                    </div>
                                    <div className="bg-indigo-50 p-3 rounded-xl border border-indigo-100 flex items-center justify-between mt-4 shadow-inner">
                                        <span className="text-xs font-bold text-indigo-700"><i className="fas fa-calendar-check text-indigo-500 mr-1.5"></i>올해 생일(양력)</span>
                                        <span className="text-lg font-black text-pink-500 bg-white px-3 py-0.5 rounded-full shadow-sm border border-pink-100">{selectedDocDetail.calcSolarDate} (D-{selectedDocDetail.dday === 0 ? 'DAY' : selectedDocDetail.dday})</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {toast && <div className={`fixed bottom-4 left-1/2 transform -translate-x-1/2 px-5 py-2.5 rounded-full text-sm font-bold shadow-lg z-50 text-white ${toast.type === 'error' ? 'bg-rose-500' : 'bg-gray-800'} transition-all flex items-center gap-2`}><i className={`fas ${toast.type === 'error' ? 'fa-exclamation-circle' : 'fa-check-circle'}`}></i> {toast.msg}</div>}
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
