<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J PHARM. Sales Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Firebase App (the core Firebase SDK) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <!-- Firebase Firestore -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <!-- Firebase Auth -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    
    <style>
        body { font-family: 'Inter', 'Noto Sans KR', sans-serif; background-color: #f3f4f6; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .bar-fill { transition: width 1s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes blink { 50% { opacity: 0.5; } }
        .pulse-red { animation: blink 1s linear infinite; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- 초기 날짜 세팅 (현재 월 기준 전월) ---
        const getDefaultDate = () => {
            const today = new Date();
            let year = today.getFullYear();
            let month = today.getMonth(); // 0-11
            if (month === 0) {
                year -= 1;
                month = 12;
            }
            return { year, month };
        };

        const App = () => {
            const [view, setView] = useState('main'); // 'main', 'admin', 'login'
            const [data, setData] = useState([]);
            const [settings, setSettings] = useState({ 
                tickerOn: true, quoteOn: true, adminPin: '6969', logoBase64: '', taxText: '' 
            });
            const [currentDate, setCurrentDate] = useState(getDefaultDate());
            const [toast, setToast] = useState(null);
            const [isAuthReady, setIsAuthReady] = useState(false);
            const [loginPin, setLoginPin] = useState('');
            const [isConnected, setIsConnected] = useState(navigator.onLine);
            
            // AI 분석 및 로딩 상태
            const [aiMessage, setAiMessage] = useState('');
            
            // 수동 입력 및 부가 기능 상태
            const [manualHosp, setManualHosp] = useState('');
            const [manualAmt, setManualAmt] = useState('');
            const [adminPage, setAdminPage] = useState(1);
            const [showTaxModal, setShowTaxModal] = useState(false);
            const [chartSort, setChartSort] = useState('top');
            const [chartRendered, setChartRendered] = useState(false);

            const showToast = (msg, type='info') => {
                setToast({msg, type});
                setTimeout(() => setToast(null), 3000);
            };

            const formatCurr = (num) => new Intl.NumberFormat('ko-KR', { style: 'currency', currency: 'KRW' }).format(num);

            const initFirebase = () => {
                // 주의: 깃허브 업로드 시 본인의 Firebase 키로 변경해야 합니다.
                const firebaseConfig = {
                    apiKey: "YOUR_API_KEY",
                    authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
                    projectId: "YOUR_PROJECT_ID",
                    storageBucket: "YOUR_PROJECT_ID.appspot.com",
                    messagingSenderId: "YOUR_SENDER_ID",
                    appId: "YOUR_APP_ID"
                };

                try {
                    if (!firebase.apps.length) {
                        firebase.initializeApp(firebaseConfig);
                    }
                    const db = firebase.firestore();
                    
                    // 실시간 리스너 설정 (모바일 연동)
                    db.collection("sales").onSnapshot((snapshot) => {
                        const fetchedData = snapshot.docs.map(doc => ({id: doc.id, ...doc.data()}));
                        setData(fetchedData);
                    });

                    db.collection("settings").doc("main").onSnapshot((doc) => {
                        if (doc.exists) {
                            setSettings(prev => ({...prev, ...doc.data()}));
                        }
                    });
                } catch (e) {
                    console.error("Firebase init error:", e);
                } finally {
                    setIsAuthReady(true);
                }
            };

            // 네트워크 상태 및 자동 복구 모니터링
            const autoReconnect = () => {
                let interval = setInterval(() => {
                    if (navigator.onLine) {
                        setIsConnected(true);
                        clearInterval(interval);
                        showToast('시스템 연결이 자동 복구되어 실시간 연동이 재개되었습니다.', 'success');
                    }
                }, 3000);
            };

            useEffect(() => {
                initFirebase();
                const handleOnline = () => { setIsConnected(true); showToast('시스템이 실시간 연동 상태로 복구되었습니다.', 'success'); };
                const handleOffline = () => { setIsConnected(false); showToast('연결이 끊어졌습니다. 자동 복구를 시도합니다...', 'error'); autoReconnect(); };
                
                window.addEventListener('online', handleOnline);
                window.addEventListener('offline', handleOffline);
                
                return () => {
                    window.removeEventListener('online', handleOnline);
                    window.removeEventListener('offline', handleOffline);
                };
            }, []);

            useEffect(() => {
                if (view === 'main') {
                    setChartRendered(false);
                    const timer = setTimeout(() => setChartRendered(true), 100);
                    return () => clearTimeout(timer);
                }
            }, [view, currentDate, chartSort]);

            const saveSalesRecord = async (hospitalName, amount) => {
                if(window.location.protocol === 'file:') return; // 로컬 차단
                try {
                    await firebase.firestore().collection("sales").add({
                        year: currentDate.year,
                        month: currentDate.month,
                        hospitalName,
                        amount: Number(amount)
                    });
                } catch (e) {
                    console.error("Save error:", e);
                }
            };

            const deleteSalesRecord = async (id) => {
                if(window.location.protocol === 'file:') return;
                try {
                    await firebase.firestore().collection("sales").doc(id).delete();
                    showToast('데이터가 삭제되었습니다.', 'success');
                } catch (e) {
                    showToast('삭제 실패', 'error');
                }
            };

            // 수동 입력 금액 콤마 로직
            const handleManualAmtChange = (e) => {
                const rawValue = e.target.value.replace(/[^0-9]/g, ''); 
                if(!rawValue) { setManualAmt(''); return; }
                setManualAmt(new Intl.NumberFormat('ko-KR').format(Number(rawValue)));
            };

            const handleManualSubmit = async () => {
                if(window.location.protocol === 'file:') return showToast('웹 서버 환경(URL)에서만 작동합니다.', 'error');
                const numericAmt = Number(manualAmt.replace(/,/g, ''));
                if (!manualHosp || !numericAmt) return showToast('병원명과 금액을 모두 정확히 입력해주세요.', 'error');
                
                await saveSalesRecord(manualHosp, numericAmt);
                showToast(`${manualHosp} 매출이 수동으로 등록되었습니다.`, 'success');
                setManualHosp('');
                setManualAmt('');
            };

            // AI 파일 업로드 분석
            const handleFileUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                if (window.location.protocol === 'file:') {
                    return showToast('로컬 파일(file://) 환경에서는 AI 분석이 제한됩니다. 웹 서버 환경에서 이용해주세요.', 'error');
                }

                setAiMessage('AI가 파일을 분석 중입니다. 잠시만 기다려주세요...');
                try {
                    // 주의: 깃허브 업로드 시 본인의 Gemini API 키로 변경
                    const apiKey = "YOUR_GEMINI_API_KEY"; 
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
                    
                    // 더미 응답 시뮬레이션 (API 연동 대체 로직)
                    setTimeout(() => {
                        setAiMessage('');
                        showToast('AI 분석 시뮬레이션: 파일 양식이 분석되었습니다.', 'info');
                        // 실제로는 여기서 Gemini API 호출 결과를 파싱하여 saveSalesRecord를 반복 호출합니다.
                    }, 2000);

                } catch (error) {
                    setAiMessage('');
                    showToast('분석 실패: 양식이 맞지 않거나 글자가 깨진 파일입니다.', 'error');
                }
            };

            // 로고 이미지 업로드
            const handleLogoUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        updateSetting('logoBase64', reader.result);
                    };
                    reader.readAsDataURL(file);
                }
            };

            const updateSetting = async (key, val) => {
                setSettings(prev => ({...prev, [key]: val}));
                if(window.location.protocol !== 'file:') {
                    try { await firebase.firestore().collection("settings").doc("main").set({[key]: val}, {merge:true}); } catch(e){}
                }
            };

            const filteredMonthlySales = useMemo(() => {
                return data.filter(d => d.year === currentDate.year && d.month === currentDate.month);
            }, [data, currentDate]);

            const monthlyTotal = useMemo(() => {
                return filteredMonthlySales.reduce((sum, curr) => sum + Number(curr.amount), 0);
            }, [filteredMonthlySales]);

            const cumulativeTotal = useMemo(() => {
                return data.filter(d => d.year === currentDate.year && d.month <= currentDate.month)
                           .reduce((sum, curr) => sum + Number(curr.amount), 0);
            }, [data, currentDate]);

            const taxEstimate = useMemo(() => {
                const total = monthlyTotal;
                let tax = 0; let text = '';
                if (total <= 14000000) { tax = total * 0.06; text = '6% (1,400만원 이하)'; }
                else if (total <= 50000000) { tax = 840000 + (total - 14000000) * 0.15; text = '15% (5,000만원 이하)'; }
                else if (total <= 88000000) { tax = 6240000 + (total - 50000000) * 0.24; text = '24% (8,800만원 이하)'; }
                else { tax = 15360000 + (total - 88000000) * 0.35; text = '35% 이상 (고소득 구간)'; }
                return { tax, text };
            }, [monthlyTotal]);

            const displayedHospitals = useMemo(() => {
                const sorted = [...filteredMonthlySales].sort((a, b) => chartSort === 'top' ? b.amount - a.amount : a.amount - b.amount);
                return sorted.slice(0, 10);
            }, [filteredMonthlySales, chartSort]);
            
            const maxAmount = displayedHospitals.length > 0 ? Math.max(...displayedHospitals.map(d => d.amount)) : 1;

            // 로딩 처리
            if (!isAuthReady) {
                return <div className="min-h-screen flex items-center justify-center text-xl font-bold text-gray-500">시스템 로딩 중...</div>;
            }

            return (
                <div className="min-h-screen pb-10">
                    {/* 상단 무빙 티커 */}
                    {settings.tickerOn && (
                        <div className="bg-gray-900 text-white text-xs py-1.5 overflow-hidden whitespace-nowrap">
                            <div className="inline-block animate-[marquee_20s_linear_infinite]">
                                <span className="mx-4"><span className="text-gray-400">KOSPI</span> 2,750.32 <span className="text-red-400">▼ 12.5</span></span>
                                <span className="mx-4"><span className="text-gray-400">USD/KRW</span> 1,385.20 <span className="text-blue-400">▲ 2.1</span></span>
                                <span className="mx-4"><span className="text-gray-400">GOLD(1g)</span> 105,430 <span className="text-blue-400">▲ 150</span></span>
                                <span className="mx-4"><span className="text-gray-400">NASDAQ</span> 16,340.55 <span className="text-blue-400">▲ 45.2</span></span>
                            </div>
                        </div>
                    )}

                    {/* 네비게이션 헤더 */}
                    <nav className="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-40">
                        <div className="max-w-6xl mx-auto px-4 flex justify-between items-center h-16">
                            <div className="flex items-center gap-3">
                                {settings.logoBase64 ? (
                                    <img src={settings.logoBase64} alt="J PHARM Logo" className="h-8 object-contain max-w-[120px]" />
                                ) : (
                                    <h1 className="text-xl font-black tracking-tighter text-emerald-800">
                                        <i className="fas fa-pills mr-2 text-emerald-600"></i>J PHARM.
                                    </h1>
                                )}
                                {/* 실시간 상태 표시기 */}
                                <div className="flex items-center gap-1.5 ml-2 bg-gray-100 px-2 py-1 rounded-full border border-gray-200">
                                    <div className={`w-2.5 h-2.5 rounded-full ${isConnected ? 'bg-green-500' : 'bg-red-500 pulse-red'}`}></div>
                                    <span className={`text-[10px] font-bold ${isConnected ? 'text-green-700' : 'text-red-600'}`}>
                                        {isConnected ? 'System ON' : 'Recovering...'}
                                    </span>
                                </div>
                            </div>
                            
                            <div className="flex gap-2">
                                <select 
                                    className="bg-gray-50 border border-gray-200 text-gray-800 text-sm rounded-lg focus:ring-emerald-500 focus:border-emerald-500 p-1.5 font-bold"
                                    value={currentDate.year} onChange={(e) => setCurrentDate({...currentDate, year: Number(e.target.value)})}
                                >
                                    {[2024, 2025, 2026, 2027].map(y => <option key={y} value={y}>{y}년</option>)}
                                </select>
                                <select 
                                    className="bg-gray-50 border border-gray-200 text-gray-800 text-sm rounded-lg focus:ring-emerald-500 focus:border-emerald-500 p-1.5 font-bold"
                                    value={currentDate.month} onChange={(e) => setCurrentDate({...currentDate, month: Number(e.target.value)})}
                                >
                                    {Array.from({length: 12}, (_, i) => i + 1).map(m => <option key={m} value={m}>{m}월</option>)}
                                </select>
                                <button onClick={() => setView(view === 'main' ? 'login' : 'main')} className="ml-2 bg-gray-800 text-white p-2 rounded-lg hover:bg-gray-700 transition">
                                    <i className={`fas ${view === 'main' ? 'fa-cog' : 'fa-home'}`}></i>
                                </button>
                            </div>
                        </div>
                    </nav>

                    {/* 메인 컨텐츠 영역 */}
                    <main className="max-w-6xl mx-auto px-4 mt-6">
                        {settings.quoteOn && (
                            <div className="bg-white/60 backdrop-blur rounded-xl p-4 mb-6 border border-gray-200 text-center shadow-sm">
                                <p className="text-gray-700 font-medium italic">"성공적인 영업은 고객의 문제를 해결하는 데서 시작된다. 그들의 이야기에 귀 기울여라."</p>
                            </div>
                        )}

                        {view === 'main' && (
                            <div className="space-y-6">
                                {/* 핵심 지표 카드 */}
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div className="bg-gradient-to-br from-emerald-600 to-teal-800 rounded-2xl p-6 text-white shadow-lg relative overflow-hidden">
                                        <div className="absolute top-0 right-0 p-4 opacity-20"><i className="fas fa-chart-line text-6xl"></i></div>
                                        <h3 className="text-emerald-100 font-medium mb-1 text-sm">{currentDate.year}년 {currentDate.month}월 당월 매출</h3>
                                        <p className="text-4xl font-black tracking-tight">{formatCurr(monthlyTotal)}</p>
                                    </div>
                                    <div className="bg-white rounded-2xl p-6 text-gray-800 border border-gray-100 shadow-sm relative overflow-hidden">
                                        <div className="absolute top-0 right-0 p-4 opacity-5"><i className="fas fa-wallet text-6xl"></i></div>
                                        <h3 className="text-gray-500 font-medium mb-1 text-sm">{currentDate.year}년 누적 매출</h3>
                                        <p className="text-3xl font-black text-gray-800">{formatCurr(cumulativeTotal)}</p>
                                    </div>
                                </div>

                                {/* 차트 및 부가 정보 영역 */}
                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                    
                                    {/* 좌측: 병원별 매출 랭킹 차트 (2칸 차지) */}
                                    <div className="lg:col-span-2 bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
                                        <div className="flex justify-between items-end mb-4 border-b pb-3">
                                            <div>
                                                <h3 className="text-lg font-bold text-gray-800">병원별 매출 랭킹</h3>
                                                <p className="text-xs text-gray-500 mt-1">상위/하위 병원의 매출을 시각화합니다.</p>
                                            </div>
                                            <div className="flex gap-2">
                                                <button onClick={() => setChartSort('top')} className={`text-xs font-bold px-3 py-1.5 rounded-full transition ${chartSort === 'top' ? 'bg-emerald-600 text-white shadow-md' : 'bg-gray-100 text-gray-500 hover:bg-gray-200'}`}>Top 10</button>
                                                <button onClick={() => setChartSort('bottom')} className={`text-xs font-bold px-3 py-1.5 rounded-full transition ${chartSort === 'bottom' ? 'bg-rose-500 text-white shadow-md' : 'bg-gray-100 text-gray-500 hover:bg-gray-200'}`}>Bottom 10</button>
                                            </div>
                                        </div>
                                        
                                        <div className="space-y-3 relative max-h-[350px] overflow-y-auto pr-2 custom-scroll">
                                            {displayedHospitals.length === 0 ? (
                                                <div className="py-10 text-center text-gray-400">데이터가 없습니다.</div>
                                            ) : (
                                                displayedHospitals.map((item, idx) => {
                                                    const percent = (item.amount / maxAmount) * 100;
                                                    const topColors = ['bg-emerald-500', 'bg-teal-500', 'bg-cyan-500', 'bg-sky-500', 'bg-blue-500'];
                                                    const bottomColors = ['bg-rose-500', 'bg-red-500', 'bg-orange-500', 'bg-amber-500', 'bg-yellow-500'];
                                                    const barColor = chartSort === 'top' ? topColors[idx % topColors.length] : bottomColors[idx % bottomColors.length];
                                                    
                                                    return (
                                                        <div key={item.id} className="group relative">
                                                            <div className="flex justify-between text-sm mb-1">
                                                                <span className="font-semibold text-gray-700 flex items-center gap-2">
                                                                    <span className="w-5 text-center text-gray-400 font-bold">{idx + 1}</span> {item.hospitalName}
                                                                </span>
                                                                <span className="font-bold text-gray-900">{formatCurr(item.amount)}</span>
                                                            </div>
                                                            <div className="w-full bg-gray-100 rounded-full h-3.5 overflow-hidden">
                                                                <div className={`h-3.5 rounded-full bar-fill ${barColor}`} style={{ width: chartRendered ? `${percent}%` : '0%' }}></div>
                                                            </div>
                                                        </div>
                                                    )
                                                })
                                            )}
                                        </div>
                                    </div>

                                    {/* 우측: 세금 팝업 트리거 및 도서 추천 */}
                                    <div className="space-y-4 flex flex-col h-full">
                                        
                                        <div onClick={() => setShowTaxModal(true)} className="bg-gray-800 hover:bg-gray-900 transition cursor-pointer text-white rounded-2xl p-5 shadow-sm transform hover:scale-[1.02]">
                                            <div className="flex justify-between items-center mb-3">
                                                <h3 className="font-bold flex items-center gap-2 text-sm"><i className="fas fa-file-invoice-dollar text-yellow-400"></i> {currentDate.month}월 세금 상세</h3>
                                                <span className="text-xs bg-gray-700 px-2 py-1 rounded-lg">확인하기 <i className="fas fa-chevron-right ml-1"></i></span>
                                            </div>
                                            <div className="bg-gray-700/50 p-4 rounded-xl border border-gray-600">
                                                <p className="text-3xl font-bold text-white text-center">TAX CHECK</p>
                                            </div>
                                        </div>

                                        <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 flex-1 flex flex-col min-h-[250px]">
                                            <h3 className="font-bold text-gray-800 mb-3 flex items-center gap-2 text-sm">
                                                <i className="fas fa-book text-amber-500"></i> 이번 주 추천 도서 Top 5
                                            </h3>
                                            <ul className="space-y-3 text-sm overflow-y-auto pr-2 custom-scroll">
                                                {['세일즈의 심리학 (브라이언 트레이시)', '기브 앤 테이크 (애덤 그랜트)', '설득의 심리학 (로버트 치알디니)', '데일 카네기 인간관계론', '부를 끌어당기는 생각 (나폴레온 힐)'].map((book, i) => (
                                                    <li key={i} className="flex gap-3 items-start border-b border-gray-50 pb-2">
                                                        <span className="text-amber-500 font-bold">{i+1}</span>
                                                        <div><p className="font-semibold text-gray-800 text-xs">{book.split('(')[0]}</p><p className="text-gray-500 text-[10px]">{book.split('(')[1]?.replace(')','')}</p></div>
                                                    </li>
                                                ))}
                                            </ul>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 관리자 로그인 뷰 */}
                        {view === 'login' && (
                            <div className="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-sm border border-gray-200 mt-10">
                                <h2 className="text-2xl font-black mb-6 text-center text-gray-800"><i className="fas fa-lock mr-2 text-gray-400"></i>관리자 모드</h2>
                                <input type="password" placeholder="비밀번호 입력" className="w-full p-4 border border-gray-300 rounded-xl mb-4 text-center text-xl tracking-widest focus:ring-2 focus:ring-emerald-500 outline-none" value={loginPin} onChange={e => setLoginPin(e.target.value)} onKeyDown={e => {if(e.key === 'Enter'){ if(loginPin === settings.adminPin){ setView('admin'); setLoginPin(''); } else { showToast('비밀번호가 틀렸습니다.', 'error'); }}}}/>
                                <button onClick={() => { if(loginPin === settings.adminPin){ setView('admin'); setLoginPin(''); } else { showToast('비밀번호가 틀렸습니다.', 'error'); } }} className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-xl transition">접속하기</button>
                            </div>
                        )}

                        {/* 관리자 대시보드 뷰 */}
                        {view === 'admin' && (
                            <div className="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                                <div className="bg-gray-800 p-5 flex justify-between items-center text-white">
                                    <h2 className="text-lg font-bold"><i className="fas fa-cogs mr-2"></i>시스템 관리 및 데이터 입력</h2>
                                </div>
                                <div className="p-6">
                                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                                        
                                        {/* 데이터 입력 영역 */}
                                        <div>
                                            <h3 className="font-bold text-gray-800 mb-4 border-b pb-2">1. 데이터 입력 (수동 / AI 첨부)</h3>
                                            
                                            {/* 수동 입력 폼 */}
                                            <div className="mb-6 p-4 bg-gray-50 rounded-xl border border-gray-200">
                                                <h4 className="font-semibold text-sm mb-3 text-gray-700">매출 수동 입력</h4>
                                                <div className="flex flex-col sm:flex-row gap-2">
                                                    <input type="text" className="flex-1 border border-gray-300 p-2 rounded-lg text-sm" placeholder="병원명" value={manualHosp} onChange={(e) => setManualHosp(e.target.value)} />
                                                    <input type="text" className="flex-1 border border-gray-300 p-2 rounded-lg text-sm font-bold text-gray-700" placeholder="금액 (, 자동생성)" value={manualAmt} onChange={handleManualAmtChange} />
                                                    <button onClick={handleManualSubmit} className="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-bold transition whitespace-nowrap">등록</button>
                                                </div>
                                            </div>

                                            {/* AI 파일 첨부 폼 */}
                                            <div className="mb-6">
                                                <div className="border-2 border-dashed border-emerald-300 rounded-xl p-6 text-center hover:bg-emerald-50 transition cursor-pointer relative group">
                                                    <input type="file" accept=".pdf,.jpg,.jpeg,.png,.xlsx,.xls,.csv" onChange={handleFileUpload} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
                                                    <i className="fas fa-cloud-upload-alt text-4xl text-emerald-500 mb-3 group-hover:scale-110 transition"></i>
                                                    <p className="font-bold text-gray-700 mb-1">AI 분석용 파일 업로드</p>
                                                    <p className="text-xs text-gray-500">지원: PDF, 이미지, 엑셀(csv)<br/>* HWP, PPT 등은 이미지 캡처 권장</p>
                                                </div>
                                                {aiMessage && <div className="mt-3 p-3 bg-blue-50 text-blue-700 text-sm rounded-lg animate-pulse text-center font-bold"><i className="fas fa-robot mr-2"></i>{aiMessage}</div>}
                                            </div>
                                        </div>

                                        {/* 데이터 리스트 및 설정 영역 */}
                                        <div>
                                            <h3 className="font-bold text-gray-800 mb-4 border-b pb-2">2. 데이터 관리 및 설정</h3>
                                            
                                            {/* 페이징 리스트 */}
                                            <div className="mb-6">
                                                <h4 className="font-semibold text-sm mb-2 text-gray-700">{currentDate.year}년 {currentDate.month}월 데이터 리스트</h4>
                                                <div className="border border-gray-200 rounded-lg overflow-hidden">
                                                    <table className="w-full text-sm text-left">
                                                        <thead className="text-xs text-gray-700 bg-gray-100">
                                                            <tr>
                                                                <th className="px-3 py-2 w-10 text-center">#</th>
                                                                <th className="px-3 py-2">병원명</th>
                                                                <th className="px-3 py-2">매출금액</th>
                                                                <th className="px-3 py-2 w-16 text-center">관리</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody>
                                                            {filteredMonthlySales.slice((adminPage - 1) * 5, adminPage * 5).map((item, idx) => (
                                                                <tr key={item.id} className="bg-white border-b hover:bg-gray-50">
                                                                    <td className="px-3 py-2 text-center text-gray-400 font-bold">{(adminPage - 1) * 5 + idx + 1}</td>
                                                                    <td className="px-3 py-2 font-medium">{item.hospitalName}</td>
                                                                    <td className="px-3 py-2">{formatCurr(item.amount)}</td>
                                                                    <td className="px-3 py-2 text-center">
                                                                        <button onClick={() => deleteSalesRecord(item.id)} className="text-red-500 hover:bg-red-100 p-1 rounded font-bold text-[10px]">삭제</button>
                                                                    </td>
                                                                </tr>
                                                            ))}
                                                            {filteredMonthlySales.length === 0 && <tr><td colSpan="4" className="text-center py-4 text-gray-400">데이터가 없습니다.</td></tr>}
                                                        </tbody>
                                                    </table>
                                                    {filteredMonthlySales.length > 5 && (
                                                        <div className="flex justify-center gap-1 bg-gray-50 py-2 border-t">
                                                            {Array.from({length: Math.ceil(filteredMonthlySales.length / 5)}, (_, i) => i + 1).map(num => (
                                                                <button key={num} onClick={() => setAdminPage(num)} className={`w-6 h-6 rounded-full text-xs font-bold ${adminPage === num ? 'bg-emerald-600 text-white' : 'bg-white border'}`}>{num}</button>
                                                            ))}
                                                        </div>
                                                    )}
                                                </div>
                                            </div>

                                            {/* 환경설정 */}
                                            <div className="space-y-4 bg-gray-50 p-4 rounded-xl border border-gray-200">
                                                <h4 className="font-semibold text-sm text-gray-700">환경 설정</h4>
                                                
                                                <div>
                                                    <label className="block text-xs font-bold text-gray-600 mb-1">상단 로고 이미지 교체 (파일 첨부)</label>
                                                    <input type="file" accept="image/*" onChange={handleLogoUpload} className="w-full text-sm border p-1 rounded bg-white" />
                                                </div>

                                                <div className="flex items-center justify-between border-b pb-2">
                                                    <span className="text-sm font-medium text-gray-700">상단 증시/환율 티커 표기</span>
                                                    <button onClick={() => updateSetting('tickerOn', !settings.tickerOn)} className={`w-12 h-6 rounded-full transition-colors relative ${settings.tickerOn ? 'bg-emerald-500' : 'bg-gray-300'}`}>
                                                        <div className={`w-4 h-4 bg-white rounded-full absolute top-1 transition-transform ${settings.tickerOn ? 'left-7' : 'left-1'}`}></div>
                                                    </button>
                                                </div>
                                                <div className="flex items-center justify-between">
                                                    <span className="text-sm font-medium text-gray-700">명언 표기</span>
                                                    <button onClick={() => updateSetting('quoteOn', !settings.quoteOn)} className={`w-12 h-6 rounded-full transition-colors relative ${settings.quoteOn ? 'bg-emerald-500' : 'bg-gray-300'}`}>
                                                        <div className={`w-4 h-4 bg-white rounded-full absolute top-1 transition-transform ${settings.quoteOn ? 'left-7' : 'left-1'}`}></div>
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* 세금 모달 팝업 */}
                    {showTaxModal && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4" onClick={() => setShowTaxModal(false)}>
                            <div className="bg-white rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl transform transition-all" onClick={e => e.stopPropagation()}>
                                <div className="bg-gray-900 p-5 text-white flex justify-between items-center">
                                    <h3 className="font-bold flex items-center gap-2"><i className="fas fa-calculator text-yellow-400"></i> {currentDate.month}월 세금 상세 분석</h3>
                                    <button onClick={() => setShowTaxModal(false)} className="text-gray-400 hover:text-white"><i className="fas fa-times text-xl"></i></button>
                                </div>
                                <div className="p-5 space-y-4">
                                    <div className="bg-gray-50 p-4 rounded-xl border border-gray-200">
                                        <p className="text-xs text-gray-500 mb-1">기준 과세표준 (당월 매출)</p>
                                        <p className="text-2xl font-black text-gray-800">{formatCurr(monthlyTotal)}</p>
                                    </div>
                                    <ul className="space-y-3 text-sm text-gray-600">
                                        <li className="flex justify-between items-center pb-2 border-b">
                                            <span>적용 세율 구간</span><span className="font-bold text-emerald-600">{taxEstimate.text}</span>
                                        </li>
                                        <li className="flex justify-between items-center pb-2 border-b">
                                            <span>산출 세액</span><span className="font-bold text-gray-800">{formatCurr(taxEstimate.tax)}</span>
                                        </li>
                                    </ul>
                                </div>
                                <div className="p-4 bg-gray-50 border-t"><button onClick={() => setShowTaxModal(false)} className="w-full bg-gray-800 hover:bg-gray-900 text-white font-bold py-3 rounded-xl transition">닫기</button></div>
                            </div>
                        </div>
                    )}

                    {/* 토스트 알림 */}
                    {toast && (
                        <div className="fixed bottom-5 left-1/2 transform -translate-x-1/2 z-50">
                            <div className={`px-6 py-3 rounded-full shadow-lg text-white font-medium text-sm flex items-center gap-2 ${toast.type === 'error' ? 'bg-red-500' : toast.type === 'success' ? 'bg-emerald-500' : 'bg-gray-800'}`}>
                                <i className={`fas ${toast.type === 'error' ? 'fa-exclamation-circle' : toast.type === 'success' ? 'fa-check-circle' : 'fa-info-circle'}`}></i>
                                {toast.msg}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
