<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J PHARM. Sales Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            500: '#14b8a6',
                            600: '#0d9488',
                            800: '#115e59',
                            900: '#134e4a',
                        }
                    },
                    fontFamily: {
                        sans: ['Pretendard', 'Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #f3f4f6; color: #1f2937; }
        /* Ticker Animation */
        @keyframes ticker {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        .ticker-wrap { width: 100%; overflow: hidden; background-color: #111827; color: #10b981; padding: 0.5rem 0; white-space: nowrap; }
        .ticker-move { display: inline-block; animation: ticker 25s linear infinite; }
        .ticker-move:hover { animation-play-state: paused; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); }
    </style>

    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot, collection, query, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Configuration injected by environment
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'j-pharm-default-01';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            // Mock config for local structure viewing if env missing
            apiKey: "mock-key", projectId: "mock-project"
        };
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Make globally available for React
        window.fbApp = app;
        window.fbAuth = auth;
        window.fbDb = db;
        window.fbAppId = appId;
        window.fbInitialAuthToken = initialAuthToken;
        window.fbSignInAnonymously = signInAnonymously;
        window.fbSignInWithCustomToken = signInWithCustomToken;
        window.fbMethods = { doc, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot, collection, query, addDoc, getDocs };
    </script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        
        // Helper: Format Currency
        const formatMoney = (amount) => {
            return new Intl.NumberFormat('ko-KR', { maximumFractionDigits: 0 }).format(amount) + '원';
        };

        // Helper: Default Date (Previous Month)
        const getDefaultDate = () => {
            const today = new Date();
            // If it's Jan (0), prev month is Dec (11) of prev year
            let year = today.getFullYear();
            let month = today.getMonth(); // 0-indexed, so 0 is Jan
            if (month === 0) {
                year -= 1;
                month = 12;
            }
            return { year, month }; // 1-12 indexed for user selection
        };

        // Book Recommendations Data
        const BOOKS = [
            { title: "성공하는 사람들의 7가지 습관", author: "스티븐 코비" },
            { title: "카네기 인간관계론", author: "데일 카네기" },
            { title: "세일즈 불변의 법칙", author: "제프리 기토머" },
            { title: "설득의 심리학", author: "로버트 치알디니" },
            { title: "초격차", author: "권오현" },
            { title: "프리임 팩터", author: "브라이언 트레이시" },
            { title: "그릿 (GRIT)", author: "앤절라 더크워스" },
            { title: "파는 것이 인간이다", author: "다니엘 핑크" },
            { title: "원씽 (The One Thing)", author: "게리 켈러" },
            { title: "아주 작은 습관의 힘", author: "제임스 클리어" }
        ];

        // Quotes Data
        const QUOTES = [
            "성공은 끝이 아니며, 실패는 치명적이지 않다. 중요한 것은 계속하는 용기다.",
            "기회는 일어나는 것이 아니라 만들어내는 것이다.",
            "영업은 거절에서부터 시작된다.",
            "위대한 업적은 대개 커다란 위험을 감수한 결과이다.",
            "행동 없는 비전은 꿈에 불과하다.",
            "당신의 가치는 당신이 제공하는 서비스의 질과 양에 의해 결정된다."
        ];

        const Toast = ({ message, type }) => (
            <div className={`fixed bottom-4 right-4 p-4 rounded-lg shadow-lg text-white font-medium z-50 transform transition-all duration-300 ${type === 'error' ? 'bg-red-500' : 'bg-brand-600'}`}>
                {message}
            </div>
        );

        const Modal = ({ isOpen, onClose, title, children }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                    <div className="bg-white rounded-xl shadow-2xl max-w-md w-full p-6 animate-fade-in-up">
                        <div className="flex justify-between items-center mb-4">
                            <h2 className="text-xl font-bold text-gray-800">{title}</h2>
                            <button onClick={onClose} className="text-gray-500 hover:text-gray-800"><i className="fas fa-times"></i></button>
                        </div>
                        {children}
                    </div>
                </div>
            );
        };

        const Ticker = ({ active }) => {
            const [marketData, setMarketData] = useState({ gold: 110000, usd: 1350, kospi: 2750, sp500: 5200 });

            // Simulate real-time fluctuation
            useEffect(() => {
                if(!active) return;
                const interval = setInterval(() => {
                    setMarketData(prev => ({
                        gold: prev.gold + (Math.random() * 200 - 100),
                        usd: prev.usd + (Math.random() * 2 - 1),
                        kospi: prev.kospi + (Math.random() * 4 - 2),
                        sp500: prev.sp500 + (Math.random() * 6 - 3)
                    }));
                }, 5000);
                return () => clearInterval(interval);
            }, [active]);

            if (!active) return null;

            return (
                <div className="ticker-wrap text-sm font-semibold tracking-wide">
                    <div className="ticker-move">
                        <span className="mx-6"><i className="fas fa-coins text-yellow-400 mr-2"></i>금(1g): {formatMoney(marketData.gold)}</span>
                        <span className="mx-6"><i className="fas fa-dollar-sign text-green-400 mr-2"></i>환율(USD): {marketData.usd.toFixed(1)}원</span>
                        <span className="mx-6"><i className="fas fa-chart-line text-blue-400 mr-2"></i>KOSPI: {marketData.kospi.toFixed(2)}</span>
                        <span className="mx-6"><i className="fas fa-globe-americas text-red-400 mr-2"></i>S&P 500: {marketData.sp500.toFixed(2)}</span>
                    </div>
                </div>
            );
        };

        const Dashboard = ({ data, settings, currentDate, setCurrentDate, setView }) => {
            const [showBars, setShowBars] = useState(false);
            const [booksOpen, setBooksOpen] = useState(false);
            const [taxOpen, setTaxOpen] = useState(false);
            const taxRef = useRef(null); // 세금 영역 스크롤 제어를 위한 Ref 추가

            useEffect(() => {
                // 기존 애니메이션 트리거
                setShowBars(false);
                const timer = setTimeout(() => setShowBars(true), 100);
                return () => clearTimeout(timer);
            }, [currentDate, data]);

            // 세금 탭이 열리면 부드럽게 스크롤을 맞춰주는 기능 추가
            useEffect(() => {
                if (taxOpen && taxRef.current) {
                    setTimeout(() => {
                        taxRef.current.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    }, 100);
                }
            }, [taxOpen]);

            // Calculate Metrics
            const currentMonthSales = data.filter(d => d.year === currentDate.year && d.month === currentDate.month);
            const ytdSales = data.filter(d => d.year === currentDate.year && d.month <= currentDate.month);

            const totalMonthAmount = currentMonthSales.reduce((acc, curr) => acc + curr.amount, 0);
            const totalYtdAmount = ytdSales.reduce((acc, curr) => acc + curr.amount, 0);

            // Sort and get Top/Bottom 10
            const sortedMonthSales = [...currentMonthSales].sort((a, b) => b.amount - a.amount);
            const top10 = sortedMonthSales.slice(0, 10);
            const bottom10 = sortedMonthSales.slice(-10).reverse().filter(item => !top10.includes(item)); // Avoid overlap if < 10 items

            const maxAmount = top10.length > 0 ? top10[0].amount : 1;

            // Books and Quote Logic (Daily/Weekly rotating)
            const dayOfYear = Math.floor((new Date() - new Date(new Date().getFullYear(), 0, 0)) / 1000 / 60 / 60 / 24);
            const weekOfYear = Math.floor(dayOfYear / 7);
            
            const currentQuote = QUOTES[dayOfYear % QUOTES.length];
            const currentBooks = [];
            for(let i=0; i<5; i++){
                currentBooks.push(BOOKS[(weekOfYear * 5 + i) % BOOKS.length]);
            }

            // Tax Estimation Logic (Simplified for Sole Proprietor in Korea)
            const vat = totalMonthAmount * 0.1; // 10% VAT
            const estimatedNetIncome = totalMonthAmount * 0.3; // Assume 30% margin
            const annualizedIncome = estimatedNetIncome * 12;
            let taxRate = 0.06;
            let deduction = 0;
            if (annualizedIncome > 1000000000) { taxRate = 0.45; deduction = 65400000; }
            else if (annualizedIncome > 500000000) { taxRate = 0.42; deduction = 35400000; }
            else if (annualizedIncome > 300000000) { taxRate = 0.40; deduction = 25400000; }
            else if (annualizedIncome > 150000000) { taxRate = 0.38; deduction = 19400000; }
            else if (annualizedIncome > 88000000) { taxRate = 0.35; deduction = 14900000; }
            else if (annualizedIncome > 50000000) { taxRate = 0.24; deduction = 5220000; }
            else if (annualizedIncome > 14000000) { taxRate = 0.15; deduction = 1080000; }
            
            const annualIncomeTax = (annualizedIncome * taxRate) - deduction;
            const monthlyIncomeTax = annualIncomeTax > 0 ? annualIncomeTax / 12 : 0;
            const totalEstimatedTax = vat + monthlyIncomeTax;

            const BarChart = ({ items, title, colorClass, max }) => (
                <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex-1">
                    <h3 className="text-lg font-bold mb-4 text-gray-800 border-b pb-2">{title}</h3>
                    {items.length === 0 ? <p className="text-gray-400 text-sm">데이터가 없습니다.</p> : (
                        <div className="space-y-4">
                            {items.map((item, index) => {
                                const percentage = Math.max((item.amount / max) * 100, 2); // min 2% for visibility
                                return (
                                    <div key={item.id} className="relative">
                                        <div className="flex justify-between text-sm mb-1">
                                            <span className="font-semibold text-gray-700">{index + 1}. {item.hospitalName}</span>
                                            <span className="text-gray-600 font-mono">{formatMoney(item.amount)}</span>
                                        </div>
                                        <div className="w-full bg-gray-100 rounded-full h-3">
                                            <div 
                                                className={`h-3 rounded-full ${colorClass} transition-all duration-1000 ease-out flex items-center justify-end`}
                                                style={{ width: showBars ? `${percentage}%` : '0%' }}
                                            ></div>
                                        </div>
                                    </div>
                                )
                            })}
                        </div>
                    )}
                </div>
            );

            return (
                <div className="max-w-7xl mx-auto px-4 py-8 space-y-6">
                    {/* Top Controls */}
                    <div className="flex flex-col md:flex-row justify-between items-center gap-4 bg-white p-4 rounded-2xl shadow-sm">
                        <div className="flex items-center gap-2">
                            <select 
                                className="border border-gray-300 rounded-lg px-4 py-2 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-brand-500 font-semibold"
                                value={currentDate.year}
                                onChange={(e) => setCurrentDate(prev => ({...prev, year: parseInt(e.target.value)}))}
                            >
                                {[...Array(10)].map((_, i) => {
                                    const y = new Date().getFullYear() - i;
                                    return <option key={y} value={y}>{y}년</option>;
                                })}
                            </select>
                            <select 
                                className="border border-gray-300 rounded-lg px-4 py-2 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-brand-500 font-semibold"
                                value={currentDate.month}
                                onChange={(e) => setCurrentDate(prev => ({...prev, month: parseInt(e.target.value)}))}
                            >
                                {[...Array(12)].map((_, i) => (
                                    <option key={i+1} value={i+1}>{i+1}월</option>
                                ))}
                            </select>
                        </div>
                        <button onClick={() => setBooksOpen(true)} className="bg-gray-800 text-white px-5 py-2 rounded-lg text-sm font-medium hover:bg-gray-700 transition shadow-sm">
                            <i className="fas fa-book mr-2"></i>이번 주 추천도서
                        </button>
                    </div>

                    {/* Daily Quote */}
                    {settings.quoteOn && (
                        <div className="bg-gradient-to-r from-brand-800 to-brand-600 text-white p-4 rounded-xl shadow-md text-center">
                            <i className="fas fa-quote-left opacity-50 mr-2"></i>
                            <span className="font-medium italic tracking-wide">{currentQuote}</span>
                            <i className="fas fa-quote-right opacity-50 ml-2"></i>
                        </div>
                    )}

                    {/* Key Metrics */}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div className="bg-white p-8 rounded-2xl shadow-sm border-l-4 border-brand-500 flex flex-col justify-center items-center">
                            <h2 className="text-gray-500 font-medium mb-2">{currentDate.month}월 당월 매출</h2>
                            <p className="text-4xl md:text-5xl font-bold text-gray-800 tracking-tight text-center break-all">{formatMoney(totalMonthAmount)}</p>
                        </div>
                        <div className="bg-white p-8 rounded-2xl shadow-sm border-l-4 border-blue-500 flex flex-col justify-center items-center">
                            <h2 className="text-gray-500 font-medium mb-2">{currentDate.year}년 누적 매출 (YTD)</h2>
                            <p className="text-4xl md:text-5xl font-bold text-gray-800 tracking-tight text-center break-all">{formatMoney(totalYtdAmount)}</p>
                        </div>
                    </div>

                    {/* Charts */}
                    <div className="flex flex-col md:flex-row gap-6">
                        <BarChart items={top10} title="상위 매출 병원 Top 10" colorClass="bg-gradient-to-r from-brand-400 to-brand-600" max={maxAmount} />
                        <BarChart items={bottom10} title="하위 매출 병원" colorClass="bg-gradient-to-r from-gray-300 to-gray-500" max={maxAmount} />
                    </div>

                    {/* Tax Section */}
                    <div ref={taxRef} className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                        <div 
                            className="p-6 cursor-pointer hover:bg-gray-50 transition flex justify-between items-center"
                            onClick={() => setTaxOpen(!taxOpen)}
                        >
                            <div>
                                <h3 className="text-lg font-bold text-gray-800"><i className="fas fa-calculator text-brand-500 mr-2"></i>{currentDate.month}월 매출 추정 세금</h3>
                                <p className="text-sm text-gray-500 mt-1">{settings.taxText || '* 본 세금은 추정치이며 실제 부과액과 다를 수 있습니다.'}</p>
                            </div>
                            <div className="flex items-center gap-4">
                                <span className="text-2xl font-bold text-red-500">{formatMoney(totalEstimatedTax)}</span>
                                <i className={`fas fa-chevron-${taxOpen ? 'up' : 'down'} text-gray-400`}></i>
                            </div>
                        </div>
                        
                        {taxOpen && (
                            <div className="p-6 bg-gray-50 border-t border-gray-100 grid grid-cols-1 md:grid-cols-2 gap-4 animate-fade-in-up">
                                <div className="bg-white p-4 rounded-xl border border-gray-200">
                                    <h4 className="font-semibold text-gray-700 mb-2">부가가치세 (예상)</h4>
                                    <p className="text-sm text-gray-500 mb-1">매출액의 약 10% (과세 기준)</p>
                                    <p className="text-xl font-bold text-gray-800">{formatMoney(vat)}</p>
                                </div>
                                <div className="bg-white p-4 rounded-xl border border-gray-200">
                                    <h4 className="font-semibold text-gray-700 mb-2">종합소득세 (월할 추정)</h4>
                                    <p className="text-sm text-gray-500 mb-1">소득율 30% 가정, 누진세율 적용 후 1/12</p>
                                    <p className="text-xl font-bold text-gray-800">{formatMoney(monthlyIncomeTax)}</p>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Book Modal */}
                    <Modal isOpen={booksOpen} onClose={() => setBooksOpen(false)} title="📚 영업인을 위한 금주의 추천도서">
                        <ul className="space-y-3">
                            {currentBooks.map((book, idx) => (
                                <li key={idx} className="p-3 bg-gray-50 rounded-lg border border-gray-100 flex items-start gap-3">
                                    <div className="bg-brand-100 text-brand-600 rounded-full w-6 h-6 flex items-center justify-center font-bold text-sm shrink-0">{idx+1}</div>
                                    <div>
                                        <p className="font-bold text-gray-800">{book.title}</p>
                                        <p className="text-sm text-gray-500">{book.author}</p>
                                    </div>
                                </li>
                            ))}
                        </ul>
                    </Modal>
                </div>
            );
        };

        const AdminDashboard = ({ data, settings, currentDate, setCurrentDate, setView, saveSettings, saveSalesData, deleteSalesData, addToast }) => {
            const [hospitalName, setHospitalName] = useState('');
            const [amount, setAmount] = useState('');
            const [pin, setPin] = useState(settings.adminPin || '6969');
            const [tickerOn, setTickerOn] = useState(settings.tickerOn);
            const [quoteOn, setQuoteOn] = useState(settings.quoteOn);
            const [taxText, setTaxText] = useState(settings.taxText || '');
            const [isAiProcessing, setIsAiProcessing] = useState(false);
            const [aiMessage, setAiMessage] = useState('');

            const currentMonthSales = data.filter(d => d.year === currentDate.year && d.month === currentDate.month).sort((a,b) => b.amount - a.amount);

            const handleAdd = async (e) => {
                e.preventDefault();
                if(!hospitalName || !amount) {
                    addToast('병원명과 매출액을 모두 입력해주세요.', 'error');
                    return;
                }
                await saveSalesData({
                    year: currentDate.year,
                    month: currentDate.month,
                    hospitalName,
                    amount: Number(amount.replace(/,/g, ''))
                });
                setHospitalName('');
                setAmount('');
                addToast('매출 데이터가 추가되었습니다.', 'success');
            };

            const handleSettingsSave = async () => {
                if(pin.length < 4) {
                    addToast('비밀번호는 최소 4자리 이상이어야 합니다.', 'error');
                    return;
                }
                await saveSettings({ adminPin: pin, tickerOn, quoteOn, taxText });
                addToast('설정이 저장되었습니다.', 'success');
            };

            const handleLogoUpload = (e) => {
                const file = e.target.files[0];
                if(!file) return;
                
                // Read and resize image for Firestore storage limits
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = async () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 300;
                        const scaleSize = MAX_WIDTH / img.width;
                        canvas.width = MAX_WIDTH;
                        canvas.height = img.height * scaleSize;
                        
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        
                        const base64Logo = canvas.toDataURL('image/png', 0.8);
                        await saveSettings({ logoBase64: base64Logo });
                        addToast('로고가 성공적으로 변경되었습니다.', 'success');
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            };

            // AI Data Parsing Integration
            const handleAiFileUpload = async (e) => {
                const file = e.target.files[0];
                if(!file) return;
                
                setIsAiProcessing(true);
                setAiMessage(`'${file.name}' 파일을 AI가 분석 및 교차 검증하고 있습니다...`);
                
                try {
                    const apiKey = ""; // API Key handled by Canvas environment
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

                    const promptText = `너는 전문 제약영업 데이터 분석 AI야. 제공된 문서, 텍스트 또는 이미지의 내용을 철저히 분석해서 '병원명(또는 거래처명)'과 '매출액(또는 금액)'을 정확히 추출해줘. 
조건:
1. 매출액은 반드시 원단위 숫자(number)로 변환해. (예: 10,000,000 -> 10000000, 1000만원 -> 10000000)
2. 불필요한 텍스트나 병원명과 관계없는 항목은 무시해.
3. 결과는 반드시 아래와 같은 순수 JSON 배열 형태로만 출력해. 마크다운(\`\`\`json 등)이나 다른 설명은 절대 넣지마.
[{"hospitalName": "서울대병원", "amount": 10000000}, {"hospitalName": "아산병원", "amount": 25000000}]`;

                    let payload = { contents: [{ role: "user", parts: [] }] };
                    const isImage = file.type.startsWith('image/');
                    const isPdf = file.type === 'application/pdf';

                    const readFile = () => new Promise((resolve) => {
                        const reader = new FileReader();
                        if (isImage || isPdf) {
                            reader.onload = (event) => resolve(event.target.result.split(',')[1]);
                            reader.readAsDataURL(file);
                        } else {
                            reader.onload = (event) => resolve(event.target.result);
                            reader.readAsText(file);
                        }
                    });

                    const fileData = await readFile();

                    if (isImage) {
                        payload.contents[0].parts.push({ text: promptText });
                        payload.contents[0].parts.push({ inlineData: { mimeType: file.type, data: fileData } });
                    } else if (isPdf) {
                        payload.contents[0].parts.push({ text: promptText });
                        payload.contents[0].parts.push({ inlineData: { mimeType: 'application/pdf', data: fileData } });
                    } else {
                        const truncatedText = fileData.substring(0, 40000); // 텍스트 한도 조정
                        payload.contents[0].parts.push({ text: promptText + "\n\n--- 파일 데이터 시작 ---\n" + truncatedText });
                    }

                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    const result = await response.json();
                    
                    if (result.error) throw new Error(result.error.message);

                    if (result.candidates && result.candidates.length > 0) {
                        let aiText = result.candidates[0].content.parts[0].text;
                        aiText = aiText.replace(/```json/g, '').replace(/```/g, '').trim();

                        try {
                            const parsedData = JSON.parse(aiText);
                            if (Array.isArray(parsedData) && parsedData.length > 0) {
                                setAiMessage('데이터 추출 성공! 실시간 데이터베이스에 동기화 중입니다...');
                                let count = 0;
                                const savePromises = parsedData.map(item => {
                                    if (item.hospitalName && item.amount) {
                                        count++;
                                        return saveSalesData({
                                            year: currentDate.year,
                                            month: currentDate.month,
                                            hospitalName: String(item.hospitalName),
                                            amount: Number(item.amount)
                                        });
                                    }
                                    return Promise.resolve();
                                });
                                await Promise.all(savePromises);
                                addToast(`${count}개의 병원 매출 데이터가 AI 분석을 통해 정확히 등록되었습니다.`, 'success');
                            } else {
                                addToast('분석 가능한 매출 데이터 항목을 찾지 못했습니다.', 'info');
                            }
                        } catch (parseError) {
                            addToast('데이터 구조화 실패. 암호화된 파일(HWP, PPT 등)인 경우 이미지나 PDF 변환 후 업로드해보세요.', 'error');
                        }
                    } else {
                        addToast('AI 서버 응답이 올바르지 않습니다.', 'error');
                    }
                } catch (err) {
                    console.error(err);
                    // 로컬(file://) 실행 시 발생하는 오류 안내 추가
                    if (window.location.protocol === 'file:') {
                        addToast('로컬 파일(file://) 환경입니다. AI 분석 및 DB 기능은 웹 서버(URL) 환경에서만 정상 동작합니다.', 'error');
                    } else {
                        addToast('파일 분석 중 시스템 오류가 발생했습니다.', 'error');
                    }
                } finally {
                    setIsAiProcessing(false);
                    e.target.value = null; // 입력 초기화
                }
            };

            return (
                <div className="max-w-7xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
                    {/* Left Col: Settings */}
                    <div className="space-y-6">
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                            <h2 className="text-xl font-bold mb-4 flex items-center"><i className="fas fa-cogs mr-2 text-gray-500"></i>기본 설정</h2>
                            <div className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">관리자 비밀번호 변경</label>
                                    <input type="password" value={pin} onChange={e=>setPin(e.target.value)} className="w-full border px-3 py-2 rounded-lg" />
                                </div>
                                <div className="flex items-center justify-between">
                                    <span className="text-sm font-medium text-gray-700">상단 증시 티커 사용</span>
                                    <label className="relative inline-flex items-center cursor-pointer">
                                        <input type="checkbox" checked={tickerOn} onChange={e=>setTickerOn(e.target.checked)} className="sr-only peer"/>
                                        <div className="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-brand-500"></div>
                                    </label>
                                </div>
                                <div className="flex items-center justify-between">
                                    <span className="text-sm font-medium text-gray-700">명언 기능 사용</span>
                                    <label className="relative inline-flex items-center cursor-pointer">
                                        <input type="checkbox" checked={quoteOn} onChange={e=>setQuoteOn(e.target.checked)} className="sr-only peer"/>
                                        <div className="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-brand-500"></div>
                                    </label>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">세금 추정 안내문구 수정</label>
                                    <textarea value={taxText} onChange={e=>setTaxText(e.target.value)} className="w-full border px-3 py-2 rounded-lg text-sm h-20" placeholder="* 본 세금은 추정치이며..."></textarea>
                                </div>
                                <button onClick={handleSettingsSave} className="w-full bg-gray-800 text-white py-2 rounded-lg font-medium hover:bg-gray-700">설정 저장</button>
                            </div>
                        </div>

                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                            <h2 className="text-xl font-bold mb-4 flex items-center"><i className="fas fa-image mr-2 text-gray-500"></i>로고 관리</h2>
                            <p className="text-xs text-gray-500 mb-3">회사 로고 이미지를 업로드하세요. 화면에 맞게 자동 조절됩니다.</p>
                            <label className="flex flex-col items-center justify-center w-full h-32 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100">
                                <div className="flex flex-col items-center justify-center pt-5 pb-6">
                                    <i className="fas fa-cloud-upload-alt text-2xl text-gray-400 mb-2"></i>
                                    <p className="text-sm text-gray-500"><span className="font-semibold">클릭하여 업로드</span></p>
                                </div>
                                <input type="file" className="hidden" accept="image/*" onChange={handleLogoUpload} />
                            </label>
                        </div>
                    </div>

                    {/* Right Col: Data Entry */}
                    <div className="lg:col-span-2 bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-gray-100">
                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                            <h2 className="text-xl font-bold flex items-center"><i className="fas fa-database mr-2 text-brand-500"></i>매출 데이터 관리</h2>
                            <div className="flex gap-2 w-full sm:w-auto">
                                <select 
                                    className="border rounded px-2 py-1 bg-gray-50 flex-1 sm:flex-none"
                                    value={currentDate.year}
                                    onChange={(e) => setCurrentDate(prev => ({...prev, year: parseInt(e.target.value)}))}
                                >
                                    {[...Array(5)].map((_, i) => {
                                        const y = new Date().getFullYear() - i;
                                        return <option key={y} value={y}>{y}년</option>;
                                    })}
                                </select>
                                <select 
                                    className="border rounded px-2 py-1 bg-gray-50"
                                    value={currentDate.month}
                                    onChange={(e) => setCurrentDate(prev => ({...prev, month: parseInt(e.target.value)}))}
                                >
                                    {[...Array(12)].map((_, i) => (
                                        <option key={i+1} value={i+1}>{i+1}월</option>
                                    ))}
                                </select>
                            </div>
                        </div>

                        {/* Input Form */}
                        <form onSubmit={handleAdd} className="flex flex-col sm:flex-row gap-3 mb-6 bg-gray-50 p-4 rounded-xl border border-gray-200">
                            <input 
                                type="text" 
                                placeholder="병원명 (예: 서울대병원)" 
                                className="w-full sm:flex-1 border px-3 py-2 rounded-lg"
                                value={hospitalName}
                                onChange={e => setHospitalName(e.target.value)}
                            />
                            <input 
                                type="number" 
                                placeholder="매출액 (숫자만 입력)" 
                                className="w-full sm:flex-1 border px-3 py-2 rounded-lg"
                                value={amount}
                                onChange={e => setAmount(e.target.value)}
                            />
                            <button type="submit" className="w-full sm:w-auto bg-brand-600 text-white px-6 py-2 rounded-lg font-medium hover:bg-brand-700 whitespace-nowrap">수동 추가</button>
                        </form>

                        {/* AI / CSV Upload Button */}
                        <div className="mb-6 flex flex-col sm:flex-row items-start sm:items-center justify-between bg-brand-50 p-4 rounded-xl border border-brand-100 gap-4 relative overflow-hidden">
                            {isAiProcessing && (
                                <div className="absolute inset-0 bg-white/80 backdrop-blur-sm z-10 flex flex-col items-center justify-center">
                                    <div className="animate-spin rounded-full h-8 w-8 border-b-2 border-brand-600 mb-2"></div>
                                    <p className="text-brand-800 font-bold text-sm animate-pulse text-center px-4">{aiMessage}</p>
                                </div>
                            )}
                            <div className="flex-1">
                                <h4 className="font-bold text-brand-800 text-sm mb-1"><i className="fas fa-brain mr-1 text-brand-600"></i> AI 데이터 자동 분석 및 등록</h4>
                                <p className="text-xs text-brand-600 break-keep">PDF, 엑셀, 이미지(JPG, PNG), 워드, 한글(HWP) 파일을 올리면 AI가 알아서 병원명과 매출을 분리해 저장합니다.</p>
                            </div>
                            <label className="w-full sm:w-auto text-center bg-white border border-brand-300 text-brand-700 px-4 py-3 sm:py-2 rounded-lg text-sm font-bold cursor-pointer hover:bg-brand-100 shadow-sm transition">
                                <i className="fas fa-file-upload mr-2"></i>파일 첨부 (AI 분석)
                                <input type="file" className="hidden" accept=".pdf, .xlsx, .xls, .jpg, .jpeg, .png, .ppt, .pptx, .doc, .docx, .hwp, .csv, .txt" onChange={handleAiFileUpload} disabled={isAiProcessing} />
                            </label>
                        </div>

                        {/* Data List */}
                        <div className="overflow-x-auto w-full">
                            <table className="w-full text-left text-sm text-gray-600 min-w-[300px]">
                                <thead className="bg-gray-100 text-gray-700 font-bold uppercase text-xs">
                                    <tr>
                                        <th className="px-4 py-3 rounded-tl-lg">병원명</th>
                                        <th className="px-4 py-3">매출액</th>
                                        <th className="px-4 py-3 rounded-tr-lg text-right">관리</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {currentMonthSales.length === 0 ? (
                                        <tr><td colSpan="3" className="text-center py-8 text-gray-400">등록된 매출 데이터가 없습니다.</td></tr>
                                    ) : (
                                        currentMonthSales.map(item => (
                                            <tr key={item.id} className="border-b last:border-b-0 hover:bg-gray-50">
                                                <td className="px-4 py-3 font-medium">{item.hospitalName}</td>
                                                <td className="px-4 py-3 font-mono">{formatMoney(item.amount)}</td>
                                                <td className="px-4 py-3 text-right">
                                                    <button onClick={() => deleteSalesData(item.id)} className="text-red-500 hover:text-red-700 px-2 py-1 rounded">
                                                        <i className="fas fa-trash-alt"></i>
                                                    </button>
                                                </td>
                                            </tr>
                                        ))
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('main'); // 'main', 'admin', 'login'
            const [data, setData] = useState([]);
            const [settings, setSettings] = useState({
                tickerOn: true,
                quoteOn: true,
                adminPin: '6969',
                logoBase64: '',
                taxText: ''
            });
            const [currentDate, setCurrentDate] = useState(getDefaultDate());
            const [toast, setToast] = useState(null);
            const [isAuthReady, setIsAuthReady] = useState(false);
            const [loginPin, setLoginPin] = useState('');

            const showToast = (msg, type='info') => {
                setToast({ message: msg, type });
                setTimeout(() => setToast(null), 3000);
            };

            // Initialize Firebase Auth & Data Listeners
            useEffect(() => {
                const initFirebase = async () => {
                    try {
                        // Authenticate for Firestore rules compliance
                        if (window.fbInitialAuthToken) {
                            await window.fbSignInWithCustomToken(window.fbAuth, window.fbInitialAuthToken);
                        } else {
                            await window.fbSignInAnonymously(window.fbAuth);
                        }
                    } catch (err) {
                        console.error("Auth Error:", err);
                        showToast("서버 연결에 실패했습니다. (로컬 테스트 모드)", "error");
                    } finally {
                        // 에러가 발생하더라도 로딩 상태를 해제하여 화면에 진입하도록 수정
                        setIsAuthReady(true);
                    }
                };
                initFirebase();
            }, []);

            useEffect(() => {
                if (!isAuthReady) return;

                const db = window.fbDb;
                const appId = window.fbAppId;
                
                // 1. Sync Settings
                const settingsRef = window.fbMethods.doc(db, 'artifacts', appId, 'public', 'data', 'config', 'settings');
                const unsubSettings = window.fbMethods.onSnapshot(settingsRef, (docSnap) => {
                    if (docSnap.exists()) {
                        setSettings(prev => ({...prev, ...docSnap.data()}));
                    } else {
                        // Create default settings if not exist
                        window.fbMethods.setDoc(settingsRef, settings);
                    }
                }, (error) => {
                    console.error("Settings sync error", error);
                });

                // 2. Sync Sales Data (Fetching all to filter in memory - adheres to Rule 2)
                const salesColRef = window.fbMethods.collection(db, 'artifacts', appId, 'public', 'data', 'sales');
                const unsubSales = window.fbMethods.onSnapshot(salesColRef, (snapshot) => {
                    const fetchedData = [];
                    snapshot.forEach(doc => {
                        fetchedData.push({ id: doc.id, ...doc.data() });
                    });
                    setData(fetchedData);
                }, (error) => {
                    console.error("Sales sync error", error);
                });

                return () => {
                    unsubSettings();
                    unsubSales();
                };
            }, [isAuthReady]);

            // Handlers for Firestore operations
            const saveSettings = async (newSettingsObj) => {
                const db = window.fbDb;
                const appId = window.fbAppId;
                const settingsRef = window.fbMethods.doc(db, 'artifacts', appId, 'public', 'data', 'config', 'settings');
                await window.fbMethods.setDoc(settingsRef, newSettingsObj, { merge: true });
            };

            const saveSalesData = async (salesObj) => {
                const db = window.fbDb;
                const appId = window.fbAppId;
                const salesColRef = window.fbMethods.collection(db, 'artifacts', appId, 'public', 'data', 'sales');
                await window.fbMethods.addDoc(salesColRef, salesObj);
            };

            const deleteSalesData = async (docId) => {
                const db = window.fbDb;
                const appId = window.fbAppId;
                const docRef = window.fbMethods.doc(db, 'artifacts', appId, 'public', 'data', 'sales', docId);
                await window.fbMethods.deleteDoc(docRef);
                showToast('삭제 완료', 'success');
            };

            const handleLogin = (e) => {
                e.preventDefault();
                if (loginPin === settings.adminPin) {
                    setView('admin');
                    setLoginPin('');
                } else {
                    showToast('비밀번호가 일치하지 않습니다.', 'error');
                }
            };

            if (!isAuthReady) {
                return <div className="min-h-screen flex items-center justify-center text-gray-500 font-semibold">시스템 로딩 중...</div>;
            }

            return (
                <div className="min-h-screen flex flex-col relative pb-20">
                    <Ticker active={settings.tickerOn} />
                    
                    {/* Header */}
                    <header className="bg-white shadow-sm sticky top-0 z-40">
                        <div className="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
                            <div className="flex items-center gap-3 cursor-pointer" onClick={() => setView('main')}>
                                {settings.logoBase64 ? (
                                    <img src={settings.logoBase64} alt="J PHARM Logo" className="h-10 object-contain" />
                                ) : (
                                    <div className="bg-brand-600 text-white font-bold text-xl px-3 py-1 rounded-lg tracking-wider">
                                        J PHARM.
                                    </div>
                                )}
                            </div>
                            <nav className="flex items-center gap-4">
                                {view !== 'main' && (
                                    <button onClick={() => setView('main')} className="text-gray-600 hover:text-brand-600 font-medium text-sm">
                                        메인으로
                                    </button>
                                )}
                                <button 
                                    onClick={() => setView(view === 'admin' || view === 'login' ? 'main' : 'login')} 
                                    className="text-gray-400 hover:text-gray-700 transition"
                                >
                                    <i className="fas fa-cog text-xl"></i>
                                </button>
                            </nav>
                        </div>
                    </header>

                    {/* Main Content Area */}
                    <main className="flex-1">
                        {view === 'main' && (
                            <Dashboard 
                                data={data} 
                                settings={settings} 
                                currentDate={currentDate} 
                                setCurrentDate={setCurrentDate} 
                                setView={setView} 
                            />
                        )}
                        
                        {view === 'login' && (
                            <div className="flex items-center justify-center mt-20 px-4">
                                <form onSubmit={handleLogin} className="bg-white p-8 rounded-2xl shadow-lg max-w-sm w-full text-center">
                                    <div className="w-16 h-16 bg-brand-100 text-brand-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                                        <i className="fas fa-lock"></i>
                                    </div>
                                    <h2 className="text-2xl font-bold text-gray-800 mb-6">관리자 로그인</h2>
                                    <input 
                                        type="password" 
                                        placeholder="비밀번호 입력" 
                                        className="w-full border-2 border-gray-200 px-4 py-3 rounded-xl mb-4 focus:outline-none focus:border-brand-500 text-center tracking-widest text-lg"
                                        value={loginPin}
                                        onChange={(e) => setLoginPin(e.target.value)}
                                        autoFocus
                                    />
                                    <button type="submit" className="w-full bg-brand-600 text-white font-bold py-3 rounded-xl hover:bg-brand-700 transition">
                                        접속하기
                                    </button>
                                </form>
                            </div>
                        )}

                        {view === 'admin' && (
                            <AdminDashboard 
                                data={data} 
                                settings={settings} 
                                currentDate={currentDate} 
                                setCurrentDate={setCurrentDate}
                                setView={setView}
                                saveSettings={saveSettings}
                                saveSalesData={saveSalesData}
                                deleteSalesData={deleteSalesData}
                                addToast={showToast}
                            />
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="mt-auto py-6 text-center text-gray-400 text-sm border-t bg-gray-50">
                        &copy; {new Date().getFullYear()} J PHARM. Sales Intelligence Dashboard. All rights reserved.
                    </footer>

                    {/* Global Toast */}
                    {toast && <Toast message={toast.message} type={toast.type} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
