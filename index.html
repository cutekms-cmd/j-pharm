<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J PHARM Sales Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lunar-javascript/lunar.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; overflow-x: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes marquee { 
            0% { transform: translateX(100%); } 
            100% { transform: translateX(-100%); } 
        }
        .animate-marquee { display: inline-block; animation: marquee 20s linear infinite; }
        .chart-bar { transition: width 1s cubic-bezier(0.4, 0, 0.2, 1); }
        .polyline-animate { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: dash 2s ease-out forwards; }
        @keyframes dash { to { stroke-dashoffset: 0; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden text-gray-800">
    <div id="root" class="h-full w-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const SUPABASE_URL = 'https://gyqaartzrlsqvbvvyhgb.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_MYC70x3Kmmyn3hU8kGgTDw_-uCsYluc'; // 올바른 소문자 l 적용 확인 완료

        const getDefaultDate = () => {
            const today = new Date();
            let year = today.getFullYear();
            let month = today.getMonth();
            if (month === 0) { year -= 1; month = 12; }
            return { year, month };
        };

        const formatCurr = (num) => new Intl.NumberFormat('ko-KR').format(Math.ceil(Number(num))) + '원';
        
        const formatDateWithDay = (date) => {
            const days = ['일', '월', '화', '수', '목', '금', '토'];
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            const day = days[date.getDay()];
            return `${y}.${m}.${d}(${day})`;
        };

        const defaultUiTexts = {
            mainTitle: 'J PHARM.',
            monthlySalesTitle: '당월 매출 현황',
            ytdSalesTitle: '누적 매출',
            netIncomeTitle: '당월 순수익 (매출-수수료)',
            taxCheckTitle: 'TAX CHECK',
            weatherTitle: '실시간 주요 영업 지역 날씨',
            birthdayTitle: '원장님 생일 D-Day',
            bookTitle: '금주의 추천 도서',
            quoteText: '현재야, 오늘도 주아와 경옥 제수씨를 위해 달리는 너의 열정을 응원한다! 최고의 영업맨 박현재 화이팅!'
        };

        function App() {
            const [view, setView] = useState('main'); 
            const [adminTab, setAdminTab] = useState('data'); 
            const [salesData, setSalesData] = useState([]);
            const [uiTexts, setUiTexts] = useState(defaultUiTexts);
            const [visitors, setVisitors] = useState({ today: 0, total: 0 });
            
            const [settings, setSettings] = useState({ 
                tickerOn: true, quoteOn: true, adminPin: '6969', logoBase64: '', 
                monthlyTargets: { '2026-6': 50000000, '2026-5': 50000000, '2026-4': 40000000 } 
            });
            const [currentDate, setCurrentDate] = useState(getDefaultDate());
            const [toast, setToast] = useState(null);
            const [loginPin, setLoginPin] = useState("");
            const [isConnected, setIsConnected] = useState(navigator.onLine);
            const [newAdminPin, setNewAdminPin] = useState('');
            
            const [manualHosp, setManualHosp] = useState('');
            const [manualAmt, setManualAmt] = useState('');
            const [manualComm, setManualComm] = useState('');
            const [commType, setCommType] = useState('fixed');
            const [adminPage, setAdminPage] = useState(1);
            const [adminDate, setAdminDate] = useState(getDefaultDate());
            
            const [showTaxModal, setShowTaxModal] = useState(false);
            const [chartSort, setChartSort] = useState('current'); 
            const [chartRendered, setChartRendered] = useState(false);
            const [selectedHospDetail, setSelectedHospDetail] = useState(null);

            const [hospitalMaster, setHospitalMaster] = useState(['서울대병원', '아산병원', '세브란스', '삼성의료원', '성모병원']);
            const [doctorProfiles, setDoctorProfiles] = useState([
                { id: 1, hospitalName: '서울대병원', doctorName: '김의사', birthDate: '1975-08-25', isLunar: false, likes: '골프, 와인', family: '배우자, 1남' },
                { id: 2, hospitalName: '아산병원', doctorName: '이원장', birthDate: '1982-08-28', isLunar: true, likes: '테니스, 독서', family: '배우자' }
            ]);
            const [newDoc, setNewDoc] = useState({ hospitalName: '', doctorName: '', birthDate: '', isLunar: false, likes: '', family: '' });
            const [docPage, setDocPage] = useState(1);
            const [editDocId, setEditDocId] = useState(null);
            const [editDocData, setEditDocData] = useState({ doctorName: '', birthDate: '', isLunar: false, likes: '', family: '' });
            
            const [aiGiftMessage, setAiGiftMessage] = useState({});
            const [isAiLoading, setIsAiLoading] = useState(false);
            const [bdayPage, setBdayPage] = useState(1);
            
            const [vatCostOption, setVatCostOption] = useState(0); 
            const [incCostOption, setIncCostOption] = useState(0);
            
            const [bookModal, setBookModal] = useState(null);
            const [isMobile, setIsMobile] = useState(window.innerWidth < 768);
            const [weatherData, setWeatherData] = useState(null);
            const [selectedDocDetail, setSelectedDocDetail] = useState(null);

            const fetchRealtimeData = async () => {
                try {
                    const res = await fetch(`${SUPABASE_URL}/rest/v1/sales_data?select=*`, {
                        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                    });
                    if (res.ok) {
                        const data = await res.json();
                        setSalesData(data || []);
                    }
                } catch(e) {}
            };

            useEffect(() => {
                const handleResize = () => setIsMobile(window.innerWidth < 768);
                window.addEventListener('resize', handleResize);

                const fetchUiTexts = async () => {
                    try {
                        const res = await fetch(`${SUPABASE_URL}/rest/v1/ui_settings?select=*`, {
                            headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                        });
                        if (res.ok) {
                            const data = await res.json();
                            if (data && data.length > 0) {
                                const newTexts = { ...defaultUiTexts };
                                data.forEach(item => { newTexts[item.key_name] = item.value_text; });
                                setUiTexts(newTexts);
                            }
                        }
                    } catch(e) {}
                };

                const fetchAndRecordVisitors = async () => {
                    const todayStr = new Date().toISOString().split('T')[0];
                    const visited = sessionStorage.getItem('visited_today');
                    
                    try {
                        if (visited !== todayStr) {
                            await fetch(`${SUPABASE_URL}/rest/v1/visitor_logs`, {
                                method: 'POST',
                                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
                                body: JSON.stringify({ date_str: todayStr })
                            });
                            sessionStorage.setItem('visited_today', todayStr);
                        }
                        
                        const resToday = await fetch(`${SUPABASE_URL}/rest/v1/visitor_logs?select=id&date_str=eq.${todayStr}`, { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Prefer': 'count=exact' }});
                        const todayRange = resToday.headers.get('content-range');
                        const todayCount = parseInt((todayRange && todayRange.split('/')[1]) || 1);

                        const resTotal = await fetch(`${SUPABASE_URL}/rest/v1/visitor_logs?select=id`, { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Prefer': 'count=exact' }});
                        const totalRange = resTotal.headers.get('content-range');
                        const totalCount = parseInt((totalRange && totalRange.split('/')[1]) || 1);

                        setVisitors({ today: todayCount || 1, total: totalCount || 1 });
                    } catch(e) {}
                };

                const fetchWeather = async () => {
                    try {
                        const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=37.3422,37.1408&longitude=127.9202,128.2144&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=Asia%2FSeoul&forecast_days=2');
                        const data = await res.json();
                        if (Array.isArray(data) && data.length >= 2) {
                            setWeatherData({ wonju: data[0].daily, jecheon: data[1].daily });
                        }
                    } catch(e) {}
                };

                fetchRealtimeData();
                fetchUiTexts();
                fetchAndRecordVisitors();
                fetchWeather();

                const syncInterval = setInterval(() => { 
                    if (navigator.onLine) {
                        fetchRealtimeData();
                        fetchUiTexts();
                    }
                }, 5000);

                const handleOnline = () => { setIsConnected(true); showToast('실시간 연결 복구됨', 'success'); fetchRealtimeData(); };
                const handleOffline = () => { setIsConnected(false); showToast('네트워크 끊김', 'error'); };
                
                window.addEventListener('online', handleOnline);
                window.addEventListener('offline', handleOffline);
                setTimeout(() => setChartRendered(true), 300);

                return () => {
                    clearInterval(syncInterval);
                    window.removeEventListener('resize', handleResize);
                    window.removeEventListener('online', handleOnline); 
                    window.removeEventListener('offline', handleOffline);
                };
            }, []);

            const showToast = (msg, type='info') => {
                setToast({msg, type});
                setTimeout(() => setToast(null), 3000);
            };

            const filteredData = useMemo(() => salesData.filter(d => d.year === currentDate.year && d.month === currentDate.month), [salesData, currentDate]);
            const ytdData = useMemo(() => salesData.filter(d => d.year === currentDate.year && d.month <= currentDate.month), [salesData, currentDate]);

            const monthlyTotal = useMemo(() => filteredData.reduce((sum, curr) => sum + Number(curr.amount || 0), 0), [filteredData]);
            const monthlyCommTotal = useMemo(() => filteredData.reduce((sum, curr) => sum + Number(curr.commission || 0), 0), [filteredData]);
            const monthlyNetIncome = monthlyTotal - monthlyCommTotal;
            
            const currentMonthTarget = useMemo(() => settings.monthlyTargets[`${currentDate.year}-${currentDate.month}`] || 50000000, [settings.monthlyTargets, currentDate]);
            const monthlyAchieve = currentMonthTarget > 0 ? Math.min(100, Math.round((monthlyTotal / currentMonthTarget) * 100)) : 0;

            const ytdTotal = useMemo(() => ytdData.reduce((sum, curr) => sum + Number(curr.amount || 0), 0), [ytdData]);
            const ytdCommTotal = useMemo(() => ytdData.reduce((sum, curr) => sum + Number(curr.commission || 0), 0), [ytdData]);
            const ytdNetIncome = ytdTotal - ytdCommTotal;
            
            const currentYearTarget = useMemo(() => {
                let total = 0;
                for(let i=1; i<=12; i++) {
                    total += (settings.monthlyTargets[`${currentDate.year}-${i}`] || 50000000);
                }
                return total;
            }, [settings.monthlyTargets, currentDate.year]);
            const yearlyAchieve = currentYearTarget > 0 ? Math.min(100, Math.round((ytdTotal / currentYearTarget) * 100)) : 0;

            const taxEstimate = useMemo(() => {
                const vatCost = Number(vatCostOption) || 0; 
                const incCost = Number(incCostOption) || 0; 
                
                const isFirstHalf = currentDate.month <= 6;
                const vatSales = salesData.filter(d => d.year === currentDate.year && (isFirstHalf ? d.month <= 6 : d.month > 6)).reduce((sum, curr) => sum + Number(curr.amount || 0), 0);
                const incSales = salesData.filter(d => d.year === currentDate.year).reduce((sum, curr) => sum + Number(curr.amount || 0), 0);
                
                const vat = Math.max(0, Math.ceil(vatSales * 0.1) - Math.ceil(vatCost * 0.1)); 
                const netRevenue = Math.max(0, incSales - incCost);
                let incTax = 0;
                
                if (netRevenue <= 14000000) { incTax = netRevenue * 0.06; }
                else if (netRevenue <= 50000000) { incTax = 840000 + (netRevenue - 14000000) * 0.15; }
                else if (netRevenue <= 88000000) { incTax = 6240000 + (netRevenue - 50000000) * 0.24; }
                else if (netRevenue <= 150000000) { incTax = 15360000 + (netRevenue - 88000000) * 0.35; }
                else { incTax = 37060000 + (netRevenue - 150000000) * 0.38; }
                
                const localTax = Math.ceil(incTax * 0.1); 
                
                const today = new Date();
                const y = today.getFullYear();
                let vatD1 = new Date(y, 0, 25);
                let vatD2 = new Date(y, 6, 25);
                if(today > vatD2) vatD1 = new Date(y+1, 0, 25);
                const nextVatDate = (today <= vatD1 || today > vatD2) ? vatD1 : vatD2;
                const vatPeriod = nextVatDate.getMonth() === 0 ? "2기(7~12월)" : "1기(1~6월)";
                
                let incDate = new Date(y, 4, 31);
                if(today > incDate) incDate = new Date(y+1, 4, 31);

                const diffVat = Math.ceil((nextVatDate - today)/(1000*60*60*24));
                const diffInc = Math.ceil((incDate - today)/(1000*60*60*24));
                const totalTax = vat + incTax + localTax;
                
                const msgs = totalTax > 15000000 ? ["세금 폭탄 경보! 💣 매출이 엄청나시네요. 미리 절세 플랜을 준비하세요!"] : ["성실 납세의 아이콘! 이번 달도 고생 많으셨습니다. 😊"];
                const comment = msgs[Math.floor(Math.random() * msgs.length)];
                
                return { vat, incTax, localTax, totalTax, comment, nextVatDateStr: formatDateWithDay(nextVatDate), vatPeriod, diffVat, incDateStr: formatDateWithDay(incDate), diffInc, vatSales, incSales };
            }, [salesData, currentDate, vatCostOption, incCostOption]);

            const hospitalStats = useMemo(() => {
                const stats = {};
                salesData.forEach(d => {
                    if (d.year === currentDate.year && d.month <= currentDate.month) {
                        const hName = d.hospitalName || d.hospitalname;
                        if (!stats[hName]) {
                            stats[hName] = { id: hName, hospitalName: hName, current: 0, accumulated: 0 };
                        }
                        const net = Number(d.amount || 0) - Number(d.commission || 0);
                        if (d.month === currentDate.month) {
                            stats[hName].current += net;
                        }
                        stats[hName].accumulated += net;
                    }
                });
                return Object.values(stats);
            }, [salesData, currentDate]);

            const displayedHospitals = useMemo(() => {
                return [...hospitalStats].filter(h => h[chartSort] > 0).sort((a, b) => b[chartSort] - a[chartSort]);
            }, [hospitalStats, chartSort]);
            const maxAmount = displayedHospitals.length > 0 ? Math.max(...displayedHospitals.map(d => d[chartSort])) : 1;

            const selectedHospTrendData = useMemo(() => {
                if(!selectedHospDetail) return [];
                const result = [];
                let cumNet = 0;
                for(let m = 1; m <= 12; m++) {
                    const monthData = salesData.filter(d => {
                        const hName = d.hospitalName || d.hospitalname;
                        return d.year === currentDate.year && d.month === m && (selectedHospDetail === '전체 병원 합계' || hName === selectedHospDetail);
                    });
                    const amt = monthData.reduce((sum, d) => sum + Number(d.amount || 0), 0);
                    const comm = monthData.reduce((sum, d) => sum + Number(d.commission || 0), 0);
                    const net = amt - comm;
                    cumNet += net;
                    result.push({ month: m, amount: amt, commission: comm, net: net, cumNet: cumNet });
                }
                return result;
            }, [salesData, currentDate.year, selectedHospDetail]);

            const upcomingBirthdays = useMemo(() => {
                const today = new Date();
                const todayNormalized = new Date(today.getFullYear(), today.getMonth(), today.getDate());
                const currentYear = todayNormalized.getFullYear();
                
                const sorted = doctorProfiles.filter(p => p.birthDate).map(p => {
                    const parts = p.birthDate.split('-');
                    if(parts.length !== 3) return { ...p, dday: 999, calcSolarDate: '' };
                    const m = Number(parts[1]), d = Number(parts[2]);
                    
                    let bday;
                    if (p.isLunar && window.Lunar) {
                        try {
                            let lunarDate = window.Lunar.fromYmd(currentYear, m, d);
                            let solarDate = lunarDate.getSolar();
                            bday = new Date(solarDate.getYear(), solarDate.getMonth() - 1, solarDate.getDay());
                            if (bday.getTime() < todayNormalized.getTime()) {
                                lunarDate = window.Lunar.fromYmd(currentYear + 1, m, d);
                                solarDate = lunarDate.getSolar();
                                bday = new Date(solarDate.getYear(), solarDate.getMonth() - 1, solarDate.getDay());
                            }
                        } catch(e) {
                            bday = new Date(currentYear, m - 1, d);
                            if (bday.getTime() < todayNormalized.getTime()) bday.setFullYear(currentYear + 1);
                        }
                    } else {
                        bday = new Date(currentYear, m - 1, d);
                        if (bday.getTime() < todayNormalized.getTime()) bday.setFullYear(currentYear + 1);
                    }
                    const dday = Math.ceil((bday.getTime() - todayNormalized.getTime()) / (1000 * 60 * 60 * 24));
                    return { ...p, dday, calcSolarDate: `${String(bday.getMonth()+1).padStart(2,'0')}/${String(bday.getDate()).padStart(2,'0')}` };
                }).sort((a,b) => a.dday - b.dday);
                return sorted;
            }, [doctorProfiles]);

            const weeklyBooks = useMemo(() => {
                const books = [
                    { title: '세일즈의 심리학', author: '브라이언 트레이시', summary: '고객의 마음을 여는 강력한 세일즈 기법.', price: 16000, discount: 14400, link: '교보문고 구매 가능' },
                    { title: '기브 앤 테이크', author: '애덤 그랜트', summary: '타인을 돕는 이타적인 사람이 결국 성공한다.', price: 18000, discount: 16200, link: '알라딘 구매 가능' },
                    { title: '설득의 심리학', author: '로버트 치알디니', summary: '마음을 사로잡고 설득하는 6가지 불변의 법칙.', price: 22000, discount: 19800, link: '인터넷 서점 최저가' },
                    { title: '인간관계론', author: '데일 카네기', summary: '원만한 관계를 맺는 최고의 고전.', price: 11500, discount: 10350, link: 'YES24 구매 가능' },
                    { title: '부를 끌어당기는 생각', author: '나폴레온 힐', summary: '부와 성공을 성취하는 마인드셋.', price: 15000, discount: 13500, link: '쿠팡 로켓배송' },
                    { title: '더 골 (The Goal)', author: '엘리 골드랫', summary: '목표 달성을 돕는 비즈니스 소설.', price: 20000, discount: 18000, link: '교보문고 구매 가능' },
                    { title: '초격차', author: '권오현', summary: '대체 불가능한 조직의 조건.', price: 17000, discount: 15300, link: 'YES24 구매 가능' },
                    { title: '아주 작은 습관의 힘', author: '제임스 클리어', summary: '작은 습관이 만드는 복리 효과.', price: 16000, discount: 14400, link: '알라딘 구매 가능' }
                ];
                const now = new Date();
                const weeksSinceEpoch = Math.floor((now.getTime() - now.getDay() * 86400000) / (1000 * 60 * 60 * 24 * 7));
                const startIdx = (weeksSinceEpoch * 5) % books.length;
                const selected = [];
                for (let i = 0; i < 5; i++) { selected.push(books[(startIdx + i) % books.length]); }
                return selected;
            }, []);

            const generateAiRecommendation = async (profile) => {
                setIsAiLoading(true);
                try {
                    const payload = { contents: [{ parts: [{ text: `제약영업사원이 원장님(이름: ${profile.doctorName}, 관심사: ${profile.likes}) 생일 선물 1개와 짧은 멘트를 추천해줘.` }] }] };
                    const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
                    });
                    const result = await response.json();
                    const aiText = result.candidates[0].content.parts[0].text;
                    setAiGiftMessage(prev => ({ ...prev, [profile.id]: aiText }));
                } catch(e) {
                    const rec = profile.likes ? profile.likes.split(',')[0] : '건강';
                    setAiGiftMessage(prev => ({ ...prev, [profile.id]: `🎁 [기본 추천] ${rec} 맞춤 프리미엄 용품` }));
                }
                setIsAiLoading(false);
            };

            const handleManualAmtChange = (e) => {
                const rawValue = e.target.value.replace(/[^0-9]/g, "");
                setManualAmt(rawValue ? new Intl.NumberFormat('ko-KR').format(Number(rawValue)) : '');
            };

            const handleManualCommChange = (e) => {
                if (commType === 'percent') {
                    setManualComm(e.target.value.replace(/[^0-9.]/g, ""));
                } else {
                    const rawValue = e.target.value.replace(/[^0-9]/g, "");
                    setManualComm(rawValue ? new Intl.NumberFormat('ko-KR').format(Number(rawValue)) : '');
                }
            };

            // 1번 요청: 이중 우회 로직으로 RLS 컬럼명 대소문자 문제 완벽 해결
            const handleManualSubmit = async () => {
                const numericAmt = Math.ceil(Number(manualAmt.replace(/,/g, '')));
                let numericComm = 0;
                if (commType === 'percent') numericComm = Math.ceil(numericAmt * ((Number(manualComm)||0) / 100));
                else numericComm = Math.ceil(Number(manualComm.replace(/,/g, ''))) || 0;
                
                if (!manualHosp || !numericAmt) return showToast('병원명과 매출액을 입력해주세요.', 'error');
                
                const newRecord1 = { year: adminDate.year, month: adminDate.month, hospitalName: manualHosp, amount: numericAmt, commission: numericComm };
                const newRecord2 = { year: adminDate.year, month: adminDate.month, hospitalname: manualHosp, amount: numericAmt, commission: numericComm }; // 우회용 소문자
                
                try {
                    let response = await fetch(`${SUPABASE_URL}/rest/v1/sales_data`, {
                        method: 'POST',
                        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=representation' },
                        body: JSON.stringify(newRecord1)
                    });

                    if (!response.ok) {

                            method: 'POST',
                            headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=representation' },
                            body: JSON.stringify(newRecord2)
                        });
                    }

                    if (!response.ok) {
                        const err = await response.text();
                        throw new Error(err);
                    }
                    
                    await fetchRealtimeData(); // 즉시 전체 동기화
                    showToast(`${manualHosp} 등록 완료`, 'success');
                    if (!hospitalMaster.includes(manualHosp)) setHospitalMaster(prev => [...prev, manualHosp].sort());
                    setManualHosp(''); setManualAmt(''); setManualComm('');

                    showToast('서버 저장 실패! 테이블 컬럼명 또는 DB 권한을 확인하세요.', 'error');

                    }

                                            <React.Fragment>
                                                <div className="flex flex-col sm:flex-row gap-4">
                                                    <div className="flex-1 bg-emerald-50 rounded-2xl p-4 border border-emerald-100 shadow-sm"><p className="text-sm text-emerald-800 font-bold mb-1">당월 순수익</p><p className="text-2xl font-black text-emerald-700">{formatCurr(currentData.net)}</p></div>
                                                    <div className="flex-1 bg-blue-50 rounded-2xl p-4 border border-blue-100 shadow-sm"><p className="text-sm text-blue-800 font-bold mb-1">누적 순수익</p><p className="text-2xl font-black text-blue-700">{formatCurr(currentData.cumNet)}</p></div>
                                                </div>
                                                <div className="h-56 w-full bg-white rounded-2xl p-4 border border-gray-100 flex items-center shadow-sm">
                                                    <svg className="w-full h-full pt-4" viewBox="0 0 1200 400" preserveAspectRatio="none">
                                                        {[100, 200, 300].map(y => (<line key={y} x1="40" y1={y} x2="1160" y2={y} stroke="#f1f5f9" strokeWidth="2" strokeDasharray="10,10" />))}
                                                        {(() => {
                                                            const maxNet = Math.max(...selectedHospTrendData.map(d => d.net)) || 1;
                                                            const maxCum = Math.max(...selectedHospTrendData.map(d => d.cumNet)) || 1;
                                                            const pts = selectedHospTrendData.map((d, i) => `${70 + (i/11)*1060},${320 - Math.max((d.cumNet/maxCum)*260,0)}`).join(' ');
                                                            return (
                                                                <React.Fragment>
                                                                    {selectedHospTrendData.map((d, i) => {
                                                                        const x = 70 + (i / 11) * 1060; const barH = Math.max((d.net / maxNet) * 220, 0); const barY = 320 - barH;
                                                                        return <g key={`bar-${i}`}>{barH > 0 && <rect x={x-20} y={barY} width="40" height={barH} fill="#6ee7b7" rx="6" className="opacity-80"/>}<text x={x} y={365} fontSize="22" fill="#64748b" textAnchor="middle" fontWeight="bold">{d.month}월</text></g>;
                                                                    })}
                                                                    <polyline points={pts} fill="none" stroke="#3b82f6" strokeWidth="5" className="drop-shadow-lg" style={{strokeDasharray: 3000, strokeDashoffset: 0, animation: 'dash 1.5s ease-out forwards'}}/>
                                                                </React.Fragment>
                                                            );
                                                        })()}
                                                    </svg>
                                                </div>
                                            </React.Fragment>
                                        );
                                    })()}
                                </div>
                            </div>
                        </div>
                    )}

                    {showTaxModal && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-3xl p-6 w-full max-w-md shadow-2xl relative max-h-[96vh] overflow-y-auto no-scrollbar">
                                <button onClick={() => setShowTaxModal(false)} className="absolute top-4 right-4 text-gray-400 hover:text-gray-800 bg-gray-100 rounded-full w-8 h-8 flex items-center justify-center transition hover:bg-gray-200"><i className="fas fa-times"></i></button>
                                <h3 className="font-black text-xl mb-2 text-gray-800"><i className="fas fa-file-invoice-dollar text-emerald-500 mr-2"></i>세금납부 상세 시뮬레이션</h3>
                                <p className="text-xs text-gray-500 mb-5 pb-4 border-b border-gray-100 leading-relaxed">데이터 기반 3중 교차 검증 적용 완료. 과세기간에 맞춰 매입비용 및 필요경비를 입력하면 실시간으로 정확한 세액이 자동 산출됩니다.</p>
                                <div className="space-y-4 mb-6">
                                    <div className="bg-gray-50 p-4 rounded-xl border border-gray-200 shadow-inner">
                                        <label className="text-xs font-bold text-gray-600 block mb-2"><i className="fas fa-receipt mr-1 text-emerald-500"></i> 부가가치세 매입비용 (과세표준 산출용)</label>
                                        <input type="text" value={vatCostOption === 0 ? '' : new Intl.NumberFormat('ko-KR').format(vatCostOption)} onChange={(e) => { const raw = e.target.value.replace(/[^0-9]/g, ""); setVatCostOption(Number(raw)); }} placeholder={`해당 반기(${taxEstimate.vatPeriod}) 매입액 입력`} className="w-full bg-white border border-gray-300 text-gray-800 text-sm font-bold rounded-lg focus:ring-2 focus:ring-emerald-400 outline-none p-3 shadow-sm transition" />
                                    </div>
                                    <div className="bg-gray-50 p-4 rounded-xl border border-gray-200 shadow-inner">
                                        <label className="text-xs font-bold text-gray-600 block mb-2"><i className="fas fa-file-invoice mr-1 text-amber-500"></i> 종합소득세 필요경비 (과세표준 산출용)</label>
                                        <input type="text" value={incCostOption === 0 ? '' : new Intl.NumberFormat('ko-KR').format(incCostOption)} onChange={(e) => { const raw = e.target.value.replace(/[^0-9]/g, ""); setIncCostOption(Number(raw)); }} placeholder={`해당 연도(${currentDate.year}년) 필요경비 입력`} className="w-full bg-white border border-gray-300 text-gray-800 text-sm font-bold rounded-lg focus:ring-2 focus:ring-amber-400 outline-none p-3 shadow-sm transition" />
                                    </div>
                                </div>
                                <div className="space-y-3 mb-5">
                                    <div className="bg-emerald-50 rounded-xl p-4 border border-emerald-100 relative shadow-sm"><div className="absolute -top-3 right-4 bg-emerald-500 text-white text-xs font-black px-3 py-1 rounded-full shadow-md">D-{taxEstimate.diffVat}</div><div className="flex justify-between items-end mb-1"><span className="font-bold text-base text-emerald-900">1. 부가가치세 <span className="text-xs font-normal text-emerald-700 block mt-1">{taxEstimate.vatPeriod} 매출: <span className="font-bold">{formatCurr(taxEstimate.vatSales)}</span></span></span><span className="font-black text-xl text-emerald-800">{formatCurr(taxEstimate.vat)}</span></div><div className="text-xs text-emerald-600 font-bold bg-white px-3 py-1.5 rounded-lg mt-2 text-right w-full border border-emerald-100">예정 납부일: {taxEstimate.nextVatDateStr}</div></div>
                                    <div className="bg-amber-50 rounded-xl p-4 border border-amber-100 relative shadow-sm"><div className="absolute -top-3 right-4 bg-amber-500 text-white text-xs font-black px-3 py-1 rounded-full shadow-md">D-{taxEstimate.diffInc}</div><div className="flex justify-between items-end mb-1"><span className="font-bold text-base text-amber-900">2. 종합소득세 <span className="text-xs font-normal text-amber-700 block mt-1">{currentDate.year}년 연간 매출: <span className="font-bold">{formatCurr(taxEstimate.incSales)}</span></span></span><span className="font-black text-xl text-amber-800">{formatCurr(taxEstimate.incTax)}</span></div><div className="text-xs text-amber-600 font-bold bg-white px-3 py-1.5 rounded-lg mt-2 text-right w-full border border-amber-100">정기 신고일: {taxEstimate.incDateStr}</div></div>
                                    <div className="bg-blue-50 rounded-xl p-4 border border-blue-100 shadow-sm"><div className="flex justify-between items-center"><span className="font-bold text-base text-blue-900">3. 지방소득세 <span className="text-xs font-normal text-blue-700 ml-1">(종소세의 10%)</span></span><span className="font-black text-xl text-blue-800">{formatCurr(taxEstimate.localTax)}</span></div></div>
                                    <div className="flex justify-between items-center bg-gray-900 p-5 rounded-xl shadow-lg mt-4 border border-gray-700"><span className="font-bold text-gray-300 text-base">합계 예상 세액</span><span className="font-black text-white text-2xl tracking-tight">{formatCurr(taxEstimate.totalTax)}</span></div>
                                </div>
                                <div className="bg-gray-50 p-4 rounded-xl border border-gray-200 flex gap-3 items-start"><i className="fas fa-info-circle text-gray-400 mt-1 text-lg"></i><p className="text-sm font-bold text-gray-600 leading-relaxed">{taxEstimate.comment}</p></div>
                            </div>
                        </div>
                    )}

                    {bookModal && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4" onClick={() => setBookModal(null)}>
                            <div className="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl relative animate-[fadeIn_0.2s_ease-out]" onClick={e => e.stopPropagation()}><button onClick={() => setBookModal(null)} className="absolute top-4 right-4 text-gray-400 hover:text-gray-800 bg-gray-100 rounded-full w-8 h-8 flex items-center justify-center transition hover:bg-gray-200"><i className="fas fa-times"></i></button><div className="bg-amber-50 w-14 h-14 rounded-full flex items-center justify-center text-amber-500 mb-5 shadow-inner"><i className="fas fa-book text-2xl"></i></div><h3 className="font-black text-xl mb-2 text-gray-800">{bookModal.title}</h3><p className="text-sm font-bold text-amber-600 mb-4 pb-3 border-b border-gray-100">{bookModal.author}</p><p className="text-gray-600 text-sm leading-relaxed whitespace-pre-wrap mb-6 bg-gray-50 p-4 rounded-xl border border-gray-100">{bookModal.summary}</p><div className="bg-rose-50 p-4 rounded-xl border border-rose-100"><div className="flex justify-between text-xs mb-1.5 text-rose-400"><span className="line-through font-bold">정가: {new Intl.NumberFormat('ko-KR').format(bookModal.price)}원</span></div><div className="flex justify-between items-center"><span className="font-bold text-sm text-rose-900">인터넷 할인가</span><span className="font-black text-rose-600 text-xl">{new Intl.NumberFormat('ko-KR').format(bookModal.discount)}원</span></div></div></div>
                        </div>
                    )}

                    {selectedDocDetail && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4" onClick={() => setSelectedDocDetail(null)}>
                            <div className="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl relative animate-[fadeIn_0.2s_ease-out]" onClick={e => e.stopPropagation()}>
                                <button onClick={() => setSelectedDocDetail(null)} className="absolute top-4 right-4 text-gray-400 hover:text-gray-800 w-8 h-8 flex items-center justify-center bg-gray-100 rounded-full transition hover:bg-gray-200"><i className="fas fa-times"></i></button>
                                
                                <div className="flex items-center gap-4 mb-5 border-b border-gray-100 pb-5">
                                    <div className="w-14 h-14 rounded-full bg-indigo-50 text-indigo-500 flex items-center justify-center text-2xl shrink-0 shadow-inner"><i className="fas fa-user-md"></i></div>
                                    <div>
                                        <h3 className="font-black text-xl text-gray-800 flex items-center gap-1.5">{selectedDocDetail.doctorName} <span className="text-sm font-bold text-indigo-500">원장님</span></h3>
                                        <p className="text-sm font-bold text-gray-500 mt-1">{selectedDocDetail.hospitalName}</p>
                                    </div>
                                </div>
                                
                                <div className="space-y-3">
                                    <div className="bg-gray-50 p-3.5 rounded-xl border border-gray-100 flex items-center justify-between shadow-sm">
                                        <span className="text-sm font-bold text-gray-500"><i className="fas fa-birthday-cake text-pink-400 mr-2"></i>생년월일</span>
                                        <span className="text-base font-black text-gray-800">{selectedDocDetail.birthDate} <span className={`text-[10px] px-2 py-0.5 rounded-md ml-1.5 ${selectedDocDetail.isLunar ? 'bg-amber-100 text-amber-700' : 'bg-blue-100 text-blue-700'}`}>{selectedDocDetail.isLunar ? '음력' : '양력'}</span></span>
                                    </div>
                                    <div className="bg-gray-50 p-3.5 rounded-xl border border-gray-100 flex items-center justify-between shadow-sm">
                                        <span className="text-sm font-bold text-gray-500"><i className="fas fa-heart text-rose-400 mr-2"></i>관심사</span>
                                        <span className="text-sm font-bold text-gray-700">{selectedDocDetail.likes || '-'}</span>
                                    </div>
                                    <div className="bg-gray-50 p-3.5 rounded-xl border border-gray-100 flex items-center justify-between shadow-sm">
                                        <span className="text-sm font-bold text-gray-500"><i className="fas fa-users text-emerald-500 mr-2"></i>가족사항</span>
                                        <span className="text-sm font-bold text-gray-700">{selectedDocDetail.family || '미입력'}</span>
                                    </div>
                                    <div className="bg-indigo-50 p-4 rounded-xl border border-indigo-100 flex flex-col gap-2 mt-5 shadow-inner">
                                        <div className="flex justify-between items-center"><span className="text-sm font-bold text-indigo-800"><i className="fas fa-calendar-check text-indigo-500 mr-2"></i>올해 생일(양력)</span><span className="text-sm font-bold text-indigo-600">{selectedDocDetail.calcSolarDate}</span></div>
                                        <div className="text-center bg-white py-2 rounded-lg border border-indigo-100 shadow-sm mt-1 font-black text-pink-500 text-lg tracking-wide">D-{selectedDocDetail.dday === 0 ? 'DAY' : selectedDocDetail.dday}</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {toast && <div className={`fixed bottom-6 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-full text-sm font-bold shadow-2xl z-50 text-white ${toast.type === 'error' ? 'bg-rose-500' : 'bg-gray-800'} transition-all flex items-center gap-3 animate-[fadeIn_0.3s_ease-out]`}><i className={`fas ${toast.type === 'error' ? 'fa-exclamation-circle' : 'fa-check-circle'} text-lg`}></i> {toast.msg}</div>}
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
