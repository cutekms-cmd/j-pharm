<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J PHARM Sales Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lunar-javascript/lunar.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; overflow: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .chart-bar { transition: width 1s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden text-gray-800 bg-sky-50/30">
    <div id="root" class="h-full w-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const getDefaultDate = () => {
            const today = new Date();
            return { year: today.getFullYear(), month: today.getMonth() + 1 };
        };

        const formatCurr = (num) => new Intl.NumberFormat('ko-KR').format(Math.ceil(Number(num))) + '원';
        const fmtTemp = (t) => t !== undefined ? Number(t).toFixed(1) : '-';
        
        const getWeatherIcon = (code) => {
            if (code === 0) return '☀️';
            if (code === 1 || code === 2 || code === 3) return '⛅';
            if (code === 45 || code === 48) return '🌫️';
            if (code >= 51 && code <= 67) return '🌧️';
            if (code >= 71 && code <= 77) return '❄️';
            if (code >= 80 && code <= 82) return '🌦️';
            if (code >= 95) return '⛈️';
            return '☁️';
        };
        
        const formatDateWithDay = (date) => {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}년 ${m}월 ${d}일`;
        };

        function App() {
            const [view, setView] = useState('main'); 
            const [salesData, setSalesData] = useState(() => {
                const saved = localStorage.getItem('jpharm_sales_data');
                return saved ? JSON.parse(saved) : [];
            });
            const [settings, setSettings] = useState(() => {
                const saved = localStorage.getItem('jpharm_settings');
                return saved ? JSON.parse(saved) : { 
                    adminPin: '6969', logoText: 'J PHARM.', logoImage: '', bannerImage: '',
                    monthlyTargets: {} 
                };
            });
            const [hospitalMaster, setHospitalMaster] = useState(() => {
                const saved = localStorage.getItem('jpharm_hospital_master');
                return saved ? JSON.parse(saved) : ['서울대병원', '아산병원', '세브란스', '삼성의료원', '성모병원'];
            });
            const [doctorProfiles, setDoctorProfiles] = useState(() => {
                const saved = localStorage.getItem('jpharm_doctor_profiles');
                return saved ? JSON.parse(saved) : [];
            });

            const [currentDate, setCurrentDate] = useState(getDefaultDate());
            const [toast, setToast] = useState(null);
            const [loginPin, setLoginPin] = useState("");
            const [isConnected, setIsConnected] = useState(navigator.onLine);
            
            // Admin Form States
            const [adminTab, setAdminTab] = useState('data');
            const [adminDate, setAdminDate] = useState(getDefaultDate());
            const [newAdminPin, setNewAdminPin] = useState('');
            const [manualHosp, setManualHosp] = useState('');
            const [manualAmt, setManualAmt] = useState('');
            const [manualComm, setManualComm] = useState('');
            const [commType, setCommType] = useState('fixed'); 
            
            const [newDoc, setNewDoc] = useState({ hospitalName: '', doctorName: '', birthDate: '', isLunar: false, likes: '', family: '' });
            
            // Edit States
            const [editingSalesId, setEditingSalesId] = useState(null);
            const [editSalesForm, setEditSalesForm] = useState({});
            const [editingDocId, setEditingDocId] = useState(null);
            const [editDocForm, setEditDocForm] = useState({});

            // Pagination
            const [adminSalesPage, setAdminSalesPage] = useState(1);
            const [adminDocPage, setAdminDocPage] = useState(1);
            const [bdayPage, setBdayPage] = useState(1);
            const [rankPage, setRankPage] = useState(1);

            // Modals & Charts
            const [showTaxModal, setShowTaxModal] = useState(false);
            const [hospModalData, setHospModalData] = useState(null);
            const [selectedDocDetail, setSelectedDocDetail] = useState(null);
            const [selectedBook, setSelectedBook] = useState(null);
            
            const [chartSort, setChartSort] = useState('current'); 
            const [chartRendered, setChartRendered] = useState(false);
            
            const [vatCostOption, setVatCostOption] = useState(''); 
            const [incCostOption, setIncCostOption] = useState('');
            const [weatherData, setWeatherData] = useState(null);
            const [targetViewYear, setTargetViewYear] = useState(getDefaultDate().year);

            // LocalStorage Sync
            useEffect(() => { localStorage.setItem('jpharm_sales_data', JSON.stringify(salesData)); }, [salesData]);
            useEffect(() => { localStorage.setItem('jpharm_settings', JSON.stringify(settings)); }, [settings]);
            useEffect(() => { localStorage.setItem('jpharm_hospital_master', JSON.stringify(hospitalMaster)); }, [hospitalMaster]);
            useEffect(() => { localStorage.setItem('jpharm_doctor_profiles', JSON.stringify(doctorProfiles)); }, [doctorProfiles]);

            useEffect(() => {
                const fetchWeather = async () => {
                    try {
                        const [wonjuRes, jecheonRes] = await Promise.all([
                            fetch('https://api.open-meteo.com/v1/forecast?latitude=37.3422&longitude=127.9202&daily=temperature_2m_max,temperature_2m_min,weathercode&timezone=Asia%2FSeoul&forecast_days=2'),
                            fetch('https://api.open-meteo.com/v1/forecast?latitude=37.1326&longitude=128.2141&daily=temperature_2m_max,temperature_2m_min,weathercode&timezone=Asia%2FSeoul&forecast_days=2')
                        ]);
                        const wonjuData = await wonjuRes.json();
                        const jecheonData = await jecheonRes.json();
                        if (wonjuData.daily && jecheonData.daily) {
                            setWeatherData({ wonju: wonjuData.daily, jecheon: jecheonData.daily });
                        }
                    } catch(e) { console.error(e); }
                };
                if (navigator.onLine) fetchWeather();
                
                const handleOnline = () => { setIsConnected(true); fetchWeather(); };
                const handleOffline = () => { setIsConnected(false); };
                window.addEventListener('online', handleOnline);
                window.addEventListener('offline', handleOffline);
                setTimeout(() => setChartRendered(true), 300);
                return () => { window.removeEventListener('online', handleOnline); window.removeEventListener('offline', handleOffline); };
            }, []);

            const showToast = (msg, type='info') => {
                setToast({msg, type});
                setTimeout(() => setToast(null), 3000);
            };

            const filteredData = useMemo(() => salesData.filter(d => d.year === currentDate.year && d.month === currentDate.month), [salesData, currentDate]);
            const ytdData = useMemo(() => salesData.filter(d => d.year === currentDate.year && d.month <= currentDate.month), [salesData, currentDate]);

            const monthlyTotal = useMemo(() => filteredData.reduce((sum, curr) => sum + Number(curr.amount || 0), 0), [filteredData]);
            const monthlyCommTotal = useMemo(() => filteredData.reduce((sum, curr) => sum + Number(curr.commission || 0), 0), [filteredData]);
            const monthlyNetIncome = monthlyTotal - monthlyCommTotal;
            
            const currentMonthTarget = useMemo(() => settings.monthlyTargets[`${currentDate.year}-${currentDate.month}`] || 0, [settings.monthlyTargets, currentDate]);
            const monthlyAchieve = currentMonthTarget > 0 ? Math.min(100, Math.round((monthlyTotal / currentMonthTarget) * 100)) : 0;

            const ytdTotal = useMemo(() => ytdData.reduce((sum, curr) => sum + Number(curr.amount || 0), 0), [ytdData]);
            const ytdCommTotal = useMemo(() => ytdData.reduce((sum, curr) => sum + Number(curr.commission || 0), 0), [ytdData]);
            const ytdNetIncome = ytdTotal - ytdCommTotal;
            
            const currentYearTarget = useMemo(() => {
                let total = 0;
                for(let i=1; i<=12; i++) total += (settings.monthlyTargets[`${currentDate.year}-${i}`] || 0);
                return total;
            }, [settings.monthlyTargets, currentDate.year]);
            const yearlyAchieve = currentYearTarget > 0 ? Math.min(100, Math.round((ytdTotal / currentYearTarget) * 100)) : 0;

            const hospitalStats = useMemo(() => {
                const stats = {};
                salesData.forEach(d => {
                    if (d.year === currentDate.year && d.month <= currentDate.month) {
                        if (!stats[d.hospitalName]) stats[d.hospitalName] = { id: d.hospitalName, hospitalName: d.hospitalName, current: 0, accumulated: 0 };
                        const net = Number(d.amount || 0) - Number(d.commission || 0);
                        if (d.month === currentDate.month) stats[d.hospitalName].current += net;
                        stats[d.hospitalName].accumulated += net;
                    }
                });
                return Object.values(stats);
            }, [salesData, currentDate]);

            const displayedHospitals = useMemo(() => [...hospitalStats].filter(h => h[chartSort] > 0).sort((a, b) => b[chartSort] - a[chartSort]), [hospitalStats, chartSort]);
            const maxAmount = displayedHospitals.length > 0 ? Math.max(...displayedHospitals.map(d => d[chartSort])) : 1;
            
            const totalRankPages = Math.max(1, Math.ceil(displayedHospitals.length / 5));
            const currentRankData = displayedHospitals.slice((rankPage - 1) * 5, rankPage * 5);

            const openHospModal = (hName) => {
                if(!hName) return;
                const doc = doctorProfiles.find(d => d.hospitalName === hName);
                const hSales = salesData.filter(d => d.hospitalName === hName && d.year === currentDate.year && d.month <= currentDate.month);
                
                const curSales = hSales.filter(d => d.month === currentDate.month);
                const curAmt = curSales.reduce((s, d) => s + Number(d.amount||0), 0);
                const curComm = curSales.reduce((s, d) => s + Number(d.commission||0), 0);
                
                const accAmt = hSales.reduce((s, d) => s + Number(d.amount||0), 0);
                const accComm = hSales.reduce((s, d) => s + Number(d.commission||0), 0);

                setHospModalData({
                    hospitalName: hName,
                    doctorName: doc ? doc.doctorName : '미등록',
                    curAmt, curComm, curNet: curAmt - curComm,
                    accAmt, accComm, accNet: accAmt - accComm
                });
            };

            const taxEstimate = useMemo(() => {
                const today = new Date();
                const y = today.getFullYear();
                let vatD1 = new Date(y, 0, 25); let vatD2 = new Date(y, 6, 25);
                if(today > vatD2) vatD1 = new Date(y+1, 0, 25);
                const nextVatDate = (today <= vatD1 || today > vatD2) ? vatD1 : vatD2;
                
                const realVatYear = nextVatDate.getMonth() === 0 ? nextVatDate.getFullYear() - 1 : nextVatDate.getFullYear();
                const vatPeriod = nextVatDate.getMonth() === 0 ? `${realVatYear}년 2기 (7.1~12.31)` : `${realVatYear}년 1기 (1.1~6.30)`;
                const isFirstHalf = nextVatDate.getMonth() !== 0;
                
                let incDate = new Date(y, 4, 31);
                if(today > incDate) incDate = new Date(y+1, 4, 31);
                const incPeriod = `${incDate.getFullYear()-1}년 (1.1~12.31)`;

                const vatSales = salesData.filter(d => d.year === realVatYear && (isFirstHalf ? d.month <= 6 : d.month > 6)).reduce((sum, curr) => sum + Number(curr.amount || 0), 0);
                const incSales = salesData.filter(d => d.year === incDate.getFullYear()-1).reduce((sum, curr) => sum + Number(curr.amount || 0), 0);
                
                const vCost = Number(vatCostOption.replace(/,/g, '')) || 0;
                const iCost = Number(incCostOption.replace(/,/g, '')) || 0;

                const vat = Math.max(0, Math.ceil(vatSales * 0.1) - Math.ceil(vCost * 0.1)); 
                const netRevenue = Math.max(0, incSales - iCost);
                let incTax = 0;
                
                if (netRevenue <= 14000000) { incTax = netRevenue * 0.06; }
                else if (netRevenue <= 50000000) { incTax = 840000 + (netRevenue - 14000000) * 0.15; }
                else if (netRevenue <= 88000000) { incTax = 6240000 + (netRevenue - 50000000) * 0.24; }
                else if (netRevenue <= 150000000) { incTax = 15360000 + (netRevenue - 88000000) * 0.35; }
                else { incTax = 37060000 + (netRevenue - 150000000) * 0.38; }
                
                const localTax = Math.ceil(incTax * 0.1); 

                const diffVat = Math.ceil((nextVatDate - today)/(1000*60*60*24));
                const diffInc = Math.ceil((incDate - today)/(1000*60*60*24));
                
                return { vat, incTax, localTax, totalTax: vat + incTax + localTax, nextVatDateStr: formatDateWithDay(nextVatDate), vatPeriod, diffVat, incDateStr: formatDateWithDay(incDate), incPeriod, diffInc, vatSales, incSales };
            }, [salesData, vatCostOption, incCostOption]);

            const upcomingBirthdays = useMemo(() => {
                const today = new Date();
                const todayNorm = new Date(today.getFullYear(), today.getMonth(), today.getDate());
                const curY = todayNorm.getFullYear();
                
                return doctorProfiles.filter(p => p.birthDate).map(p => {
                    const parts = p.birthDate.split('-');
                    if(parts.length !== 3) return { ...p, dday: 999, calcSolarDate: '' };
                    const m = Number(parts[1]), d = Number(parts[2]);
                    let bday;
                    if (p.isLunar && window.Lunar) {
                        try {
                            let lunar = window.Lunar.fromYmd(curY, m, d);
                            let solar = lunar.getSolar();
                            bday = new Date(solar.getYear(), solar.getMonth() - 1, solar.getDay());
                            if (bday < todayNorm) {
                                lunar = window.Lunar.fromYmd(curY + 1, m, d);
                                solar = lunar.getSolar();
                                bday = new Date(solar.getYear(), solar.getMonth() - 1, solar.getDay());
                            }
                        } catch(e) { bday = new Date(curY, m - 1, d); }
                    } else {
                        bday = new Date(curY, m - 1, d);
                        if (bday < todayNorm) bday.setFullYear(curY + 1);
                    }
                    const dday = Math.ceil((bday - todayNorm) / (1000 * 60 * 60 * 24));
                    return { ...p, dday, calcSolarDate: `${String(bday.getMonth()+1).padStart(2,'0')}.${String(bday.getDate()).padStart(2,'0')}` };
                }).sort((a,b) => a.dday - b.dday);
            }, [doctorProfiles]);
            const totalBdayPages = Math.max(1, Math.ceil(upcomingBirthdays.length / 5));

            const weeklyBooks = [
                { title: '세일즈의 심리학', author: '브라이언 트레이시', summary: '고객의 마음을 여는 강력한 세일즈 기법과 심리 전술을 다룬 바이블. 어떻게 고객의 방어기제를 허물고 신뢰를 구축할 수 있는지 실전 사례를 통해 배웁니다.', price: 16000, discount: 14400, link: '교보문고, YES24' },
                { title: '기브 앤 테이크', author: '애덤 그랜트', summary: '타인을 돕는 이타적인 사람이 결국 더 큰 성공을 거둔다는 관계의 법칙. 양보와 배려가 어떻게 최고의 비즈니스 성과로 돌아오는지 증명합니다.', price: 18000, discount: 16200, link: '교보문고, 알라딘' },
                { title: '설득의 심리학', author: '로버트 치알디니', summary: '사람의 마음을 사로잡고 승낙을 이끌어내는 6가지 불변의 법칙. 고객이 무의식적으로 "YES"를 외치게 만드는 설득의 비밀을 파헤칩니다.', price: 22000, discount: 19800, link: '인터넷 서점 최저가' },
                { title: '데일 카네기 인간관계론', author: '데일 카네기', summary: '적을 만들지 않고 사람의 마음을 얻는 최고의 고전. 어떻게 하면 논쟁을 피하고 상대를 내 편으로 만들 수 있는지 명쾌한 해답을 줍니다.', price: 11500, discount: 10350, link: 'YES24, 밀리의 서재' },
                { title: '초격차', author: '권오현', summary: '넘볼 수 없는 차이를 만드는 리더와 조직의 조건. 한계를 돌파하고 시장을 주도하는 압도적인 1등이 되기 위한 전략적 사고방식을 제시합니다.', price: 17000, discount: 15300, link: 'YES24' }
            ];

            const dailyQuote = useMemo(() => {
                const quotes = [
                    "사랑하는 아내 김경옥, 눈에 넣어도 아프지 않을 딸 박주아. 가족을 향한 박현재의 땀방울이 내일의 더 큰 기쁨으로 돌아올 것입니다! 화이팅!",
                    "사랑하는 아내 김경옥, 눈에 넣어도 아프지 않을 딸 박주아. 가족의 환한 미소가 박현재의 오늘을 달리게 하는 가장 큰 원동력입니다! 화이팅!",
                    "사랑하는 아내 김경옥, 눈에 넣어도 아프지 않을 딸 박주아. 든든한 가족을 등에 업은 박현재는 오늘도 거침없이 달립니다! 화이팅!"
                ];
                const daysSinceEpoch = Math.floor(new Date().getTime() / (1000 * 60 * 60 * 24));
                return quotes[daysSinceEpoch % quotes.length];
            }, []);

            const loginQuotes = [
                "원장님의 사소한 취향을 기억하는 것, 그것이 마음을 여는 첫걸음입니다.",
                "영업은 단순히 상품을 파는 것이 아니라, 신뢰와 가치를 선물하는 과정입니다.",
                "오늘 건넨 따뜻한 안부 인사 한마디가 내일의 든든한 파트너십을 만듭니다."
            ];
            const todayLoginQuote = loginQuotes[Math.floor(new Date().getTime() / 86400000) % loginQuotes.length];

            const handleManualAmtChange = (e) => {
                const r = e.target.value.replace(/[^0-9]/g, "");
                setManualAmt(r ? new Intl.NumberFormat('ko-KR').format(Number(r)) : '');
            };

            const handleManualCommChange = (e) => {
                if (commType === 'percent') setManualComm(e.target.value.replace(/[^0-9.]/g, ""));
                else {
                    const r = e.target.value.replace(/[^0-9]/g, "");
                    setManualComm(r ? new Intl.NumberFormat('ko-KR').format(Number(r)) : '');
                }
            };

            const handleManualSubmit = () => {
                const numAmt = Math.ceil(Number(manualAmt.replace(/,/g, '')));
                let numComm = 0;
                if (commType === 'percent') numComm = Math.ceil(numAmt * ((Number(manualComm) || 0) / 100));
                else numComm = Math.ceil(Number(manualComm.replace(/,/g, ''))) || 0;
                
                if (!manualHosp || !numAmt) return showToast('병원명과 매출액을 입력해주세요.', 'error');
                
                setSalesData(prev => [{ id: Date.now(), year: adminDate.year, month: adminDate.month, hospitalName: manualHosp, amount: numAmt, commission: numComm }, ...prev]);
                if (!hospitalMaster.includes(manualHosp)) setHospitalMaster(prev => [...prev, manualHosp].sort());
                showToast(`${manualHosp} 등록 완료`, 'success');
                setManualHosp(''); setManualAmt(''); setManualComm('');
            };

            const filteredAdminSales = useMemo(() => salesData.filter(d => d.year === adminDate.year && d.month === adminDate.month), [salesData, adminDate]);
            const totalAdminSalesPages = Math.max(1, Math.ceil(filteredAdminSales.length / 5));
            const currentAdminSalesData = filteredAdminSales.slice((adminSalesPage - 1) * 5, adminSalesPage * 5);
            
            const totalAdminDocPages = Math.max(1, Math.ceil(doctorProfiles.length / 5));
            const currentAdminDocData = doctorProfiles.slice((adminDocPage - 1) * 5, adminDocPage * 5);

            const saveSalesEdit = () => {
                setSalesData(prev => prev.map(item => item.id === editingSalesId ? { ...item, amount: Number(editSalesForm.amount.replace(/,/g,'')), commission: Number(editSalesForm.commission.replace(/,/g,'')) } : item));
                setEditingSalesId(null);
                showToast('매출 수정 완료', 'success');
            };

            const saveDocEdit = () => {
                setDoctorProfiles(prev => prev.map(item => item.id === editingDocId ? { ...item, hospitalName: editDocForm.hospitalName, doctorName: editDocForm.doctorName, birthDate: editDocForm.birthDate, isLunar: editDocForm.isLunar, likes: editDocForm.likes, family: editDocForm.family } : item));
                setEditingDocId(null);
                showToast('프로필 수정 완료', 'success');
            };

            const targetTableData = useMemo(() => {
                let sum = 0;
                const months = [];
                for(let i=1; i<=12; i++) {
                    const amt = settings.monthlyTargets[`${targetViewYear}-${i}`] || 0;
                    sum += amt;
                    months.push(amt);
                }
                return { sum, months };
            }, [settings.monthlyTargets, targetViewYear]);

            // File Uploads
            const handleLogoUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => { setSettings({...settings, logoImage: event.target.result}); showToast('로고 업로드 완료', 'success'); };
                    reader.readAsDataURL(file);
                }
            };
            const handleBannerUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => { setSettings({...settings, bannerImage: event.target.result}); showToast('배너 업로드 완료', 'success'); };
                    reader.readAsDataURL(file);
                }
            };

            const exportSalesCSV = () => {
                if(salesData.length === 0) return showToast('데이터가 없습니다.', 'error');

                                                                                    <div className="flex gap-1 justify-center">
                                                                                        <button onClick={()=>{setEditingDocId(p.id); setEditDocForm({...p});}} className="bg-blue-50 hover:bg-blue-100 text-blue-600 px-3 py-1.5 rounded-lg text-xs font-black transition border border-blue-100 shadow-sm">수정</button>
                                                                                        <button onClick={()=>{if(window.confirm('삭제하시겠습니까?')){setDoctorProfiles(prev=>prev.filter(i=>i.id!==p.id)); showToast('삭제됨','success');}}} className="bg-rose-50 hover:bg-rose-100 text-rose-600 px-3 py-1.5 rounded-lg text-xs font-black transition border border-rose-100 shadow-sm">삭제</button>
                                                                                    </div>
                                                                                </td>
                                                                            </React.Fragment>
                                                                        )}
                                                                    </tr>
                                                                ))}
                                                            </tbody>
                                                        </table>
                                                    </div>}
                                                </div>
                                                {totalAdminDocPages > 1 && <div className="p-4 border-t flex justify-center gap-4 items-center bg-slate-50 shrink-0"><button onClick={()=>setAdminDocPage(p=>Math.max(1, p-1))} className="text-sm font-bold px-4 py-1.5 bg-white border rounded-lg shadow-sm hover:bg-slate-100">&lt;</button><span className="text-base font-black text-slate-700">{adminDocPage} / {totalAdminDocPages}</span><button onClick={()=>setAdminDocPage(p=>Math.min(totalAdminDocPages, p+1))} className="text-sm font-bold px-4 py-1.5 bg-white border rounded-lg shadow-sm hover:bg-slate-100">&gt;</button></div>}
                                            </div>
                                        </div>
                                    )}

                                    {adminTab === 'setting' && (
                                        <div className="grid grid-cols-2 gap-6 h-full">
                                            <div className="bg-white rounded-2xl border border-slate-200 shadow-sm flex flex-col p-6 overflow-hidden">
                                                <h4 className="font-black text-lg mb-4 flex items-center shrink-0"><i className="fas fa-bullseye text-blue-500 mr-2"></i>월별 목표 설정 현황</h4>
                                                <div className="flex gap-2 mb-4 shrink-0">
                                                    <select value={targetViewYear} onChange={e=>setTargetViewYear(Number(e.target.value))} className="border p-3 rounded-xl font-black outline-none bg-slate-50">{[2024,2025,2026,2027].map(y=><option key={y} value={y}>{y}년 조회</option>)}</select>
                                                    <input type="text" id="tAmt" placeholder="일괄입력(선택)" className="flex-1 border p-3 rounded-xl text-sm font-bold outline-none" onInput={e=>{const r=e.target.value.replace(/[^0-9]/g,""); e.target.value=r?new Intl.NumberFormat('ko-KR').format(Number(r)):"";}}/>
                                                    <button onClick={()=>{const amt=Number(document.getElementById('tAmt').value.replace(/,/g,'')); if(!amt) return; const newT={...settings.monthlyTargets}; for(let i=1;i<=12;i++) newT[`${targetViewYear}-${i}`]=amt; setSettings(p=>({...p, monthlyTargets:newT})); showToast('일괄적용 됨','success');}} className="bg-slate-800 text-white px-5 rounded-xl text-sm font-black shadow-sm hover:bg-slate-700 transition">일괄반영</button>
                                                </div>
                                                
                                                {/* Optimization: No vertical scroll, target 12 months + sum fixed view */}
                                                <div className="flex-1 overflow-hidden border rounded-xl border-slate-200">
                                                    <table className="w-full text-base text-center h-full table-fixed">
                                                        <thead className="bg-slate-100 font-black text-slate-600 border-b">
                                                            <tr>
                                                                <th className="py-2.5">월</th>
                                                                <th className="py-2.5">목표액 (원)</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody className="divide-y divide-slate-100">
                                                            {targetTableData.months.map((amt, i) => (
                                                                <tr key={i} className="hover:bg-slate-50 h-[7%]">
                                                                    <td className="py-0 font-black text-slate-700 align-middle">{i+1}월</td>
                                                                    <td className="py-0 font-bold align-middle">
                                                                        <input type="text" value={amt === 0 ? '' : new Intl.NumberFormat('ko-KR').format(amt)} onChange={e=>{const r=e.target.value.replace(/[^0-9]/g,""); const num=Number(r); setSettings(p=>({...p, monthlyTargets:{...p.monthlyTargets, [`${targetViewYear}-${i+1}`]:num}}));}} placeholder="0" className="w-3/4 bg-transparent text-center outline-none focus:border-b-2 border-blue-400 transition py-0.5" />
                                                                    </td>
                                                                </tr>
                                                            ))}
                                                            <tr className="bg-blue-50 font-black text-blue-800 h-[10%]">
                                                                <td className="py-0 align-middle text-lg">연간 합계</td>
                                                                <td className="py-0 align-middle text-2xl">{formatCurr(targetTableData.sum)}</td>
                                                            </tr>
                                                        </tbody>
                                                    </table>
                                                </div>
                                            </div>
                                            <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 space-y-8 flex flex-col">
                                                <div className="shrink-0">
                                                    <h4 className="font-black text-lg mb-4 text-slate-800"><i className="fas fa-paint-brush text-rose-500 mr-2"></i>디스플레이 설정</h4>
                                                    <div className="space-y-4">
                                                        <div>
                                                            <label className="text-xs font-bold text-slate-500 mb-1 block">회사명 텍스트 (로고 미등록 시 출력)</label>
                                                            <input type="text" placeholder="로고 텍스트 입력" className="w-full border p-3 rounded-xl text-sm font-bold bg-slate-50 outline-none" value={settings.logoText || ''} onChange={e=>setSettings({...settings, logoText: e.target.value})} />
                                                        </div>
                                                        <div className="grid grid-cols-2 gap-4">
                                                            <div className="border border-slate-200 p-4 rounded-xl bg-slate-50/50">
                                                                <label className="text-xs font-bold text-slate-500 mb-2 block flex items-center"><i className="fas fa-image mr-1"></i> 상단 로고 이미지</label>
                                                                <input type="file" accept="image/*" onChange={handleLogoUpload} className="w-full text-xs font-bold file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-black file:bg-rose-100 file:text-rose-700 hover:file:bg-rose-200 cursor-pointer" />
                                                                {settings.logoImage && <div className="mt-3 bg-white border p-2 rounded-lg flex justify-center"><img src={settings.logoImage} alt="logo" className="h-6 object-contain" /></div>}
                                                            </div>
                                                            <div className="border border-slate-200 p-4 rounded-xl bg-slate-50/50">
                                                                <label className="text-xs font-bold text-slate-500 mb-2 block flex items-center"><i className="fas fa-camera mr-1"></i> 메인화면 사진(배너)</label>
                                                                <input type="file" accept="image/*" onChange={handleBannerUpload} className="w-full text-xs font-bold file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-black file:bg-blue-100 file:text-blue-700 hover:file:bg-blue-200 cursor-pointer" />
                                                                {settings.bannerImage && <div className="mt-3 bg-white border p-2 rounded-lg flex justify-center"><img src={settings.bannerImage} alt="banner" className="h-6 object-cover rounded" /></div>}
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                                <div className="border-t border-slate-100 pt-6 shrink-0">
                                                    <h4 className="font-black text-lg mb-4 text-slate-800"><i className="fas fa-key text-amber-500 mr-2"></i>보안 비밀번호 변경</h4>
                                                    <div className="flex gap-3">
                                                        <input type="password" placeholder="새 비밀번호 입력" className="flex-1 border p-3 rounded-xl text-sm font-bold bg-slate-50 outline-none" value={newAdminPin} onChange={e=>setNewAdminPin(e.target.value)} />
                                                        <button onClick={()=>{if(newAdminPin){setSettings({...settings, adminPin:newAdminPin}); setNewAdminPin(''); showToast('변경완료','success');}}} className="bg-amber-500 hover:bg-amber-600 text-white px-6 rounded-xl font-black shadow transition">변경</button>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {}
                        {/* TAX Modal */}
                        {showTaxModal && (
                            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 animate-fade-in" onClick={()=>setShowTaxModal(false)}>
                                <div className="bg-white rounded-[2rem] p-8 w-full max-w-md shadow-2xl relative" onClick={e=>e.stopPropagation()}>
                                    <button onClick={()=>setShowTaxModal(false)} className="absolute top-6 right-6 text-slate-400 hover:text-slate-800"><i className="fas fa-times text-2xl"></i></button>
                                    <h3 className="font-black text-2xl mb-6 text-slate-800 flex items-center"><i className="fas fa-file-invoice-dollar text-emerald-500 mr-3 text-3xl"></i>세금 시뮬레이션</h3>
                                    
                                    <div className="space-y-5 mb-6">
                                        <div className="bg-emerald-50/50 p-5 rounded-2xl border border-emerald-100 shadow-sm">
                                            <div className="flex justify-between items-end mb-3 border-b border-emerald-100 pb-3">
                                                <label className="text-sm font-black text-emerald-800 block flex flex-col gap-1">
                                                    <span>부가가치세</span>
                                                    <span className="text-slate-500 font-bold text-xs">{taxEstimate.vatPeriod} 기준</span>
                                                </label>
                                                <span className="text-xs font-black text-emerald-700 bg-emerald-100 px-2 py-1 rounded">등록매출: {formatCurr(taxEstimate.vatSales)}</span>
                                            </div>
                                            <input type="text" placeholder="부가세 매입 비용 입력 (원)" value={vatCostOption} onChange={e=>{const r=e.target.value.replace(/[^0-9]/g,""); setVatCostOption(r?new Intl.NumberFormat('ko-KR').format(Number(r)):"");}} className="w-full bg-white border border-emerald-200 p-3 rounded-xl text-sm font-black outline-none focus:ring-2 focus:ring-emerald-400" />
                                            <div className="text-right mt-3 text-sm font-black text-emerald-700 whitespace-nowrap">예상 부가가치세: {formatCurr(taxEstimate.vat)}</div>
                                        </div>
                                        
                                        <div className="bg-amber-50/50 p-5 rounded-2xl border border-amber-100 shadow-sm">
                                            <div className="flex justify-between items-end mb-3 border-b border-amber-100 pb-3">
                                                <label className="text-sm font-black text-amber-800 block flex flex-col gap-1">
                                                    <span>종합소득세</span>
                                                    <span className="text-slate-500 font-bold text-xs">{taxEstimate.incPeriod} 기준</span>
                                                </label>
                                                <span className="text-xs font-black text-amber-700 bg-amber-100 px-2 py-1 rounded">등록매출: {formatCurr(taxEstimate.incSales)}</span>
                                            </div>
                                            <input type="text" placeholder="종소세 필요 경비 입력 (원)" value={incCostOption} onChange={e=>{const r=e.target.value.replace(/[^0-9]/g,""); setIncCostOption(r?new Intl.NumberFormat('ko-KR').format(Number(r)):"");}} className="w-full bg-white border border-amber-200 p-3 rounded-xl text-sm font-black outline-none focus:ring-2 focus:ring-amber-400" />
                                            <div className="flex justify-between items-center mt-3 text-[11px] font-bold text-amber-800 bg-white/50 p-2 rounded-lg gap-2">
                                                <span className="whitespace-nowrap">지방소득세(+10%): <span className="font-black">{formatCurr(taxEstimate.localTax)}</span></span>
                                                <span className="text-[12px] whitespace-nowrap">예상 종합소득세: <span className="font-black text-sm">{formatCurr(taxEstimate.incTax)}</span></span>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="bg-slate-800 text-white p-5 rounded-2xl flex justify-between items-center shadow-inner">
                                        <span className="font-bold text-sm text-slate-300">총 합산 세액 추정</span>
                                        <span className="font-black text-2xl text-yellow-400">{formatCurr(taxEstimate.totalTax)}</span>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Book Modal */}
                        {selectedBook && (
                            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 animate-fade-in" onClick={()=>setSelectedBook(null)}>
                                <div className="bg-white rounded-[2rem] p-8 w-full max-w-sm shadow-2xl relative" onClick={e=>e.stopPropagation()}>
                                    <button onClick={()=>setSelectedBook(null)} className="absolute top-6 right-6 text-slate-400 hover:text-slate-800"><i className="fas fa-times text-2xl"></i></button>
                                    <div className="text-center mb-6 mt-4">
                                        <h3 className="font-black text-2xl text-slate-800 mb-2">{selectedBook.title}</h3>
                                        <p className="text-sm font-bold text-slate-500">{selectedBook.author}</p>
                                    </div>
                                    <div className="bg-slate-50 p-5 rounded-2xl mb-6 border border-slate-100 shadow-sm relative">
                                        <i className="fas fa-quote-left absolute top-3 left-3 text-slate-200 text-2xl"></i>
                                        <p className="text-sm font-bold leading-relaxed text-slate-700 break-keep relative z-10 pt-4 px-2 text-center">"{selectedBook.summary}"</p>
                                    </div>
                                    <div className="flex justify-between items-end mb-4 px-2">
                                        <span className="text-sm font-bold text-slate-400 line-through">정가 {new Intl.NumberFormat('ko-KR').format(selectedBook.price)}원</span>
                                        <span className="text-2xl font-black text-rose-500">{new Intl.NumberFormat('ko-KR').format(selectedBook.discount)}원</span>
                                    </div>
                                    <div className="bg-emerald-50 text-emerald-700 p-4 rounded-xl text-center font-black text-sm border border-emerald-100 shadow-sm">
                                        <i className="fas fa-shopping-cart mr-2"></i> 추천 구매처: {selectedBook.link}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Hospital / Doctor Details Modal */}
                        {(hospModalData || selectedDocDetail) && (
                            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 animate-fade-in" onClick={()=>{setHospModalData(null); setSelectedDocDetail(null);}}>
                                <div className="bg-white rounded-[2rem] p-8 w-full max-w-sm shadow-2xl relative" onClick={e=>e.stopPropagation()}>
                                    <button onClick={()=>{setHospModalData(null); setSelectedDocDetail(null);}} className="absolute top-6 right-6 text-slate-400 hover:text-slate-800"><i className="fas fa-times text-2xl"></i></button>
                                    
                                    {hospModalData && (
                                        <React.Fragment>
                                            <div className="mb-6 mt-2">
                                                <h3 className="font-black text-2xl text-slate-800 mb-1">{hospModalData.hospitalName}</h3>
                                                <p className="text-sm font-bold text-indigo-600"><i className="fas fa-user-md mr-1"></i>{hospModalData.doctorName} 원장님</p>
                                            </div>
                                            <div className="space-y-4">
                                                <div className="bg-emerald-50 border border-emerald-100 p-5 rounded-2xl flex flex-col gap-3 shadow-sm">
                                                    <div className="text-sm font-black text-emerald-800 border-b border-emerald-200 pb-2">당월 실적 현황</div>
                                                    <div className="flex justify-between items-center text-sm font-black"><span className="text-slate-600">매출</span><span className="text-emerald-700 text-base">{formatCurr(hospModalData.curAmt)}</span></div>
                                                    <div className="flex justify-between items-center text-sm font-bold"><span className="text-slate-500">수수료</span><span className="text-rose-500 text-base">{formatCurr(hospModalData.curComm)}</span></div>
                                                    <div className="flex justify-between items-center text-sm font-black pt-2 border-t border-emerald-200/50"><span className="text-slate-700">당월 순수익</span><span className="text-indigo-700 text-lg">{formatCurr(hospModalData.curNet)}</span></div>
                                                </div>
                                                <div className="bg-blue-50 border border-blue-100 p-5 rounded-2xl flex flex-col gap-3 shadow-sm">
                                                    <div className="text-sm font-black text-blue-800 border-b border-blue-200 pb-2">연간 누적 실적</div>
                                                    <div className="flex justify-between items-center text-sm font-black"><span className="text-slate-600">매출 누적</span><span className="text-blue-700 text-base">{formatCurr(hospModalData.accAmt)}</span></div>
                                                    <div className="flex justify-between items-center text-sm font-black pt-2 border-t border-blue-200/50"><span className="text-slate-700">누적 순수익</span><span className="text-indigo-700 text-lg">{formatCurr(hospModalData.accNet)}</span></div>
                                                </div>
                                            </div>
                                        </React.Fragment>
                                    )}

                                    {selectedDocDetail && (
                                        <React.Fragment>
                                            <div className="text-center mb-6 mt-4">
                                                <div className="w-20 h-20 bg-indigo-100 text-indigo-500 rounded-full flex items-center justify-center text-4xl mx-auto mb-4 shadow-sm"><i className="fas fa-user-md"></i></div>
                                                <h3 className="font-black text-3xl text-slate-800">{selectedDocDetail.doctorName} <span className="text-base text-slate-500 font-bold">원장님</span></h3>
                                                <p className="text-base font-black text-indigo-600 mt-1">{selectedDocDetail.hospitalName}</p>
                                            </div>
                                            <div className="bg-slate-50 p-5 rounded-2xl border border-slate-100 space-y-4 shadow-sm">
                                                <div className="flex items-center text-base"><i className="fas fa-birthday-cake w-8 text-pink-400 text-center text-lg"></i> <span className="font-bold text-slate-600 w-20">생일</span> <span className="font-black text-slate-800">{selectedDocDetail.birthDate} <span className="text-xs text-slate-400 font-bold ml-1">({selectedDocDetail.isLunar?'음력':'양력'})</span></span></div>
                                                <div className="flex items-center text-base"><i className="fas fa-heart w-8 text-rose-400 text-center text-lg"></i> <span className="font-bold text-slate-600 w-20">관심사</span> <span className="font-black text-slate-800">{selectedDocDetail.likes || '정보 없음'}</span></div>
                                                <div className="flex items-center text-base"><i className="fas fa-users w-8 text-teal-400 text-center text-lg"></i> <span className="font-bold text-slate-600 w-20">가족</span> <span className="font-black text-slate-800">{selectedDocDetail.family || '정보 없음'}</span></div>
                                            </div>
                                        </React.Fragment>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* Toast */}
                        {toast && <div className={`fixed bottom-12 left-1/2 transform -translate-x-1/2 px-8 py-3 rounded-full text-base font-black shadow-2xl z-50 text-white ${toast.type==='error'?'bg-rose-500':'bg-slate-800'} animate-fade-in flex items-center gap-3`}><i className={`fas ${toast.type==='error'?'fa-exclamation-triangle':'fa-check-circle'} text-lg`}></i> {toast.msg}</div>}
                    </div>
                </React.Fragment>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
